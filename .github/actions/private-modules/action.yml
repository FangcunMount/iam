name: Read private Go modules
description: Mint a repository-scoped read token and configure temporary Git authentication.
inputs:
  client-id:
    description: Organization GitHub App client ID
    required: true
  private-key:
    description: Organization GitHub App private key
    required: true
outputs:
  config-path:
    description: Temporary credential config; caller removes it in an always step.
    value: ${{ steps.configure.outputs.config-path }}
runs:
  using: composite
  steps:
    - name: Require organization module access
      shell: bash
      env:
        APP_CLIENT_ID: ${{ inputs.client-id }}
        APP_PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
          echo 'Organization SDK access is missing: configure IAM_MODULES_APP_CLIENT_ID and IAM_MODULES_APP_PRIVATE_KEY.' >&2
          exit 1
        fi
    - name: Mint read-only SDK token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: FangcunMount
        repositories: reliable-messaging
        permission-contents: read
    - name: Configure temporary SDK authentication
      id: configure
      shell: bash
      env:
        MODULE_READ_TOKEN: ${{ steps.token.outputs.token }}
      run: bash "${{ github.action_path }}/../../../scripts/ci/configure-private-modules.sh"
