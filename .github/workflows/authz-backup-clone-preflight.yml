name: AuthZ Backup Clone Preflight

on:
  workflow_dispatch:
    inputs:
      expected_iam_sha:
        description: Exact IAM main SHA used to build the maintenance binary
        required: true
        type: string
      backup_name:
        description: Exact verified production backup filename on serverB
        required: true
        type: string
      confirmation:
        description: Type PREFLIGHT_AUTHZ_BACKUP_CLONE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iam-authz-mac-backup-clone-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Restore and Analyze on Mac mini
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    environment:
      name: production
    env:
      IAM_AUTHZ_RELEASE_SHA: ${{ github.event.inputs.expected_iam_sha }}
      IAM_AUTHZ_BACKUP_NAME: ${{ github.event.inputs.backup_name }}
      IAM_AUTHZ_CLONE_CONFIRMATION: ${{ github.event.inputs.confirmation }}
      IAM_AUTHZ_AUTO_DEPLOY_PAUSED: ${{ vars.AUTHZ_CUTOVER_AUTO_DEPLOY_PAUSED }}
    steps:
      - name: Validate immutable clone evidence
        run: |
          set -Eeuo pipefail
          if [ "${#IAM_AUTHZ_RELEASE_SHA}" -ne 40 ] || [ -n "${IAM_AUTHZ_RELEASE_SHA//[0-9a-f]/}" ]; then
            echo "expected_iam_sha must be an exact lowercase 40-character Git SHA" >&2
            exit 1
          fi
          if ! [[ "$IAM_AUTHZ_BACKUP_NAME" =~ ^iam_backup_[0-9]{8}_[0-9]{6}\.sql\.gz$ ]]; then
            echo "backup_name is invalid" >&2
            exit 1
          fi
          if [ "$IAM_AUTHZ_CLONE_CONFIRMATION" != PREFLIGHT_AUTHZ_BACKUP_CLONE ]; then
            echo "invalid backup clone confirmation" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != main ] || [ "$GITHUB_SHA" != "$IAM_AUTHZ_RELEASE_SHA" ]; then
            echo "workflow must run from the exact IAM main SHA" >&2
            exit 1
          fi
          if [ "$IAM_AUTHZ_AUTO_DEPLOY_PAUSED" != true ]; then
            echo "automatic AuthZ production deployment must remain paused during clone diagnosis" >&2
            exit 1
          fi

      - name: Checkout exact IAM release
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IAM_AUTHZ_RELEASE_SHA }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native maintenance binary
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: local
        run: |
          mkdir -p bin
          go build -trimpath -o bin/iam-maintenance ./cmd/iam-maintenance

      - name: Configure read-only serverB backup source
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          RUNNER_SSH_HOST: ${{ vars.SVRB_PUBLIC_HOST || secrets.SVRB_PUBLIC_HOST || vars.SVRB_HOST || vars.SVRA_HOST }}
          RUNNER_SSH_FALLBACK_HOST: ${{ vars.SVRB_HOST || secrets.SVRB_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRB_USERNAME || vars.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRB_SSH_PORT || vars.SVRA_SSH_PORT || 22 }}
          RUNNER_SSH_ALIAS: authz-backup-source
          DEPLOY_NODE_HOSTNAME: serverB
        run: bash scripts/cd/setup-runner-ssh.sh

      - name: Copy exact backup from serverB and verify checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          backup_dir="${RUNNER_TEMP}/iam-authz-backup-clone-${GITHUB_RUN_ID}"
          mkdir -p "$backup_dir"
          chmod 0700 "$backup_dir"
          local_backup="${backup_dir}/${IAM_AUTHZ_BACKUP_NAME}"
          remote_backup="/opt/backups/iam/database/${IAM_AUTHZ_BACKUP_NAME}"
          remote_checksum="$(ssh -F "$RUNNER_SSH_CONFIG" authz-backup-source sha256sum -- "$remote_backup" | awk '{print $1}')"
          if ! [[ "$remote_checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "serverB backup checksum is invalid" >&2
            exit 1
          fi
          scp -F "$RUNNER_SSH_CONFIG" "authz-backup-source:${remote_backup}" "$local_backup"
          chmod 0600 "$local_backup"
          gzip -t "$local_backup"
          local_checksum="$(shasum -a 256 "$local_backup" | awk '{print $1}')"
          if [ "$local_checksum" != "$remote_checksum" ]; then
            echo "backup checksum changed during read-only transfer" >&2
            exit 1
          fi
          echo "IAM_AUTHZ_CLONE_BACKUP_FILE=${local_backup}" >>"$GITHUB_ENV"
          echo "Backup copied read-only from serverB: name=${IAM_AUTHZ_BACKUP_NAME} sha256=${local_checksum}"

      - name: Restore persistent Mac mini clone and run preflight
        env:
          IAM_AUTHZ_CLONE_MYSQL_PASSWORD: ${{ secrets.IAM_AUTHZ_CLONE_MYSQL_PASSWORD }}
        run: bash scripts/cd/authz-mac-clone-preflight.sh

      - name: Cleanup transferred backup and isolated SSH material
        if: always()
        shell: bash
        run: |
          backup_dir="${RUNNER_TEMP}/iam-authz-backup-clone-${GITHUB_RUN_ID}"
          if [ -n "${IAM_AUTHZ_CLONE_BACKUP_FILE:-}" ] && [ -f "$IAM_AUTHZ_CLONE_BACKUP_FILE" ]; then
            rm -f -- "$IAM_AUTHZ_CLONE_BACKUP_FILE"
          fi
          rmdir "$backup_dir" 2>/dev/null || true
          rm -f -- "${RUNNER_SSH_KEY_FILE:-}" "${RUNNER_SSH_CONFIG:-}" 2>/dev/null || true
