name: Production Deploy

# 组织 Variables:
#   SVRA_PUBLIC_HOST（推荐，大文件走公网）, SVRA_HOST, SVRA_USERNAME, SVRA_SSH_PORT
#   IAM_RUNTIME_MYSQL_HOST（Tencent 容器走 mysql-rds-proxy；数据库作业仍用 MYSQL_HOST）
#   QS_DEPLOY_EXPORT_REGISTRY=acr
# 组织 Secrets:
#   SVR_MINI_SSH_KEY（可选，Mac mini 优先）, SVRA_SSH_KEY, SVRA_SUDO_PASSWORD
#   SVRB_SSH_KEY（旧密钥 fallback）
#   ALIYUN_ACR_*, DOCKERHUB_*, WWW_UID, WWW_GID, MYSQL_*, REDIS_*, ...
#
# Deploy job 跑在 Mac mini self-hosted runners（替代原 ServerD）：
#   - 隔离 DOCKER_CONFIG，避免 macOS keychain 卡住 docker login
#   - 镜像上传优先走 SVRA_PUBLIC_HOST（Tailscale DERP 太慢）

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Frozen full main ancestor SHA with successful push CI; supply all three fields to reuse'
        required: false
      candidate_digest:
        description: 'Verified immutable ACR digest; skips image building'
        required: false
      candidate_config_id:
        description: 'Verified linux/amd64 image config ID'
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: iam-production-deploy
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REPOSITORY: fangcunmount
  SERVICE: apiserver
  DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.revision || github.sha }}
  BUILD_TIME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.updated_at || github.event.repository.updated_at }}
  DEPLOY_EXPORT_REGISTRY: ${{ vars.QS_DEPLOY_EXPORT_REGISTRY || 'acr' }}

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - name: Verify frozen image identity contracts
        run: python3 scripts/cd/test_frozen_image_identity.py
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          CANDIDATE_CONFIG_ID: ${{ inputs.candidate_config_id }}
        run: |
          set -Eeuo pipefail
          if [ -n "$REQUESTED_REVISION$CANDIDATE_DIGEST$CANDIDATE_CONFIG_ID" ]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
            [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$CANDIDATE_CONFIG_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$DEPLOY_EXPORT_REGISTRY" == acr ]]
            git merge-base --is-ancestor "$REQUESTED_REVISION" origin/main
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$REQUESTED_REVISION" --event push --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: plan
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment:
      name: production
    if: >-
      needs.plan.result == 'success' && needs.plan.outputs.reuse != 'true' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    env:
      WWW_UID: ${{ secrets.WWW_UID }}
      WWW_GID: ${{ secrets.WWW_GID }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
      ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Test image retention policy
        run: python3 scripts/cd/test_image_retention.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and publish image
        run: |
          make cd-image \
            SERVICE="${SERVICE}" \
            DEPLOY_REF="${DEPLOY_REF}" \
            DEPLOY_SHA="${DEPLOY_SHA}" \
            BUILD_TIME="${BUILD_TIME}"

  deploy:
    name: Deploy to Production
    needs: [plan, docker]
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    environment:
      name: production
      url: https://iam.fangcunmount.cn
    if: |
      always() &&
      vars.PRODUCTION_DEPLOY_PAUSED != 'true' &&
      needs.plan.result == 'success' &&
      (needs.docker.result == 'success' ||
       (needs.plan.outputs.reuse == 'true' && needs.docker.result == 'skipped'))
    env:
      WWW_UID: ${{ secrets.WWW_UID }}
      WWW_GID: ${{ secrets.WWW_GID }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Verify organization public MySQL policy
        env:
          MYSQL_HOST: ${{ vars.MYSQL_PUBLIC_HOST }}
          MYSQL_PORT: ${{ vars.MYSQL_PUBLIC_PORT }}
          MYSQL_TLS_MODE: ${{ vars.MYSQL_TLS_MODE }}
          MYSQL_TLS_CA_REF: ${{ vars.MYSQL_TLS_CA_REF }}
        run: bash scripts/cd/verify-mysql-public-env.sh

      - name: Configure ACR and GHCR auth (isolated config, no keychain)
        if: env.DEPLOY_EXPORT_REGISTRY == 'acr'
        shell: bash
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          GHCR_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # macOS 上 docker login 会默认走 osxkeychain，无 GUI 会话失败 (-25308)。
          # 不跑 docker login，直接把 auth 写进隔离配置。
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "${DOCKER_CONFIG_DIR}"
          ACR_AUTH="$(printf '%s:%s' "${ALIYUN_ACR_USERNAME}" "${ALIYUN_ACR_PASSWORD}" | base64 | tr -d '\n')"
          GHCR_AUTH="$(printf '%s:%s' "${GHCR_USERNAME}" "${GHCR_TOKEN}" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}\n' \
            "${ALIYUN_ACR_REGISTRY}" "${ACR_AUTH}" "${GHCR_REGISTRY}" "${GHCR_AUTH}" \
            > "${DOCKER_CONFIG_DIR}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG_DIR}" >> "${GITHUB_ENV}"

      - name: Export the verified frozen candidate without rebuilding
        if: needs.plan.outputs.reuse == 'true'
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          CANDIDATE_CONFIG_ID: ${{ inputs.candidate_config_id }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: |
          set -Eeuo pipefail
          . scripts/cd/image-metadata.sh
          image="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_NAMESPACE/$IMAGE_NAME@$CANDIDATE_DIGEST"
          alias="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_NAMESPACE/$IMAGE_NAME:${IMAGE_TAG:-$DEPLOY_SHA}"
          docker pull --platform linux/amd64 "$image"
          python3 - "$image" "$CANDIDATE_DIGEST" "$CANDIDATE_CONFIG_ID" <<'PYIMAGE'
          import hashlib, json, os, re, subprocess, sys
          ref, expected_digest, expected_config = sys.argv[1:]
          repo = ref.rsplit('@', 1)[0]
          def require(value):
              if not value:
                  raise ValueError('Immutable image binding mismatch')
          def manifest(digest):
              require(re.fullmatch('sha256:[0-9a-f]{64}', digest))
              raw = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', '--raw', repo + '@' + digest], stderr=subprocess.DEVNULL)
              candidates = [raw, raw[:-1]] if raw.endswith(b'\n') else [raw]
              require(any('sha256:' + hashlib.sha256(b).hexdigest() == digest for b in candidates))
              return json.loads(raw)
          def main():
              document = manifest(expected_digest)
              graph = {expected_digest}
              if 'manifests' in document:
                  choices = [d for d in document['manifests'] if d.get('platform', {}).get('os') == 'linux' and d.get('platform', {}).get('architecture') == 'amd64']
                  require(len(choices) == 1)
                  selected = choices[0]['digest']
                  graph.add(selected)
                  document = manifest(selected)
              require(document['config']['digest'] == expected_config)
              local = json.loads(subprocess.check_output(['docker', 'image', 'inspect', ref], stderr=subprocess.DEVNULL))[0]
              require(local['Os'] == 'linux' and local['Architecture'] == 'amd64')
              require(local['Id'] in graph | {expected_config})
              require(set(local.get('RepoDigests') or []) & {repo + '@' + d for d in graph})
              descriptor = (local.get('Descriptor') or {}).get('digest')
              require(descriptor is None or descriptor in graph)
              revision = (local.get('Config', {}).get('Labels') or {}).get('org.opencontainers.image.revision')
              require(revision is None or revision == os.environ['DEPLOY_SHA'])
              print('Immutable registry/config/platform/local-descriptor binding verified')
          try:
              main()
          except Exception:
              raise SystemExit('Immutable image binding verification failed; image not exported') from None
          PYIMAGE
          docker tag "$image" "$alias"
          docker save "$alias" | gzip > "${DEPLOY_IMAGE_PACKAGE:-deploy-image-${PACKAGE_SUFFIX}.tar.gz}"

      - name: Export deployment image tarball
        if: env.DEPLOY_EXPORT_REGISTRY == 'acr' && needs.plan.outputs.reuse != 'true'
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          EXPORT_IMAGE_REGISTRY: acr
          EXPORT_IMAGE_FALLBACK_REGISTRY: ghcr
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: make cd-export-image SERVICE="${SERVICE}"

      - name: Prepare deployment package
        env:
          IAM_MESSAGING_PROVIDER: ${{ vars.IAM_MESSAGING_PROVIDER }}
          ROCKETMQ_ENDPOINT: ${{ vars.ROCKETMQ_ENDPOINT }}
          ROCKETMQ_INSTANCE_ID: ${{ vars.ROCKETMQ_INSTANCE_ID }}
          ROCKETMQ_PUBLISH_ENABLED: ${{ vars.ROCKETMQ_PUBLISH_ENABLED || 'false' }}
          ROCKETMQ_STORE_ID: ${{ vars.ROCKETMQ_STORE_ID }}
          ROCKETMQ_WRITER_EPOCH: ${{ vars.ROCKETMQ_WRITER_EPOCH }}
          ROCKETMQ_BINDING_REVISION: ${{ vars.ROCKETMQ_BINDING_REVISION }}
          MYSQL_HOST: ${{ vars.MYSQL_PUBLIC_HOST }}
          MYSQL_TLS_MODE: ${{ vars.MYSQL_TLS_MODE }}
          MYSQL_TLS_CA_REF: ${{ vars.MYSQL_TLS_CA_REF }}
          MYSQL_TLS_CA_FILE: /data/infra/ssl/mysql/ca-chain.pem
          MYSQL_PORT: ${{ vars.MYSQL_PUBLIC_PORT }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DBNAME: ${{ secrets.MYSQL_DBNAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || 6379 }}
          REDIS_DB: ${{ secrets.REDIS_DB || 0 }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_USE_SSL: ${{ secrets.REDIS_USE_SSL }}
          REDIS_SSL_INSECURE_SKIP_VERIFY: ${{ secrets.REDIS_SSL_INSECURE_SKIP_VERIFY }}
          IPD_ENCRYPTION_KEY: ${{ secrets.IPD_ENCRYPTION_KEY }}
          SMS_ALIYUN_ACCESS_KEY_ID: ${{ secrets.SMS_ALIYUN_ACCESS_KEY_ID }}
          SMS_ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.SMS_ALIYUN_ACCESS_KEY_SECRET }}
          SEED_MOCK_AUTH_ENABLED: ${{ vars.SEED_MOCK_AUTH_ENABLED || 'true' }}
          SEED_MOCK_AUTH_SHARED_SECRET: ${{ secrets.SEED_MOCK_AUTH_SHARED_SECRET }}
        run: |
          make cd-package SERVICE="${SERVICE}"

      - name: Setup deploy SSH
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY || secrets.SVRB_SSH_KEY }}
          # 大文件走公网：Tailscale DERP 中继太慢；打洞成功前优先公网
          RUNNER_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
          RUNNER_SSH_FALLBACK_HOST: ${{ vars.SVRA_HOST || secrets.SVRA_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          RUNNER_SSH_ALIAS: deploy-target
          DEPLOY_NODE_HOSTNAME: serverA
        run: bash scripts/cd/setup-runner-ssh.sh

      - name: Upload and deploy
        env:
          RUNNER_SSH_ALIAS: deploy-target
          DEPLOY_NODE_HOSTNAME: serverA
          SERVICE: ${{ env.SERVICE }}
          DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          DOCKER_REPOSITORY: ${{ env.DOCKER_REPOSITORY }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
          GHCR_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
          WWW_UID: ${{ env.WWW_UID }}
          WWW_GID: ${{ env.WWW_GID }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          DEPLOY_IMAGE_SOURCE: tarball
        run: bash scripts/cd/runner-upload-and-deploy.sh

      - name: Cleanup runner artifacts
        if: always()
        shell: bash
        run: |
          rm -f deploy-image-apiserver.tar.gz deploy-package-apiserver.tar.gz
          rm -rf deploy-package
          rm -f "${RUNNER_SSH_KEY_FILE:-}" 2>/dev/null || true
          rm -rf "${DOCKER_CONFIG:-}" 2>/dev/null || true
          docker image prune -f >/dev/null 2>&1 || true

  notify:
    name: Deployment Summary
    needs: [plan, docker, deploy]
    runs-on: ubuntu-latest
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      )
    steps:
      - name: Log deployment status
        run: |
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Docker: ${{ needs.docker.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Ref: ${DEPLOY_REF}"
          echo "SHA: ${DEPLOY_SHA}"
          echo "Service: ${SERVICE}"
          image_ready=false
          if [ "${{ needs.plan.result }}" = "success" ] && { [ "${{ needs.docker.result }}" = "success" ] || { [ "${{ needs.plan.outputs.reuse }}" = "true" ] && [ "${{ needs.docker.result }}" = "skipped" ]; }; }; then
            image_ready=true
          fi
          if [ "${{ vars.PRODUCTION_DEPLOY_PAUSED }}" = "true" ] && [ "$image_ready" = "true" ] && [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "Production deployment is intentionally paused."
            exit 0
          fi
          if [ "$image_ready" != "true" ] || [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "Production deploy failed or was skipped."
            exit 1
          fi
          echo "Production deploy completed."
