name: Production Deploy

# 组织 Secrets（与 qs-server 共用）:
#   SVRB_HOST, SVRB_USERNAME, SVRB_SSH_KEY, SVRB_SSH_PORT, SVRB_SUDO_PASSWORD
#   SVRA_* 可选 fallback
#   ALIYUN_ACR_REGISTRY, ALIYUN_ACR_NAMESPACE, ALIYUN_ACR_USERNAME, ALIYUN_ACR_PASSWORD
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   IAM_SERVER_DEPLOY_KEY（iam 仓库 Deploy Key 私钥，SSH checkout）
# 组织 Variables:
#   QS_DEPLOY_RUNNER=serverd
#   QS_DEPLOY_EXPORT_REGISTRY=acr
#   QS_DEPLOY_HTTP_PROXY, QS_DEPLOY_NO_PROXY

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iam-production-deploy
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REPOSITORY: fangcunmount
  SERVICE: apiserver
  DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  BUILD_TIME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.updated_at || github.event.repository.updated_at }}
  DEPLOY_EXPORT_REGISTRY: ${{ vars.QS_DEPLOY_EXPORT_REGISTRY || 'acr' }}
  SELF_HOSTED_HTTP_PROXY: ${{ vars.QS_DEPLOY_HTTP_PROXY || 'http://127.0.0.1:7890' }}
  SELF_HOSTED_HTTPS_PROXY: ${{ vars.QS_DEPLOY_HTTPS_PROXY || vars.QS_DEPLOY_HTTP_PROXY || 'http://127.0.0.1:7890' }}
  SELF_HOSTED_ALL_PROXY: ${{ vars.QS_DEPLOY_ALL_PROXY || 'socks5://127.0.0.1:7891' }}
  SELF_HOSTED_NO_PROXY: ${{ vars.QS_DEPLOY_NO_PROXY || '127.0.0.1,localhost,100.64.0.0/10,.aliyuncs.com,.personal.cr.aliyuncs.com' }}

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment:
      name: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      WWW_UID: ${{ secrets.WWW_UID }}
      WWW_GID: ${{ secrets.WWW_GID }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
      ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and publish image
        run: |
          make cd-image \
            SERVICE="${SERVICE}" \
            DEPLOY_REF="${DEPLOY_REF}" \
            DEPLOY_SHA="${DEPLOY_SHA}" \
            BUILD_TIME="${BUILD_TIME}"

  deploy:
    name: Deploy to Production
    needs: [docker]
    runs-on: ${{ vars.QS_DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment:
      name: production
      url: https://iam.fangcunmount.cn
    if: |
      always() &&
      needs.docker.result == 'success'
    env:
      WWW_UID: ${{ secrets.WWW_UID }}
      WWW_GID: ${{ secrets.WWW_GID }}
    permissions:
      contents: read
    steps:
      - name: Configure runner network (proxy + GitHub SSH)
        if: vars.QS_DEPLOY_RUNNER != ''
        env:
          HTTP_PROXY: ${{ env.SELF_HOSTED_HTTP_PROXY }}
          HTTPS_PROXY: ${{ env.SELF_HOSTED_HTTPS_PROXY }}
          ALL_PROXY: ${{ env.SELF_HOSTED_ALL_PROXY }}
          NO_PROXY: ${{ env.SELF_HOSTED_NO_PROXY }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          script_ref="${NETWORK_SCRIPT_REF:-${DEPLOY_SHA:-main}}"
          curl -fsSL --proxy "${HTTP_PROXY}" \
            "https://raw.githubusercontent.com/FangcunMount/iam/${script_ref}/scripts/cd/setup-runner-network.sh" \
            | bash

      - name: Checkout (self-hosted SSH)
        if: vars.QS_DEPLOY_RUNNER != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1
          ssh-key: ${{ secrets.IAM_SERVER_DEPLOY_KEY }}

      - name: Checkout (GitHub-hosted HTTPS)
        if: vars.QS_DEPLOY_RUNNER == ''
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Login to Aliyun ACR
        if: env.DEPLOY_EXPORT_REGISTRY == 'acr'
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: echo "$ALIYUN_ACR_PASSWORD" | docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

      - name: Export deployment image tarball
        if: env.DEPLOY_EXPORT_REGISTRY == 'acr'
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          EXPORT_IMAGE_REGISTRY: acr
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: make cd-export-image SERVICE="${SERVICE}"

      - name: Prepare deployment package
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DBNAME: ${{ secrets.MYSQL_DBNAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || 6379 }}
          REDIS_DB: ${{ secrets.REDIS_DB || 0 }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_USE_SSL: ${{ secrets.REDIS_USE_SSL }}
          REDIS_SSL_INSECURE_SKIP_VERIFY: ${{ secrets.REDIS_SSL_INSECURE_SKIP_VERIFY }}
          IPD_ENCRYPTION_KEY: ${{ secrets.IPD_ENCRYPTION_KEY }}
          NSQ_LOOKUPD_HOST: ${{ secrets.NSQ_LOOKUPD_HOST }}
          NSQ_LOOKUPD_PORT: ${{ secrets.NSQ_LOOKUPD_PORT || 4161 }}
          NSQ_NSQD_HOST: ${{ secrets.NSQ_NSQD_HOST }}
          NSQ_NSQD_PORT: ${{ secrets.NSQ_NSQD_PORT || 4150 }}
          SMS_ALIYUN_ACCESS_KEY_ID: ${{ secrets.SMS_ALIYUN_ACCESS_KEY_ID }}
          SMS_ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.SMS_ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          make cd-package SERVICE="${SERVICE}"

      - name: Setup deploy SSH
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          RUNNER_SSH_HOST: ${{ secrets.SVRB_HOST }}
          RUNNER_SSH_USER: ${{ secrets.SVRB_USERNAME || secrets.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ secrets.SVRB_SSH_PORT || secrets.SVRA_SSH_PORT || 22 }}
          RUNNER_SSH_ALIAS: deploy-target
        run: bash scripts/cd/setup-runner-ssh.sh

      - name: Upload and deploy
        env:
          RUNNER_SSH_ALIAS: deploy-target
          SERVICE: ${{ env.SERVICE }}
          DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          DOCKER_REPOSITORY: ${{ env.DOCKER_REPOSITORY }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
          GHCR_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SUDO_PASSWORD: ${{ secrets.SVRB_SUDO_PASSWORD || secrets.SVRA_SUDO_PASSWORD }}
          WWW_UID: ${{ env.WWW_UID }}
          WWW_GID: ${{ env.WWW_GID }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          DEPLOY_IMAGE_SOURCE: tarball
        run: bash scripts/cd/runner-upload-and-deploy.sh

  notify:
    name: Deployment Summary
    needs: [docker, deploy]
    runs-on: ubuntu-latest
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      )
    steps:
      - name: Log deployment status
        run: |
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Docker: ${{ needs.docker.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Ref: ${DEPLOY_REF}"
          echo "SHA: ${DEPLOY_SHA}"
          echo "Service: ${SERVICE}"
          if [ "${{ needs.docker.result }}" != "success" ] || [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "Production deploy failed or was skipped."
            exit 1
          fi
          echo "Production deploy completed."
