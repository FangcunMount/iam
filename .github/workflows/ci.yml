name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure private SDK access
        id: private-modules
        uses: ./.github/actions/private-modules
        with:
          client-id: ${{ vars.IAM_MODULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.IAM_MODULES_APP_PRIVATE_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run documentation hygiene
        run: make docs-hygiene

      - name: Verify documentation facts
        run: make docs-facts

      - name: Validate OpenAPI contracts
        run: make api-validate

      - name: Download dependencies
        run: go mod download

      - name: Run make lint
        run: make lint

      - name: Remove temporary SDK credentials
        if: always()
        env:
          MODULE_CONFIG: ${{ steps.private-modules.outputs.config-path }}
        run: |
          if [ -n "$MODULE_CONFIG" ]; then rm -f -- "$MODULE_CONFIG"; fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check private module authentication boundaries
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Configure private SDK access
        id: private-modules
        uses: ./.github/actions/private-modules
        with:
          client-id: ${{ vars.IAM_MODULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.IAM_MODULES_APP_PRIVATE_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check retired service authentication
        run: python3 scripts/check_service_token_retirement.py

      - name: Test reserved reviewer provisioning
        run: python3 -m unittest discover -s scripts/ops -p 'test_provision*.py' -v

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Remove temporary SDK credentials
        if: always()
        env:
          MODULE_CONFIG: ${{ steps.private-modules.outputs.config-path }}
        run: |
          if [ -n "$MODULE_CONFIG" ]; then rm -f -- "$MODULE_CONFIG"; fi

  build:
    name: Build Application
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure private SDK access
        id: private-modules
        uses: ./.github/actions/private-modules
        with:
          client-id: ${{ vars.IAM_MODULES_APP_CLIENT_ID }}
          private-key: ${{ secrets.IAM_MODULES_APP_PRIVATE_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iam-apiserver
          path: bin/apiserver
          retention-days: 7

      - name: Remove temporary SDK credentials
        if: always()
        env:
          MODULE_CONFIG: ${{ steps.private-modules.outputs.config-path }}
        run: |
          if [ -n "$MODULE_CONFIG" ]; then rm -f -- "$MODULE_CONFIG"; fi
