name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  production-transaction-package:
    name: Production transaction package (Compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render real final profile without starting containers
        run: python3 scripts/cd/test_transaction_compose.py -v
      - name: Test image retention policy
        run: python3 scripts/cd/test_image_retention.py

      - name: Existing shared deployment lock and restricted sudo
        run: python3 scripts/cd/test_deploy_lock.py -v
      - name: Retired runtime proofs refuse before dependencies
        run: python3 scripts/testing/test_retired_messaging_entrypoints.py -v
      - name: Material refusal precedes configuration sync
        run: python3 scripts/cd/test_material_gate.py -v

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run documentation hygiene
        run: make docs-hygiene

      - name: Verify documentation facts
        run: make docs-facts

      - name: Verify documentation history classification
        run: python3 scripts/test-docs-release-validation.py

      - name: Validate OpenAPI contracts
        run: make api-validate

      - name: Download dependencies
        run: go mod download

      - name: Run make lint
        run: make lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check retired service authentication
        run: python3 scripts/check_service_token_retirement.py

      - name: Test reserved reviewer provisioning
        run: python3 -m unittest discover -s scripts/ops -p 'test_provision*.py' -v

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Application
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iam-apiserver
          path: bin/apiserver
          retention-days: 7

  m3-transaction-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.36', '8.0.44', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: owned-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -powned-ci-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prove explicit host migration with released transaction adapter
        env:
          IAM_M3_TEST_MYSQL_DSN: root:owned-ci-only@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=3m -v \
            ./internal/pkg/migration -run '^TestM3(TransactionSchemaNative|PlannedPolicyNative|DisabledDDLSchemaHeadNative)$' | tee "$RUNNER_TEMP/m3-schema.log"
          for test_name in TestM3TransactionSchemaNative TestM3PlannedPolicyNative TestM3DisabledDDLSchemaHeadNative; do
            grep -q -- "--- PASS: $test_name " "$RUNNER_TEMP/m3-schema.log"
          done
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/m3-schema.log"; then exit 1; fi
      - name: Retired cutover tools and publishing modes refuse before resources
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./cmd/iam-maintenance \
            -run '^Test(RetiredMessagingToolsRejectBeforeEnvironmentOrResourceUse|MaintenanceRejectsPublishingProfilesBeforeDatabaseOrConfig)$' | tee "$RUNNER_TEMP/m4-retired-tools.log"
          for test_name in TestRetiredMessagingToolsRejectBeforeEnvironmentOrResourceUse TestMaintenanceRejectsPublishingProfilesBeforeDatabaseOrConfig; do
            grep -q -- "--- PASS: $test_name " "$RUNNER_TEMP/m4-retired-tools.log"
          done
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/m4-retired-tools.log"; then exit 1; fi
      - name: Prove maintenance planner and original-root transactions with isolated native MySQL
        env:
          ROLE_MODEL_REQUIRE_MYSQL: 'true'
          ROLE_MODEL_MYSQL_DSN: root:owned-ci-only@tcp(127.0.0.1:3306)/?parseTime=true
          SCOPE_MIGRATION_REQUIRE_MYSQL: 'true'
          SCOPE_MIGRATION_MYSQL_DSN: root:owned-ci-only@tcp(127.0.0.1:3306)/?parseTime=true
          ACCOUNT_PROVISION_REQUIRE_MYSQL: 'true'
          ACCOUNT_PROVISION_MYSQL_DSN: root:owned-ci-only@tcp(127.0.0.1:3306)/?parseTime=true
          OPERATIONS_CATALOG_REQUIRE_MYSQL: 'true'
          OPERATIONS_CATALOG_MYSQL_DSN: root:owned-ci-only@tcp(127.0.0.1:3306)/?parseTime=true
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=3m -v \
            ./internal/apiserver/maintenance/{rolemodel,conditionretire,scopemigrate,accountprovision,operationscatalog} \
            -run '^Test(Planned|M3TransactionMaintenance)' | tee "$RUNNER_TEMP/m3-maintenance.log"
          for test_name in TestPlannedRoleModelPreviewApplyAndCompensation TestPlannedRetirementPreservesReceiptAndRollbackBoundaries TestPlannedScopeCopiesMappingAndPreservesCompensation TestPlannedReviewerScopeRetainsCredentialsOutsideFrozenInput TestPlannedCatalogPreviewsNoopAndRejectsDrift TestM3TransactionMaintenanceRoleModel TestM3TransactionMaintenanceConditionRetirement TestM3TransactionMaintenanceScope TestM3TransactionMaintenanceReviewerScope TestM3TransactionMaintenanceOperationsCatalog; do
            grep -q -- "--- PASS: $test_name " "$RUNNER_TEMP/m3-maintenance.log"
          done
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/m3-maintenance.log"; then exit 1; fi
      - name: Managed assignment concurrency on the real isolated database
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DSN: root:owned-ci-only@tcp(127.0.0.1:3306)/iam_m4_assignment_concurrency?parseTime=true
          MYSQL_PWD: owned-ci-only
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 --user=root -e 'CREATE DATABASE iam_m4_assignment_concurrency'
          go test -race -count=1 -timeout=3m -v ./internal/apiserver/infra/mysql/uow/authz \
            -run '^TestReplaceManagedAssignmentsMySQLConcurrentLinearization$' | tee "$RUNNER_TEMP/m4-concurrency.log"
          grep -q -- '--- PASS: TestReplaceManagedAssignmentsMySQLConcurrentLinearization ' "$RUNNER_TEMP/m4-concurrency.log"
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/m4-concurrency.log"; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-schema-mysql-${{ matrix.mysql }}
          path: |
            ${{ runner.temp }}/m4-retired-tools.log
            ${{ runner.temp }}/m3-schema.log
            ${{ runner.temp }}/m3-maintenance.log
            ${{ runner.temp }}/m4-concurrency.log
          if-no-files-found: error
