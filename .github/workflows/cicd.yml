name: Deprecated - CI/CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated:
    name: Deprecated Workflow Notice
    runs-on: ubuntu-latest
    steps:
      - name: Print replacement workflow
        run: |
          echo "This workflow is deprecated."
          echo "Use 'CI' (.github/workflows/ci.yml) for lint/test/build."
          echo "Use 'Production Deploy' (.github/workflows/cd.yml) for image publish and deployment."
