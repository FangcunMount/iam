name: MySQL Concurrency Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - go.mod
      - go.sum
      - internal/apiserver/infra/mysql/**
      - internal/apiserver/application/authn/**
      - internal/apiserver/domain/authn/**
      - internal/apiserver/container/authn/**
      - internal/apiserver/infra/token/keyset/**
      - internal/apiserver/options/**
      - internal/pkg/migration/**
      - internal/apiserver/testhelpers/**
      - internal/pkg/code/**
      - scripts/dbops/**
      - .github/workflows/db-ops.yml
      - .github/workflows/concurrency-tests.yml
  pull_request:
    branches: [ main ]
    paths:
      - go.mod
      - go.sum
      - internal/apiserver/infra/mysql/**
      - internal/apiserver/application/authn/**
      - internal/apiserver/domain/authn/**
      - internal/apiserver/container/authn/**
      - internal/apiserver/infra/token/keyset/**
      - internal/apiserver/options/**
      - internal/pkg/migration/**
      - internal/apiserver/testhelpers/**
      - internal/pkg/code/**
      - scripts/dbops/**
      - .github/workflows/db-ops.yml
      - .github/workflows/concurrency-tests.yml

env:
  GOTOOLCHAIN: local

jobs:
  mysql-concurrency-tests:
    name: Run MySQL-backed concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client-8.0

      - name: Wait for MySQL
        env:
          MYSQL_PWD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
        run: |
          echo "Waiting for MySQL to be available..."
          for i in {1..30}; do
            if mysql --host=127.0.0.1 --port=3306 -u "$MYSQL_USER" -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Prepare database
        env:
          MYSQL_PWD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          mysql --host=127.0.0.1 --port=3306 -u root \
            -e "CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run concurrency tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_USERNAME: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_DBNAME: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          set -o pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          mkdir -p test-artifacts
          go test ./internal/apiserver/infra/mysql/... \
            -run "Concurrent|Concurrency" \
            -v \
            -count=1 \
            2>&1 | tee test-artifacts/mysql-concurrency-tests.txt
          exit "${PIPESTATUS[0]}"

      - name: Run JWKS migration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_USERNAME: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_DBNAME: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          set -o pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          go test ./internal/pkg/migration \
            -run "TestJWKSSingleActiveMigrationMySQL" \
            -v \
            -count=1 \
            2>&1 | tee test-artifacts/jwks-migration-tests.txt
          exit "${PIPESTATUS[0]}"

      - name: Run identity consistency migration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_USERNAME: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_DBNAME: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          set -o pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          go test ./internal/pkg/migration \
            -run "TestIdentityConsistencyMigrationsMySQL" \
            -v \
            -count=1 \
            2>&1 | tee test-artifacts/identity-migration-tests.txt
          exit "${PIPESTATUS[0]}"

      - name: Verify database backup and restore script with MySQL 8
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DBNAME: iam_dbops_fixture
          IAM_DB_OPS_BACKUP_DIR: ${{ runner.temp }}/iam-dbops-backups
        run: |
          set -euo pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" \
            -e 'DROP DATABASE IF EXISTS iam_dbops_fixture; CREATE DATABASE iam_dbops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" iam_dbops_fixture \
            -e 'CREATE TABLE restore_fixture (id BIGINT PRIMARY KEY, value VARCHAR(32) NOT NULL); INSERT INTO restore_fixture VALUES (1, "restored");'

          IAM_DB_OPS_OPERATION=backup scripts/dbops/database-operation.sh
          backup_name="$(find "$IAM_DB_OPS_BACKUP_DIR" -maxdepth 1 -type f -name 'iam_backup_*.sql.gz' -exec basename {} \;)"
          test -n "$backup_name"

          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" \
            -e 'DROP DATABASE iam_dbops_fixture; CREATE DATABASE iam_dbops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          IAM_DB_OPS_OPERATION=restore IAM_DB_OPS_BACKUP_NAME="$backup_name" scripts/dbops/database-operation.sh
          restored="$(mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" --batch --skip-column-names iam_dbops_fixture -e 'SELECT value FROM restore_fixture WHERE id = 1;')"
          test "$restored" = "restored"
          IAM_DB_OPS_OPERATION=status scripts/dbops/database-operation.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: concurrency-test-logs-${{ github.run_id }}
          path: test-artifacts/**
