name: MySQL Concurrency Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - go.mod
      - go.sum
      - internal/apiserver/infra/mysql/**
      - internal/apiserver/application/authn/**
      - internal/apiserver/domain/authn/**
      - internal/apiserver/container/authn/**
      - internal/apiserver/infra/token/keyset/**
      - internal/apiserver/options/**
      - internal/apiserver/maintenance/**
      - cmd/iam-maintenance/**
      - internal/pkg/migration/**
      - internal/apiserver/testhelpers/**
      - internal/pkg/code/**
      - scripts/dbops/**
      - .github/workflows/db-ops.yml
      - .github/workflows/concurrency-tests.yml
  pull_request:
    branches: [ main ]
    paths:
      - go.mod
      - go.sum
      - internal/apiserver/infra/mysql/**
      - internal/apiserver/application/authn/**
      - internal/apiserver/domain/authn/**
      - internal/apiserver/container/authn/**
      - internal/apiserver/infra/token/keyset/**
      - internal/apiserver/options/**
      - internal/apiserver/maintenance/**
      - cmd/iam-maintenance/**
      - internal/pkg/migration/**
      - internal/apiserver/testhelpers/**
      - internal/pkg/code/**
      - scripts/dbops/**
      - .github/workflows/db-ops.yml
      - .github/workflows/concurrency-tests.yml

env:
  GOTOOLCHAIN: local

jobs:
  mysql-concurrency-tests:
    name: Run MySQL-backed concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client-8.0

      - name: Wait for MySQL
        env:
          MYSQL_PWD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
        run: |
          echo "Waiting for MySQL to be available..."
          for i in {1..30}; do
            if mysql --host=127.0.0.1 --port=3306 -u "$MYSQL_USER" -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Prepare database
        env:
          MYSQL_PWD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          mysql --host=127.0.0.1 --port=3306 -u root \
            -e "CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run concurrency tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_USERNAME: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_DBNAME: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          set -o pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          mkdir -p test-artifacts
          go test ./internal/apiserver/infra/mysql/... \
            -run "Concurrent|Concurrency" \
            -v \
            -count=1 \
            2>&1 | tee test-artifacts/mysql-concurrency-tests.txt
          exit "${PIPESTATUS[0]}"

      - name: Run JWKS migration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_USERNAME: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_DBNAME: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          set -o pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          go test ./internal/pkg/migration \
            -run "TestJWKSSingleActiveMigrationMySQL" \
            -v \
            -count=1 \
            2>&1 | tee test-artifacts/jwks-migration-tests.txt
          exit "${PIPESTATUS[0]}"

      - name: Run Identity migration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_USERNAME: ${{ secrets.CI_MYSQL_USER || 'iam' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'iam_password' }}
          MYSQL_DATABASE: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
          MYSQL_DBNAME: ${{ secrets.CI_MYSQL_DATABASE || 'iam_test' }}
        run: |
          set -o pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          go test ./internal/pkg/migration \
            -run "TestIdentityConsistencyMigrationsMySQL|TestRetiredIdentityTablesMigrationMySQL" \
            -v \
            -count=1 \
            2>&1 | tee test-artifacts/identity-migration-tests.txt
          exit "${PIPESTATUS[0]}"

      - name: Run retirement migrations and full-chain tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
        run: |
          set -euo pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" \
            -e 'DROP DATABASE IF EXISTS iam_retirement_fixture; CREATE DATABASE iam_retirement_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; DROP DATABASE IF EXISTS iam_authz_seed_repair_fixture; CREATE DATABASE iam_authz_seed_repair_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; DROP DATABASE IF EXISTS iam_full_chain; CREATE DATABASE iam_full_chain CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'

          MYSQL_DATABASE=iam_retirement_fixture MYSQL_DBNAME=iam_retirement_fixture \
            go test ./internal/pkg/migration \
              -run "TestRetireSchemaVersionMigrationMySQL|TestRetireUnusedPlatformTablesMigrationMySQL|TestRetireUnusedAuditTablesMigrationMySQL|TestRetireLegacyAuthNTablesMigrationMySQL|TestRetireSeeddataCleanupTablesMigrationMySQL" \
              -v \
              -count=1 \
              2>&1 | tee test-artifacts/retirement-migration-tests.txt
          test "${PIPESTATUS[0]}" = "0"

          MYSQL_DATABASE=iam_authz_seed_repair_fixture MYSQL_DBNAME=iam_authz_seed_repair_fixture \
            go test ./internal/pkg/migration \
              -run "TestAuthZSeedAssignmentRepairMigrationMySQL" \
              -v \
              -count=1 \
              2>&1 | tee test-artifacts/authz-seed-assignment-repair-tests.txt
          test "${PIPESTATUS[0]}" = "0"

          MYSQL_DATABASE=iam_full_chain MYSQL_DBNAME=iam_full_chain \
            go test ./internal/pkg/migration \
              -run "TestFullMigrationChainAndBootstrapMySQL" \
              -v \
              -count=1 \
              2>&1 | tee test-artifacts/full-chain-migration-tests.txt
          test "${PIPESTATUS[0]}" = "0"

          MYSQL_DBNAME=iam_full_chain \
            IAM_DB_OPS_BACKUP_DIR="${RUNNER_TEMP}/iam-full-chain-dbops" \
            IAM_DB_OPS_OPERATION=rolebinding-guard-preflight \
            scripts/dbops/database-operation.sh

      - name: Verify database backup, restore, and status with MySQL 8
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DBNAME: iam_dbops_fixture
          IAM_DB_OPS_BACKUP_DIR: ${{ runner.temp }}/iam-dbops-backups
        run: |
          set -euo pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" \
            -e 'DROP DATABASE IF EXISTS iam_dbops_fixture; CREATE DATABASE iam_dbops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" "$MYSQL_DBNAME" \
            -e 'CREATE TABLE auth_credentials (id BIGINT PRIMARY KEY); CREATE TABLE auth_login_identities (id BIGINT PRIMARY KEY); CREATE TABLE authz_assignments (id BIGINT PRIMARY KEY); CREATE TABLE authz_permission_grants (id BIGINT PRIMARY KEY); CREATE TABLE authz_policy_versions (id BIGINT PRIMARY KEY); CREATE TABLE authz_resources (id BIGINT PRIMARY KEY); CREATE TABLE authz_role_inheritances (id BIGINT PRIMARY KEY); CREATE TABLE authz_roles (id BIGINT PRIMARY KEY); CREATE TABLE domain_event_outbox (id BIGINT PRIMARY KEY); CREATE TABLE identity_session_revocation_outbox (id BIGINT PRIMARY KEY); CREATE TABLE idp_wechat_apps (id BIGINT PRIMARY KEY); CREATE TABLE jwks_keys (id BIGINT PRIMARY KEY); CREATE TABLE profile_links (id BIGINT PRIMARY KEY); CREATE TABLE profiles (id BIGINT PRIMARY KEY); CREATE TABLE users (id BIGINT PRIMARY KEY); CREATE TABLE schema_migrations (version BIGINT NOT NULL, dirty BOOLEAN NOT NULL); INSERT INTO schema_migrations VALUES (27, 0); CREATE TABLE restore_fixture (id BIGINT PRIMARY KEY, value VARCHAR(32) NOT NULL); INSERT INTO restore_fixture VALUES (1, "restored");'

          IAM_DB_OPS_OPERATION=backup scripts/dbops/database-operation.sh
          backup_name="$(find "$IAM_DB_OPS_BACKUP_DIR" -maxdepth 1 -type f -name 'iam_backup_*.sql.gz' -exec basename {} \;)"
          test -n "$backup_name"

          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" \
            -e 'DROP DATABASE iam_dbops_fixture; CREATE DATABASE iam_dbops_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          IAM_DB_OPS_OPERATION=restore IAM_DB_OPS_BACKUP_NAME="$backup_name" scripts/dbops/database-operation.sh
          restored="$(mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" --batch --skip-column-names "$MYSQL_DBNAME" -e 'SELECT value FROM restore_fixture WHERE id = 1;')"
          test "$restored" = "restored"
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" "$MYSQL_DBNAME" \
            -e 'DROP TABLE restore_fixture;'
          IAM_DB_OPS_OPERATION=status scripts/dbops/database-operation.sh

      - name: Verify guarded RoleBinding deduplication with MySQL 8
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
          MYSQL_DBNAME: iam_rolebinding_cleanup_fixture
          IAM_DB_OPS_BACKUP_DIR: ${{ runner.temp }}/iam-rolebinding-cleanup-backups
        run: |
          set -euo pipefail
          export MYSQL_PWD="$MYSQL_PASSWORD"
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" \
            -e 'DROP DATABASE IF EXISTS iam_rolebinding_cleanup_fixture; CREATE DATABASE iam_rolebinding_cleanup_fixture CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" "$MYSQL_DBNAME" <<'SQL'
          CREATE TABLE schema_migrations (version BIGINT NOT NULL, dirty BOOLEAN NOT NULL);
          INSERT INTO schema_migrations VALUES (24, 0);
          CREATE TABLE authz_assignments (
            id BIGINT UNSIGNED NOT NULL PRIMARY KEY,
            subject_type VARCHAR(16) NOT NULL,
            subject_id VARCHAR(64) NOT NULL,
            role_id BIGINT UNSIGNED NOT NULL,
            tenant_id VARCHAR(64) NOT NULL,
            granted_by VARCHAR(64) NULL,
            granted_at DATETIME NOT NULL,
            created_at DATETIME NOT NULL,
            updated_at DATETIME NOT NULL,
            deleted_at DATETIME NULL,
            created_by BIGINT UNSIGNED NOT NULL DEFAULT 0,
            updated_by BIGINT UNSIGNED NOT NULL DEFAULT 0,
            deleted_by BIGINT UNSIGNED NOT NULL DEFAULT 0,
            version INT UNSIGNED NOT NULL DEFAULT 1
          );
          INSERT INTO authz_assignments
            (id, subject_type, subject_id, role_id, tenant_id, granted_at, created_at, updated_at, deleted_at)
          VALUES
            (10, 'user', '7', 31, 'tenant-a', '2026-08-01 00:00:00', '2026-08-01 00:00:00', '2026-08-01 00:00:00', NULL),
            (11, 'user', '7', 31, 'tenant-a', '2026-08-01 00:00:01', '2026-08-01 00:00:01', '2026-08-01 00:00:01', NULL),
            (12, 'user', '7', 31, 'tenant-a', '2026-08-01 00:00:02', '2026-08-01 00:00:02', '2026-08-01 00:00:02', NULL),
            (20, 'user', '8', 32, 'tenant-b', '2026-08-01 00:00:00', '2026-08-01 00:00:00', '2026-08-01 00:00:00', NULL),
            (21, 'user', '8', 32, 'tenant-b', '2026-08-01 00:00:03', '2026-08-01 00:00:03', '2026-08-01 00:00:03', NULL),
            (30, 'user', '9', 33, 'tenant-c', '2026-08-01 00:00:00', '2026-08-01 00:00:00', '2026-08-01 00:00:00', NULL),
            (31, 'user', '9', 33, 'tenant-c', '2026-07-01 00:00:00', '2026-07-01 00:00:00', '2026-07-01 00:00:00', '2026-07-02 00:00:00');
          SQL

          IAM_DB_OPS_OPERATION=backup IAM_DB_OPS_TIMESTAMP=20260825_000000 scripts/dbops/database-operation.sh
          backup_name=iam_backup_20260825_000000.sql.gz
          dry_run_output="$(IAM_DB_OPS_OPERATION=rolebinding-deduplicate-dry-run IAM_DB_OPS_TIMESTAMP=20260825_000001 scripts/dbops/database-operation.sh)"
          printf '%s\n' "$dry_run_output"
          candidate_count="$(sed -nE 's/.*candidate_count=([0-9]+).*/\1/p' <<<"$dry_run_output")"
          fingerprint="$(sed -nE 's/.*fingerprint=([0-9a-f]{64}).*/\1/p' <<<"$dry_run_output")"
          test "$candidate_count" = "3"
          test -n "$fingerprint"

          if IAM_DB_OPS_OPERATION=rolebinding-deduplicate-apply \
            IAM_DB_OPS_BACKUP_NAME="$backup_name" \
            IAM_DB_OPS_ROLEBINDING_CANDIDATE_COUNT="$candidate_count" \
            IAM_DB_OPS_ROLEBINDING_FINGERPRINT="$(printf '0%.0s' {1..64})" \
            scripts/dbops/database-operation.sh; then
            echo 'mismatched candidate fingerprint was accepted' >&2
            exit 1
          fi
          active_before="$(mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" --batch --skip-column-names "$MYSQL_DBNAME" -e 'SELECT COUNT(*) FROM authz_assignments WHERE deleted_at IS NULL;')"
          test "$active_before" = "6"

          IAM_DB_OPS_OPERATION=rolebinding-deduplicate-apply \
            IAM_DB_OPS_BACKUP_NAME="$backup_name" \
            IAM_DB_OPS_ROLEBINDING_CANDIDATE_COUNT="$candidate_count" \
            IAM_DB_OPS_ROLEBINDING_FINGERPRINT="$fingerprint" \
            scripts/dbops/database-operation.sh
          active_ids="$(mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" --batch --skip-column-names "$MYSQL_DBNAME" -e 'SELECT GROUP_CONCAT(id ORDER BY id) FROM authz_assignments WHERE deleted_at IS NULL;')"
          deleted_ids="$(mysql --host="$MYSQL_HOST" --port="$MYSQL_PORT" --user="$MYSQL_USERNAME" --batch --skip-column-names "$MYSQL_DBNAME" -e 'SELECT GROUP_CONCAT(id ORDER BY id) FROM authz_assignments WHERE deleted_at IS NOT NULL AND id IN (10,11,12,20,21,30);')"
          test "$active_ids" = "10,20,30"
          test "$deleted_ids" = "11,12,21"

          IAM_DB_OPS_OPERATION=rolebinding-guard-preflight scripts/dbops/database-operation.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: concurrency-test-logs-${{ github.run_id }}
          path: test-artifacts/**
