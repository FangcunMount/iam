name: IAM schema 39 fallback wiring

on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - internal/apiserver/infra/authz/integration/reliable_messaging_wiring_test.go
      - internal/apiserver/process/reliable_messaging_fallback_startup_test.go
      - build/docker/Dockerfile
      - internal/apiserver/container/platform/**
      - internal/apiserver/infra/mysql/eventoutbox/**
      - internal/pkg/migration/migrations/000039_reliable_messaging_failure_state.*.sql
      - scripts/testing/reliable-messaging-fallback-proof.sh
      - .github/workflows/reliable-messaging-fallback.yml
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish a previously reviewed fallback image under a SHA-only GHCR tag
        type: boolean
        required: true
        default: false
      verify_candidate:
        description: Pull and inspect the published candidate in an isolated runner without deploying it
        type: boolean
        required: true
        default: false
      verify_export:
        description: Verify the Mac mini can export the exact candidate as a checked tarball without deploying it
        type: boolean
        required: true
        default: false
      source_run_id:
        description: Successful isolated proof run holding the reviewed image artifact
        type: string
        required: false
      candidate_sha:
        description: Exact 40-character IAM source commit approved for the fallback image
        type: string
        required: false
      workflow_sha:
        description: Exact reviewed workflow commit; branch drift stops publication
        type: string
        required: false
      archive_sha256:
        description: Independently verified SHA-256 of the Docker archive
        type: string
        required: false
      image_id:
        description: Independently verified sha256 image ID from the archive manifest
        type: string
        required: false
      candidate_digest:
        description: Expected sha256 registry manifest digest for isolated pull verification
        type: string
        required: false

permissions:
  contents: read

jobs:
  schema39-fallback-wiring:
    name: Recover IAM policy event through MySQL and NSQ
    if: github.event_name == 'pull_request' || (!inputs.publish_candidate && !inputs.verify_candidate && !inputs.verify_export)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout IAM fallback candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout released SDK fixture
        uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: v0.2.1
          path: reliable-messaging
          persist-credentials: false
      - name: Verify fallback source identity
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run isolated schema 39 IAM wiring proof
        run: bash scripts/testing/reliable-messaging-fallback-proof.sh "$GITHUB_WORKSPACE/reliable-messaging"
      - name: Build exact fallback image without publishing
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          docker build --file build/docker/Dockerfile --tag "iam-fallback-isolated:${candidate_sha}" --build-arg "GIT_COMMIT=${candidate_sha}" .
      - name: Preserve exact fallback image for review
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          image="iam-fallback-isolated:${candidate_sha}"
          archive="${RUNNER_TEMP}/iam-fallback-${candidate_sha}.tar"
          docker image inspect "$image" --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Config.User}}'
          docker save --output "$archive" "$image"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload fallback image review artifact
        uses: actions/upload-artifact@v4
        with:
          name: iam-schema39-fallback-${{ steps.image.outputs.candidate_sha }}
          path: |
            ${{ steps.image.outputs.archive }}
            ${{ steps.image.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-reviewed-fallback:
    name: Publish reviewed fallback image to unique GHCR tag
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate && !inputs.verify_candidate && !inputs.verify_export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WORKFLOW_SHA: ${{ inputs.workflow_sha }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      EXPECTED_IMAGE_ID: ${{ inputs.image_id }}
    steps:
      - name: Validate reviewed source and artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$WORKFLOW_SHA"
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')"
          source_result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion')"
          test "$source_sha" = "$CANDIDATE_SHA"
          test "$source_result" = success
      - name: Download and verify reviewed Docker archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive_dir="${RUNNER_TEMP}/reviewed-fallback"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "iam-schema39-fallback-${CANDIDATE_SHA}" --dir "$archive_dir"
          archive="${archive_dir}/iam-fallback-${CANDIDATE_SHA}.tar"
          test -s "$archive"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          docker load --input "$archive"
          image="iam-fallback-isolated:${CANDIDATE_SHA}"
          actual_image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          test "$actual_image_id" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = www
      - name: Push unique candidate tag only
        shell: bash
        run: |
          set -Eeuo pipefail
          image="iam-fallback-isolated:${CANDIDATE_SHA}"
          target="ghcr.io/fangcunmount/iam:fallback-schema39-${CANDIDATE_SHA}"
          tag="fallback-schema39-${CANDIDATE_SHA}"
          existing_tags="$(gh api --paginate "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/iam/versions?per_page=100" --jq '.[] | .metadata.container.tags[]?')"
          if grep -Fxq "$tag" <<< "$existing_tags"; then
            echo "Candidate tag already exists; refusing to replace it" >&2
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker tag "$image" "$target"
          docker push "$target"
          digest="$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Reviewed fallback image: `%s@%s`\n' "$target" "$digest" >> "$GITHUB_STEP_SUMMARY"

  verify-published-fallback:
    name: Pull and inspect the published fallback candidate without deployment
    if: github.event_name == 'workflow_dispatch' && inputs.verify_candidate && !inputs.publish_candidate && !inputs.verify_export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WORKFLOW_SHA: ${{ inputs.workflow_sha }}
      EXPECTED_IMAGE_ID: ${{ inputs.image_id }}
      EXPECTED_DIGEST: ${{ inputs.candidate_digest }}
    steps:
      - name: Pull exact candidate and verify identity
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$WORKFLOW_SHA"
          image="ghcr.io/fangcunmount/iam:fallback-schema39-${CANDIDATE_SHA}"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          actual_digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = www
          docker run --rm --entrypoint /bin/sh "$image" -ec \
            'test "$(id -u)" = 2000 && test "$(id -g)" = 2000 && test -x /app/apiserver && test -x /app/iam-maintenance && test -f /app/configs/apiserver.prod.yaml'
          printf 'Isolated GHCR pull verified: `%s@%s`, image ID `%s` (no deployment).\n' \
            "$image" "$actual_digest" "$EXPECTED_IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"

  verify-candidate-export:
    name: Export the exact candidate on Mac mini without deployment
    if: github.event_name == 'workflow_dispatch' && inputs.verify_export && !inputs.publish_candidate && !inputs.verify_candidate
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    concurrency:
      group: iam-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WORKFLOW_SHA: ${{ inputs.workflow_sha }}
      EXPECTED_IMAGE_ID: ${{ inputs.image_id }}
      EXPECTED_DIGEST: ${{ inputs.candidate_digest }}
    steps:
      - name: Verify approved identity and configure isolated GHCR auth
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$WORKFLOW_SHA"
          docker_config="${RUNNER_TEMP}/iam-fallback-docker-${GITHUB_RUN_ID}"
          mkdir -p "$docker_config"
          umask 077
          auth="$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - name: Pull, verify, and export the exact candidate
        id: archive
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/fangcunmount/iam:fallback-schema39-${CANDIDATE_SHA}"
          docker pull --platform linux/amd64 "$image"
          actual_image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          actual_platform="$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')"
          actual_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
          actual_repo_digests="$(docker image inspect "$image" --format '{{json .RepoDigests}}')"
          printf 'Pulled image ID: %s; platform: %s; user: %s; repo digests: %s\n' \
            "$actual_image_id" "$actual_platform" "$actual_user" "$actual_repo_digests"
          test "$actual_image_id" = "$EXPECTED_IMAGE_ID"
          test "$actual_platform" = linux/amd64
          test "$actual_user" = www
          printf '%s' "$actual_repo_digests" | python3 -c \
            'import json,os,sys; expected="ghcr.io/fangcunmount/iam@"+os.environ["EXPECTED_DIGEST"]; sys.exit(0 if expected in json.load(sys.stdin) else 1)'
          archive="${RUNNER_TEMP}/iam-fallback-${CANDIDATE_SHA}.tar"
          compressed="${archive}.gz"
          docker save --output "$archive" "$image"
          gzip -1 -c "$archive" > "$compressed"
          gzip -dc "$compressed" | tar -tf - >/dev/null
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$compressed")" > "$(basename "$compressed").sha256")
          rm -f "$archive"
          echo "package=$compressed" >> "$GITHUB_OUTPUT"
          printf 'Mac mini exported verified candidate `%s@%s` to a checked tarball; no serverB upload or deployment.\n' \
            "$image" "$EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve reviewed candidate tarball
        uses: actions/upload-artifact@v4
        with:
          name: iam-schema39-fallback-export-${{ inputs.candidate_sha }}
          path: |
            ${{ steps.archive.outputs.package }}
            ${{ steps.archive.outputs.package }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Clean up temporary credentials and tarball
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/iam-fallback-${CANDIDATE_SHA}.tar" \
            "${RUNNER_TEMP}/iam-fallback-${CANDIDATE_SHA}.tar.gz" \
            "${RUNNER_TEMP}/iam-fallback-${CANDIDATE_SHA}.tar.gz.sha256"
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
