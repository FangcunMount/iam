name: IAM schema 39 fallback wiring

on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - internal/apiserver/infra/authz/integration/reliable_messaging_wiring_test.go
      - internal/apiserver/process/reliable_messaging_fallback_startup_test.go
      - build/docker/Dockerfile
      - internal/apiserver/container/platform/**
      - internal/apiserver/infra/mysql/eventoutbox/**
      - internal/pkg/migration/migrations/000039_reliable_messaging_failure_state.*.sql
      - scripts/testing/reliable-messaging-fallback-proof.sh
      - .github/workflows/reliable-messaging-fallback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema39-fallback-wiring:
    name: Recover IAM policy event through MySQL and NSQ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout IAM fallback candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout released SDK fixture
        uses: actions/checkout@v6
        with:
          repository: FangcunMount/reliable-messaging
          ref: v0.2.1
          path: reliable-messaging
          persist-credentials: false
      - name: Verify fallback source identity
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run isolated schema 39 IAM wiring proof
        run: bash scripts/testing/reliable-messaging-fallback-proof.sh "$GITHUB_WORKSPACE/reliable-messaging"
      - name: Build exact fallback image without publishing
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          docker build --file build/docker/Dockerfile --tag "iam-fallback-isolated:${candidate_sha}" --build-arg "GIT_COMMIT=${candidate_sha}" .
      - name: Preserve exact fallback image for review
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          image="iam-fallback-isolated:${candidate_sha}"
          archive="${RUNNER_TEMP}/iam-fallback-${candidate_sha}.tar"
          docker image inspect "$image" --format '{{.Id}} {{.Os}}/{{.Architecture}} {{.Config.User}}'
          docker save --output "$archive" "$image"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload fallback image review artifact
        uses: actions/upload-artifact@v4
        with:
          name: iam-schema39-fallback-${{ steps.image.outputs.candidate_sha }}
          path: |
            ${{ steps.image.outputs.archive }}
            ${{ steps.image.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
