name: IAM current RocketMQ failure audit

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - internal/apiserver/container/**
      - internal/apiserver/infra/messaging/**
      - internal/apiserver/infra/authz/integration/rocketmq_audit_proof_test.go
      - internal/apiserver/infra/mysql/messagefailure/**
      - internal/pkg/migration/migrations/000041_message_failure_audit.*.sql
      - .github/workflows/reliable-messaging-m6-subscriber.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iam_m6_subscriber
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify RocketMQ terminal audit on real MySQL
        env:
          IAM_AUTHZ_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/?parseTime=true&loc=UTC"
          RM_IAM_ROCKETMQ_AUDIT_SCHEMA: ${{ github.workspace }}/internal/pkg/migration/migrations/000041_message_failure_audit.up.sql
        run: |
          set -euo pipefail
          go test -tags reliable_messaging ./internal/apiserver/infra/authz/integration -run '^TestReliableMessagingRocketMQFailureAudit$' -count=1 -v | tee "$RUNNER_TEMP/rocketmq-audit.log"
          grep -q -- '--- PASS: TestReliableMessagingRocketMQFailureAudit ' "$RUNNER_TEMP/rocketmq-audit.log"
          if grep -q -- '--- SKIP:' "$RUNNER_TEMP/rocketmq-audit.log"; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: current-rocketmq-failure-audit
          path: ${{ runner.temp }}/rocketmq-audit.log
          if-no-files-found: error
          retention-days: 14
