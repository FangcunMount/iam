name: Production Health Check

# Production target uses serverB (SVRB) first. SVRA values remain as a fallback
# while repository/org secrets are being migrated.
# Required Secrets: SVRB_HOST, SVRA_USERNAME, SVRA_SSH_KEY
# Optional Secrets: SVRB_USERNAME, SVRB_SSH_KEY, SVRB_SSH_PORT, SVRA_SSH_PORT

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  health-check:
    name: Check production container on SVRB
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: System Health Check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SVRB_HOST || secrets.SVRA_HOST }}
          username: ${{ secrets.SVRB_USERNAME || secrets.SVRA_USERNAME }}
          key: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          port: ${{ secrets.SVRB_SSH_PORT || secrets.SVRA_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Production Server Health Check ==="
            echo "Server: $(hostname)"
            echo "Uptime: $(uptime)"
            echo "Date: $(date)"
            echo ""

            echo "CPU usage:"
            top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1"%"}'
            echo ""

            echo "Memory usage:"
            free -h | awk 'NR==2{printf "Used: %s / Total: %s (%.2f%%)\n", $3, $2, $3*100/$2}'
            echo ""

            echo "Disk usage:"
            df -h | grep -E "^/dev/" | awk '{print $1 ": " $5 " used (" $3 "/" $2 ")"}'
            echo ""

            echo "Load average:"
            uptime | awk -F'load average:' '{print $2}'
            echo ""

            echo "Top 5 CPU processes:"
            ps aux --sort=-%cpu | head -6

      - name: Docker and IAM Container Check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SVRB_HOST || secrets.SVRA_HOST }}
          username: ${{ secrets.SVRB_USERNAME || secrets.SVRA_USERNAME }}
          key: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          port: ${{ secrets.SVRB_SSH_PORT || secrets.SVRA_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Docker Service Status ==="

            if ! sudo docker info >/dev/null 2>&1; then
              echo "Docker daemon is not running"
              exit 1
            fi
            echo "Docker daemon is running"
            echo ""

            if ! sudo docker ps --filter "name=iam-apiserver" --format "{{.Names}}" | grep -wq "iam-apiserver"; then
              echo "iam-apiserver container is not running"
              sudo docker ps -a --filter "name=iam-apiserver" || true
              exit 1
            fi

            container_status=$(sudo docker ps --filter "name=iam-apiserver" --format "{{.Status}}")
            container_health=$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no healthcheck{{end}}' iam-apiserver)

            echo "iam-apiserver is running"
            echo "Status: $container_status"
            echo "Health: $container_health"
            echo ""
            sudo docker ps --filter "name=iam-apiserver" --format "table {{.Names}}\t{{.Status}}\t{{.Networks}}"

            if [ "$container_health" = "unhealthy" ]; then
              echo "Container is unhealthy; tailing logs before restart..."
              sudo docker logs --tail 80 iam-apiserver || true
              sudo docker restart iam-apiserver
              sleep 15

              new_health=$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no healthcheck{{end}}' iam-apiserver)
              if [ "$new_health" != "healthy" ] && [ "$new_health" != "no healthcheck" ]; then
                echo "Container still unhealthy after restart: $new_health"
                sudo docker logs --tail 120 iam-apiserver || true
                exit 1
              fi
              echo "Container recovered after restart: $new_health"
            fi

      - name: Network and API Health Check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SVRB_HOST || secrets.SVRA_HOST }}
          username: ${{ secrets.SVRB_USERNAME || secrets.SVRA_USERNAME }}
          key: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          port: ${{ secrets.SVRB_SSH_PORT || secrets.SVRA_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Network and API Health Status ==="

            echo "Docker networks:"
            sudo docker network ls | grep -E "infra-network|bridge" || true
            echo ""

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "Required Docker network infra-network is missing"
              exit 1
            fi

            echo "Container exposed ports:"
            sudo docker inspect iam-apiserver --format '{{range $p, $_ := .NetworkSettings.Ports}}{{$p}}{{println}}{{end}}' || true
            echo ""

            echo "Container listeners:"
            sudo docker exec iam-apiserver sh -lc 'ss -tln 2>/dev/null || netstat -tln 2>/dev/null || true'
            echo ""

            http_status=$(sudo docker exec iam-apiserver curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9080/healthz || echo "000")
            if [ "$http_status" != "200" ]; then
              echo "Internal HTTP health check failed: $http_status"
              sudo docker logs --tail 120 iam-apiserver || true
              exit 1
            fi
            echo "Internal HTTP API is healthy: $http_status"

      - name: Dependency Connectivity Check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SVRB_HOST || secrets.SVRA_HOST }}
          username: ${{ secrets.SVRB_USERNAME || secrets.SVRA_USERNAME }}
          key: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          port: ${{ secrets.SVRB_SSH_PORT || secrets.SVRA_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Dependency Connectivity Check ==="

            check_tcp() {
              local label="$1"
              local host="$2"
              local port="$3"

              if [ -z "$host" ]; then
                echo "$label host is empty; skipping"
                return 0
              fi

              if sudo docker exec iam-apiserver sh -lc 'command -v nc >/dev/null 2>&1'; then
                if sudo docker exec iam-apiserver sh -lc "nc -z -w5 '$host' '$port'"; then
                  echo "$label is reachable at $host:$port"
                else
                  echo "$label connectivity failed at $host:$port"
                  return 1
                fi
              else
                echo "nc is not available in iam-apiserver; skipping $label TCP probe"
              fi
            }

            mysql_endpoint=$(sudo docker exec iam-apiserver sh -lc 'printf "%s" "${IAM_APISERVER_MYSQL_HOST:-}"')
            mysql_host="${mysql_endpoint%%:*}"
            mysql_port="${mysql_endpoint##*:}"
            if [ "$mysql_port" = "$mysql_endpoint" ]; then
              mysql_port="3306"
            fi
            check_tcp "MySQL" "$mysql_host" "$mysql_port"

            redis_host=$(sudo docker exec iam-apiserver sh -lc 'printf "%s" "${IAM_APISERVER_REDIS_CACHE_HOST:-}"')
            redis_port=$(sudo docker exec iam-apiserver sh -lc 'printf "%s" "${IAM_APISERVER_REDIS_CACHE_PORT:-6379}"')
            check_tcp "Redis" "$redis_host" "$redis_port"

            echo ""
            echo "Recent dependency logs:"
            sudo docker logs --tail 120 iam-apiserver 2>&1 | grep -Ei "mysql|database|redis|cache" | tail -20 || true

      - name: Disk Space Alert
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SVRB_HOST || secrets.SVRA_HOST }}
          username: ${{ secrets.SVRB_USERNAME || secrets.SVRA_USERNAME }}
          key: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          port: ${{ secrets.SVRB_SSH_PORT || secrets.SVRA_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Disk Space Monitoring ==="
            df -h | grep -E "^/dev/" | awk '{
              gsub(/%/, "", $5);
              if ($5 > 80) {
                print "WARNING: "$1" is "$5"% full ("$3"/"$2")";
                alert=1
              }
            } END {
              if (!alert) print "All filesystems OK"
            }'

  report:
    name: Health Check Report
    needs: [health-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Report
        run: |
          echo "Health Check Report"
          echo "Status: ${{ needs.health-check.result }}"
          echo "Time: $(date)"

          if [ "${{ needs.health-check.result }}" != "success" ]; then
            echo "Health check failed; inspect the failed step logs."
            exit 1
          fi

          echo "All health checks passed"
