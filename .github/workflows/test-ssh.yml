name: Production SSH Diagnostics

# Manual diagnostic workflow for the production host.
# GitHub-hosted runners use the public serverB endpoint first and fall back to
# the private/Tailscale and legacy endpoints.
# Required Variables: SVRB_PUBLIC_HOST (preferred), SVRB_HOST, or SVRA_HOST
# Required Variables: SVRB_USERNAME or SVRA_USERNAME
# Required Secrets: SVRB_SSH_KEY or SVRA_SSH_KEY
# Optional Variables: SVRB_SSH_PORT, SVRA_SSH_PORT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test SSH connection to production host
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Show GitHub Runner Info
        run: |
          echo "GitHub Runner Information"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Name: ${{ runner.name }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "UTC Time: $(TZ=UTC date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.SVRB_PUBLIC_HOST || secrets.SVRB_PUBLIC_HOST || vars.SVRB_HOST || vars.SVRA_HOST }}
          username: ${{ vars.SVRB_USERNAME || vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRB_SSH_PORT || vars.SVRA_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "SSH connection test succeeded"
            echo "Server: $(hostname)"
            echo "User: $(whoami)"
            echo "Working directory: $(pwd)"
            echo ""

            echo "Time information:"
            echo "  Local: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "  UTC:   $(TZ=UTC date '+%Y-%m-%d %H:%M:%S %Z')"

            if command -v timedatectl >/dev/null 2>&1; then
              echo ""
              echo "Timezone configuration:"
              timedatectl | grep -E "Time zone|Local time|Universal time"
            fi

            echo ""
            echo "System information:"
            echo "  OS: $(cat /etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d'"' -f2 || uname -s)"
            echo "  Kernel: $(uname -r)"
            echo "  Uptime: $(uptime -p 2>/dev/null || uptime)"

            echo ""
            echo "Docker status:"
            if ! command -v docker >/dev/null 2>&1; then
              echo "  Docker is not installed"
              exit 1
            fi
            if ! sudo docker info >/dev/null 2>&1; then
              echo "  Docker daemon is not accessible"
              exit 1
            fi
            echo "  Docker is running"
            echo "  Version: $(sudo docker version --format '{{.Server.Version}}' 2>/dev/null)"
            echo "  Containers: $(sudo docker ps -q | wc -l) running"

            echo ""
            echo "IAM service status:"
            if sudo docker ps --filter "name=iam-apiserver" --format "{{.Names}}" | grep -wq "iam-apiserver"; then
              echo "  iam-apiserver container is running"
              sudo docker ps --filter "name=iam-apiserver" --format "table {{.Names}}\t{{.Status}}\t{{.Networks}}"
              http_status=$(sudo docker exec iam-apiserver curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9080/healthz || echo "000")
              echo "  Internal /healthz: $http_status"
            else
              echo "  iam-apiserver container is not running"
              sudo docker ps -a --filter "name=iam-apiserver" || true
            fi

            echo ""
            echo "Disk space:"
            df -h / | tail -1 | awk '{printf "  Root: %s used / %s total (%s)\n", $3, $2, $5}'

            echo ""
            echo "Memory usage:"
            free -h | awk 'NR==2{printf "  Used: %s / Total: %s (%.1f%%)\n", $3, $2, $3*100/$2}'
