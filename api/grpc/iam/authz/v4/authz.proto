syntax = "proto3";

package iam.authz.v4;

option go_package = "github.com/FangcunMount/iam/v5/api/grpc/iam/authz/v4;authzv4";

service AuthorizationService {
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc GetAuthorizationSnapshot(GetAuthorizationSnapshotRequest) returns (GetAuthorizationSnapshotResponse);
  rpc GrantAssignment(GrantAssignmentRequest) returns (GrantAssignmentResponse);
  rpc RevokeAssignment(RevokeAssignmentRequest) returns (RevokeAssignmentResponse);
  rpc ReplaceManagedAssignments(ReplaceManagedAssignmentsRequest) returns (ReplaceManagedAssignmentsResponse);
}

enum AuthorizationMode {
  AUTHORIZATION_MODE_UNSPECIFIED = 0;
  UNCONDITIONAL = 1;
  OBJECT_CHECK_REQUIRED = 2 [deprecated = true];
}

enum DecisionReason {
  DECISION_REASON_UNSPECIFIED = 0;
  ALLOWED = 1;
  NOT_MATCHED = 2;
  ATTRIBUTE_MISSING = 3 [deprecated = true];
}

message ObjectAttribute {
  option deprecated = true;
  string key = 1;
  oneof value {
    string string_value = 2;
    int64 int64_value = 3;
    bool bool_value = 4;
  }
}

message ObjectContext {
  option deprecated = true;
  string object_id = 1;
  repeated ObjectAttribute attributes = 2;
}

message CheckRequest {
  string subject = 1;
  reserved 2;
  reserved "domain";
  string resource = 3;
  string action = 4;
  ObjectContext object_context = 5 [deprecated = true];
}

message CheckResponse {
  bool allowed = 1;
  DecisionReason reason = 2;
  string deny_code = 3;
  string matched_grant_id = 4;
  string matched_role = 5;
  int64 policy_version = 6;
  repeated string missing_attribute_keys = 7 [deprecated = true];
}

message PermissionEntry {
  string resource = 1;
  string action = 2;
  AuthorizationMode mode = 3;
}

message GetAuthorizationSnapshotRequest {
  string subject = 1;
  reserved 2;
  reserved "domain";
  string app_name = 3;
  // Restricted to callers admitted to managed assignment replacement.
  bool include_assignment_facts = 4;
}

message GetAuthorizationSnapshotResponse {
  // roles contains the directly assigned roles for app_name, identical to direct_roles.
  repeated string roles = 1;
  repeated PermissionEntry permissions = 2;
  int64 policy_version = 3;
  // direct_roles contains only assignments directly bound to the subject.
  repeated string direct_roles = 4;
  // Full direct role facts, including other applications and global roles.
  repeated AssignmentRoleFact assignment_facts = 5;
  bool assignment_facts_complete = 6;
}

message GrantAssignmentRequest {
  string subject = 1;
  reserved 2;
  reserved "domain";
  string role_name = 3;
  string granted_by = 4;
}

message GrantAssignmentResponse {
  int64 policy_version = 1;
}

message RevokeAssignmentRequest {
  string subject = 1;
  reserved 2;
  reserved "domain";
  string role_name = 3;
  string revoked_by = 4;
  string reason = 5;
}

message RevokeAssignmentResponse {
  int64 policy_version = 1;
}

message ReplaceManagedAssignmentsRequest {
  string subject = 1;
  reserved 2;
  reserved "domain";
  repeated string role_names = 3;
  string changed_by = 4;
  string reason = 5;
}

message ReplaceManagedAssignmentsResponse {
  repeated string direct_roles = 1;
  int64 policy_version = 2;
  bool changed = 3;
}

message AssignmentRoleFact {
  string role_id = 1;
  string role_name = 2;
  string management_protection = 3;
}
