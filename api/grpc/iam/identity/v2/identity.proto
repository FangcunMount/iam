syntax = "proto3";

package iam.identity.v2;

option go_package = "github.com/FangcunMount/iam/v3/api/grpc/iam/identity/v2;identityv2";

import "google/protobuf/timestamp.proto";

// ============= Enums =============

// 用户状态
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_BLOCKED = 3;
}

// 联系方式类型
enum ContactType {
  CONTACT_TYPE_UNSPECIFIED = 0;
  CONTACT_TYPE_PHONE = 1;
  CONTACT_TYPE_EMAIL = 2;
  CONTACT_TYPE_WECHAT = 3;
  CONTACT_TYPE_CUSTOM = 4;
}

// 档案性别
enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
}

// 档案关系类型
enum ProfileLinkRelation {
  PROFILE_LINK_RELATION_UNSPECIFIED = 0;
  PROFILE_LINK_RELATION_SELF = 1;
  PROFILE_LINK_RELATION_PARENT = 2;
  PROFILE_LINK_RELATION_GRANDPARENT = 3;
  PROFILE_LINK_RELATION_OTHER = 10;
}

// ============= Value Objects =============

// 经校验的联系方式
message VerifiedContact {
  ContactType type = 1;
  string value = 2; // 已脱敏展示值
  google.protobuf.Timestamp verified_at = 3;
}

// 身份证件
message IdentityDocument {
  string type = 1;          // 例如 id_card/passport
  string masked_number = 2; // 已脱敏编号
}

// 外部身份（第三方账号）
message ExternalIdentity {
  string provider = 1;     // 例如 sso、crm
  string external_id = 2;  // 提供方的 ID
  string display_name = 3; // 可选展示名
}

// 操作人上下文（写接口必填）
message OperatorContext {
  string operator_id = 1;
  string operator_name = 2;
  string channel = 3; // 例如 "oa" / "ops_console"
  string reason = 4;
  map<string, string> extra = 10;
}

// 偏移分页
message OffsetPagination {
  uint32 limit = 1;
  uint32 offset = 2;
}

// ============= Aggregates =============

message User {
  string id = 1; // 十进制字符串
  UserStatus status = 2;
  string nickname = 3;
  string avatar_url = 4;
  repeated VerifiedContact contacts = 5;
  repeated ExternalIdentity external_identities = 6;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message Profile {
  string id = 1;
  string legal_name = 2;
  Gender gender = 3;
  string dob = 4; // YYYY-MM-DD
  IdentityDocument identity = 5;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ProfileLink {
  string id = 1;
  string user_id = 2;
  string profile_id = 3;
  ProfileLinkRelation relation = 4;
  google.protobuf.Timestamp since = 5;
  google.protobuf.Timestamp revoked_at = 6;
}

message ProfileEdge {
  Profile profile = 1;
  ProfileLink profile_link = 2;
}

message ProfileLinkEdge {
  ProfileLink profile_link = 1;
  User user = 2;
}

// 用于 (user_id, profile_id) 唯一定位一条关系
message ProfileLinkKey {
  string user_id = 1;
  string profile_id = 2;
}

message ProfileLinkSelector {
  oneof selector {
    string profile_link_id = 1;
    ProfileLinkKey key = 2;
  }
}

// ============= Read Models =============

message GetUserRequest { string user_id = 1; }
message GetUserResponse { User user = 1; }

message BatchGetUsersRequest { repeated string user_ids = 1; }
message BatchGetUsersResponse {
  repeated User users = 1;
  repeated string not_found_ids = 2;
}

message SearchUsersRequest {
  string keyword = 1;              // 模糊匹配昵称/邮箱/手机号
  repeated string phones = 2;      // 精确匹配
  repeated string emails = 3;      // 精确匹配
  OffsetPagination page = 10;
}
message SearchUsersResponse {
  int32 total = 1;
  OffsetPagination page = 2;
  repeated User users = 3;
}

message GetProfileRequest { string profile_id = 1; }
message GetProfileResponse { Profile profile = 1; }

message BatchGetProfilesRequest { repeated string profile_ids = 1; }
message BatchGetProfilesResponse {
  repeated Profile profiles = 1;
  repeated string not_found_ids = 2;
}

message ListProfilesRequest {
  string user_id = 1;
  OffsetPagination page = 2;
  bool include_revoked = 3;
}
message ListProfilesResponse {
  int32 total = 1;
  OffsetPagination page = 2;
  repeated ProfileEdge items = 3;
}

message ListProfileLinksRequest {
  string profile_id = 1;
  bool include_revoked = 2;
}
message ListProfileLinksResponse {
  int32 total = 1;
  repeated ProfileLinkEdge items = 2;
}

message HasProfileLinkRequest {
  string user_id = 1;
  string profile_id = 2;
}
message HasProfileLinkResponse {
  bool has_profile_link = 1;
  ProfileLink profile_link = 2;
}

// ============= Command Models =============

message CreateProfileRequest {
  string user_id = 1;
  string legal_name = 2;
  Gender gender = 3;
  string dob = 4; // YYYY-MM-DD
  string id_card_number = 5;
  ProfileLinkRelation relation = 6;
  OperatorContext operator = 10;
}
message CreateProfileResponse {
  Profile profile = 1;
  ProfileLink profile_link = 2;
}

message EstablishProfileLinkRequest {
  string user_id = 1;
  string profile_id = 2;
  ProfileLinkRelation relation = 3;
  OperatorContext operator = 10;
}
message EstablishProfileLinkResponse { ProfileLink profile_link = 1; }

message RevokeProfileLinkRequest {
  ProfileLinkSelector target = 1;
  string reason = 2;
  OperatorContext operator = 10;
}
message RevokeProfileLinkResponse { ProfileLink profile_link = 1; }

message BatchRevokeProfileLinksRequest {
  repeated ProfileLinkSelector targets = 1;
  string reason = 2;
  OperatorContext operator = 10;
}
message BatchRevokeProfileLinksResponse {
  repeated ProfileLink revoked = 1;
  repeated FailedProfileLinkFailure failures = 2;
}

message FailedProfileLinkFailure {
  ProfileLinkSelector target = 1;
  string error = 2;
}

message ImportProfileLinkRecord {
  string user_id = 1;
  string profile_id = 2;
  ProfileLinkRelation relation = 3;
}
message ImportProfileLinksRequest {
  repeated ImportProfileLinkRecord records = 1;
  OperatorContext operator = 10;
}
message ImportProfileLinksResponse {
  repeated ProfileLink created = 1;
  repeated FailedImportProfileLink failures = 2;
}
message FailedImportProfileLink {
  ImportProfileLinkRecord record = 1;
  string error = 2;
}

// ============= Identity lifecycle =============

message CreateUserRequest {
  string nickname = 1;
  string phone = 2;
  string email = 3;
  string avatar_url = 4;
  repeated VerifiedContact contacts = 5;
  repeated ExternalIdentity external_identities = 6;
  OperatorContext operator = 10;
}
message CreateUserResponse { User user = 1; }

message UpdateUserRequest {
  string user_id = 1;
  string nickname = 2;
  string phone = 3;
  string email = 4;
  string avatar_url = 5;
  repeated VerifiedContact contacts = 6;
  repeated ExternalIdentity external_identities = 7;
  OperatorContext operator = 10;
}
message UpdateUserResponse { User user = 1; }

message ChangeUserStatusRequest {
  string user_id = 1;
  string reason = 2;
  OperatorContext operator = 10;
}
message UserOperationResponse { User user = 1; }

// ============= Services =============

service IdentityRead {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc BatchGetProfiles(BatchGetProfilesRequest) returns (BatchGetProfilesResponse);
}

service ProfileLinkQuery {
  rpc HasProfileLink(HasProfileLinkRequest) returns (HasProfileLinkResponse);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc ListProfileLinks(ListProfileLinksRequest) returns (ListProfileLinksResponse);
}

service ProfileCommand {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
}

service ProfileLinkCommand {
  rpc EstablishProfileLink(EstablishProfileLinkRequest) returns (EstablishProfileLinkResponse);
  rpc RevokeProfileLink(RevokeProfileLinkRequest) returns (RevokeProfileLinkResponse);
  rpc BatchRevokeProfileLinks(BatchRevokeProfileLinksRequest) returns (BatchRevokeProfileLinksResponse);
  rpc ImportProfileLinks(ImportProfileLinksRequest) returns (ImportProfileLinksResponse);
}

service IdentityLifecycle {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeactivateUser(ChangeUserStatusRequest) returns (UserOperationResponse);
  rpc BlockUser(ChangeUserStatusRequest) returns (UserOperationResponse);
}
