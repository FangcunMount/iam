openapi: 3.1.0
info:
  title: IAM · AuthN API v2（认证中心）
  version: 2.0.0
  description: 身份认证、令牌生命周期、登录身份开通与 JWKS REST API。公开登录入口使用 auth_method + method_payload 显式 v2 契约。
  contact:
    name: API Support
    email: yshujie@163.com
    url: https://github.com/FangcunMount/iam
servers:
- url: https://iam.fangcunmount.cn/api/v2
  description: Production
- url: http://localhost:18081/api/v2
  description: Local Dev
security:
- bearerAuth: []
tags:
- name: Authentication-Auth
  description: 认证与令牌生命周期
- name: Authentication-JWKS
  description: 公钥集管理
- name: 认证
paths:
  /.well-known/jwks.json:
    get:
      tags:
      - Authentication-JWKS
      summary: 获取 JWKS
      description: 获取 JSON Web Key Set，用于验证 JWT 签名
      responses:
        '200':
          description: JWKS JSON
          headers:
            Cache-Control:
              schema:
                type: string
              description: 缓存控制
            ETag:
              schema:
                type: string
              description: 实体标签
            Last-Modified:
              schema:
                type: string
              description: 最后修改时间
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
  /authn/admin/jwks/keys:
    get:
      tags:
      - Authentication-JWKS
      summary: 列出密钥
      description: 分页列出所有密钥
      parameters:
      - name: status
        in: query
        description: 状态过滤 (active, grace, retired)
        schema:
          type: string
      - name: limit
        in: query
        description: 每页数量
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        description: 偏移量
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: 密钥列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.KeyListResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
    post:
      tags:
      - Authentication-JWKS
      summary: 创建密钥
      description: 创建新的签名密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.CreateKeyRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.KeyResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
  /authn/admin/jwks/keys/{kid}:
    get:
      tags:
      - Authentication-JWKS
      summary: 获取密钥详情
      description: 根据 kid 获取密钥详细信息
      parameters:
      - name: kid
        in: path
        description: 密钥 ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 密钥详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.KeyResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
  /authn/admin/jwks/keys/{kid}/force-retire:
    post:
      tags:
      - Authentication-JWKS
      summary: 强制退役密钥
      description: 强制将任何状态的密钥转为 Retired（用于紧急情况）
      parameters:
      - name: kid
        in: path
        description: 密钥 ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 强制退役成功
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
  /authn/admin/jwks/keys/{kid}/retire:
    post:
      tags:
      - Authentication-JWKS
      summary: 退役密钥
      description: 将密钥状态从 Grace 转为 Retired
      parameters:
      - name: kid
        in: path
        description: 密钥 ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 退役成功
        '400':
          description: 参数错误或状态不允许
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
  /authn/admin/jwks/keys/cleanup:
    post:
      tags:
      - Authentication-JWKS
      summary: 清理过期密钥
      description: 删除已过期的 Retired 密钥
      responses:
        '200':
          description: 清理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.CleanupResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
  /authn/admin/jwks/keys/publishable:
    get:
      tags:
      - Authentication-JWKS
      summary: 获取可发布的密钥
      description: 获取当前会被发布到 JWKS 的密钥列表（用于预览或调试）
      responses:
        '200':
          description: 可发布的密钥列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.PublishableKeysResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '500':
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
  /authn/challenges/phone-otp:
    post:
      tags:
      - 认证
      summary: 发送登录短信验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.SendLoginPhoneOTPRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.MessageResponse'
  /authn/login:
    post:
      tags:
      - Authentication-Auth
      summary: 显式登录
      description: 使用 auth_method 明确选择认证方式，method_payload 按认证方式解析。v2 只开放 password、phone_otp、wechat、wechat_scan、wecom。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LoginV2Request'
            examples:
              password:
                value:
                  auth_method: password
                  method_payload:
                    username: admin@example.com
                    password: Admin@123
                    tenant_id: 1
              phone_otp:
                value:
                  auth_method: phone_otp
                  method_payload:
                    phone: '+8613811112222'
                    otp_code: '123456'
              wechat:
                value:
                  auth_method: wechat
                  method_payload:
                    app_id: wx_appid
                    code: js_code
              wechat_scan:
                value:
                  auth_method: wechat_scan
                  method_payload:
                    app_id: wx_open_appid
                    code: oauth_code
                    state: oauth_state
              wecom:
                value:
                  auth_method: wecom
                  method_payload:
                    corp_id: corp_id
                    auth_code: auth_code
      responses:
        '200':
          description: 登录成功，返回访问令牌和刷新令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.TokenPair'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
  /authn/login-identities:
    get:
      tags:
      - 认证
      summary: 列出当前用户登录身份
      responses:
        '200':
          description: 当前用户已绑定的登录身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LoginIdentityListResponse'
  /authn/login-identities/{id}:
    delete:
      tags:
      - 认证
      summary: 解绑登录身份
      parameters:
      - name: id
        in: path
        description: 登录身份 ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 已解绑
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.MessageResponse'
  /authn/login-identities/phone:
    post:
      tags:
      - 认证
      summary: 绑定手机号登录身份
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkPhoneRequest'
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LinkLoginIdentityResponse'
  /authn/login-identities/phone/challenge:
    post:
      tags:
      - 认证
      summary: 发送手机号绑定验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkPhoneChallengeRequest'
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.MessageResponse'
  /authn/login-identities/wechat-miniprogram:
    post:
      tags:
      - 认证
      summary: 绑定微信小程序登录身份
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkWechatMiniProgramRequest'
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LinkLoginIdentityResponse'
  /authn/login-identities/wechat-open:
    post:
      tags:
      - 认证
      summary: 完成微信开放平台扫码绑定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkWechatOpenRequest'
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LinkLoginIdentityResponse'
  /authn/login-identities/wechat-open/authorize:
    post:
      tags:
      - 认证
      summary: 发起微信开放平台扫码绑定授权
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkWechatOpenAuthorizeRequest'
      responses:
        '200':
          description: 授权地址与 state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.WechatOpenAuthorizeResponse'
  /authn/login-identities/wecom:
    post:
      tags:
      - 认证
      summary: 绑定企业微信登录身份
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkWecomRequest'
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LinkLoginIdentityResponse'
  /authn/logout:
    post:
      tags:
      - 认证
      summary: 用户登出
      description: 撤销访问令牌和刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LogoutRequest'
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.MessageResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
  /authn/refresh_token:
    post:
      tags:
      - 认证
      summary: 刷新访问令牌
      description: 使用刷新令牌获取新的访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功，返回新的访问令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.TokenPair'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        '401':
          description: 刷新令牌无效或已过期
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
  /authn/signups/wechat-miniprogram:
    post:
      tags:
      - 认证
      summary: 微信小程序登录身份开通
      description: 通过微信小程序 code 建立 User 与 LoginIdentity 绑定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.SignUpWithWeChatMiniProgramRequest'
      responses:
        '200':
          description: 开通成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.SignupResult'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        '409':
          description: 登录身份已绑定到其他用户
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
  /authn/verify:
    post:
      tags:
      - 认证
      summary: 验证访问令牌
      description: 验证访问令牌的有效性并返回声明信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.VerifyTokenRequest'
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.TokenVerifyResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
        '401':
          description: 令牌无效
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
  /authn/wechat-open/authorize:
    post:
      tags:
      - 认证
      summary: 发起微信开放平台扫码登录授权
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.WechatOpenLoginAuthorizeRequest'
      responses:
        '200':
          description: 授权地址与 state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.WechatOpenAuthorizeResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    KeyId:
      in: path
      name: kid
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
