openapi: 3.1.0
info:
  title: IAM · Suggest API v2
  version: 2.0.0
  description: 联想搜索 REST API
  contact:
    name: API Support
    email: yshujie@163.com
    url: https://github.com/FangcunMount/iam
servers:
- url: https://iam.fangcunmount.cn/api/v2
  description: Production
- url: http://localhost:18081/api/v2
  description: Local Dev
security:
- bearerAuth: []
tags:
- name: Suggest
paths:
  /suggest/profile:
    get:
      tags:
      - Suggest
      summary: 档案联想搜索
      description: 基于索引召回并按当前用户数据权限过滤；数字关键词支持档案 ID，手机号搜索需额外授权
      parameters:
      - name: k
        in: query
        description: 关键词；纯数字可为档案 ID 或手机号（手机号需授权）
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: 返回条数上限
        schema:
          type: integer
      responses:
        '200':
          description: 联想结果（按权重降序，去重）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_apiserver_transport_rest_suggest.ProfileSuggestResponse'
        '400':
          description: 参数缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '403':
          description: 无搜索权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    internal_apiserver_transport_rest_suggest.ProfileSuggestResponse:
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/internal_apiserver_transport_rest_suggest.ProfileSuggestResponseItem'
        message:
          type: string
      required:
      - code
      - data
      - message
      type: object
    github_com_FangcunMount_iam_v2_pkg_core.ErrResponse:
      properties:
        code:
          description: Code 定义了业务错误代码
          type: integer
        message:
          description: 'Message 包含此消息的详细信息

            此消息适合暴露给外部'
          type: string
        reference:
          description: Reference 返回参考文档，可能有助于解决此错误
          type: string
      type: object
    internal_apiserver_transport_rest_suggest.ProfileSuggestResponseItem:
      properties:
        id:
          type: string
        mobile_mask:
          type: string
        name:
          type: string
        weight:
          type: integer
      type: object
