services:
  # IAM API Server (production)
  iam-apiserver:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-fangcunmount/iam}:${IMAGE_TAG:-latest}
    container_name: iam-apiserver
    user: "${WWW_UID:?WWW_UID is required}:${WWW_GID:?WWW_GID is required}"
    env_file:
      - ../../configs/env/config.prod.env
    # 端口配置：仅暴露给 Docker 内网，外部访问通过 Nginx 反向代理
    # expose: 仅容器网络内可访问，不映射到宿主机
    expose:
      - "9080"   # HTTP REST API (内网服务调用，性能优先)
      - "9090"   # gRPC 服务 (mTLS 保护，内网服务间通信)
      - "9091"   # gRPC 健康检查 (内网监控系统)
    volumes:
      - type: bind
        source: /var/lib/fangcun-m4-materials/iam-messaging/versions/${ROCKETMQ_BINDING_REVISION:?fixed messaging revision required}/rocketmq/credentials.json
        target: /etc/iam/rocketmq/credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/fangcun-m4-materials/iam-messaging/versions/${ROCKETMQ_BINDING_REVISION:?fixed messaging revision required}/rocketmq/ca.crt
        target: /etc/iam/rocketmq/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/fangcun-m4-materials/iam-messaging/versions/${ROCKETMQ_BINDING_REVISION:?fixed messaging revision required}/rocketmq/routes.json
        target: /etc/iam/rocketmq/routes.json
        read_only: true
        bind:
          create_host_path: false
      - /data/infra/ssl/redis/ca-chain.pem:/etc/qlume/redis/ca-chain.pem:ro
      - /data/infra/ssl/mysql/ca-chain.pem:/etc/qlume/mysql/ca-chain.pem:ro
      # 挂载配置文件（可以覆盖镜像中的配置）
      - ../../configs:/app/configs:ro
      # 挂载日志目录
      - /data/logs/iam:/var/log/iam
      # 挂载 gRPC mTLS 证书（由 infra 项目统一管理）
      - /data/infra/ssl/grpc/ca/ca-chain.crt:/etc/iam/grpc/ca/ca-chain.crt:ro
      - /data/infra/ssl/grpc/server/iam-apiserver.crt:/etc/iam/grpc/server/iam-apiserver.crt:ro
      - /data/infra/ssl/grpc/server/iam-apiserver.key:/etc/iam/grpc/server/iam-apiserver.key:ro
      # 挂载 JWKS 密钥目录（与镜像内部 /app/data/keys 映射，用于持久化私钥）
      - /data/ops/iam-keys:/app/data/keys:rw
    environment:
      - TZ=Asia/Shanghai
      - GO_ENV=production
      - GOMEMLIMIT=768MiB
      - GOGC=75
    # Use Docker/host DNS on Tencent; Aliyun VPC resolvers are not reachable here.
    networks:
      - infra-network
    # docker compose (非 swarm) 资源限制
    mem_limit: 1G
    cpus: "1"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
      placement:
        constraints:
          - node.hostname == serverA
    # Includes the SDK 20s drain budget plus other shutdown hooks.
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  infra-network:
    external: true
    name: infra-network
