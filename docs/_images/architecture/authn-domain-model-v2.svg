<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc">
  <title id="title">AuthN 领域模型：关键字段版</title>
  <desc id="desc">按长期认证事实、单次认证语义和在线认证状态三类生命周期展示 AuthN 领域模型，并为实体、结果值、接口、服务和令牌产物展示适量的业务关键字段或核心操作。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4267b2"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7653b5"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 54px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #64748b; }
      .context-title { font-size: 36px; font-weight: 700; }
      .context-sub { font-size: 20px; fill: #475569; }
      .band-index { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .band-title { font-size: 29px; font-weight: 700; }
      .band-desc { font-size: 18px; fill: #64748b; }
      .stereotype { font-size: 15px; font-weight: 700; letter-spacing: 0.7px; fill: #64748b; }
      .model { font-size: 25px; font-weight: 700; }
      .field { font-size: 16px; fill: #475569; }
      .field-strong { font-size: 16px; font-weight: 600; fill: #334155; }
      .operation { font-size: 17px; font-weight: 600; fill: #2f855a; }
      .small { font-size: 14px; fill: #64748b; }
      .relation { font-size: 16px; font-weight: 600; fill: #475569; }
      .relation-blue { font-size: 16px; font-weight: 600; fill: #4267b2; }
      .callout { font-size: 25px; font-weight: 700; }
      .note { font-size: 18px; fill: #475569; }
      .solid { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .association { fill: none; stroke: #64748b; stroke-width: 3; }
      .reference { fill: none; stroke: #4267b2; stroke-width: 3; stroke-dasharray: 12 9; marker-end: url(#arrowBlue); }
      .artifact-link { fill: none; stroke: #7653b5; stroke-width: 3; marker-end: url(#arrowPurple); }
      .divider { stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="3200" height="1800" fill="#ffffff"/>
  <text x="110" y="86" class="title">AuthN 领域模型：从长期认证事实到在线认证状态</text>
  <text x="110" y="132" class="subtitle">字段只保留身份定位、行为选择、认证判定和生命周期语义；不展示数据库外键、持久化元数据或敏感值。</text>

  <!-- Identity external context -->
  <rect x="90" y="205" width="430" height="410" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="305" y="255" text-anchor="middle" class="context-title" style="font-size:30px">Identity</text>
  <text x="305" y="286" text-anchor="middle" class="context-sub">外部限界上下文</text>
  <rect x="135" y="350" width="340" height="175" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="305" y="382" text-anchor="middle" class="stereotype">« EXTERNAL AGGREGATE »</text>
  <text x="305" y="423" text-anchor="middle" class="model">User</text>
  <line x1="165" y1="444" x2="445" y2="444" class="divider"/>
  <text x="305" y="478" text-anchor="middle" class="field-strong">ID · Status</text>
  <text x="305" y="506" text-anchor="middle" class="small">系统用户身份锚点</text>

  <!-- AuthN bounded context -->
  <rect x="590" y="185" width="2520" height="1385" rx="28" fill="#f8fafc" stroke="#3f8f5a" stroke-width="3" filter="url(#shadow)"/>
  <rect x="590" y="185" width="2520" height="112" rx="28" fill="#dff3e5"/>
  <path d="M590 270 H3110" stroke="#3f8f5a" stroke-width="2"/>
  <text x="1850" y="232" text-anchor="middle" class="context-title">AuthN｜认证限界上下文</text>
  <text x="1850" y="264" text-anchor="middle" class="context-sub">长期事实、单次认证语义和在线认证状态分别建模；AuthN 只通过 UserID 引用 Identity</text>

  <!-- 1. Long-lived facts -->
  <rect x="630" y="325" width="2440" height="325" rx="22" fill="#fff9e8" stroke="#e1b84f" stroke-width="2"/>
  <circle cx="690" cy="378" r="24" fill="#d29b23"/>
  <text x="690" y="386" text-anchor="middle" class="band-index">1</text>
  <text x="735" y="382" class="band-title">长期认证事实</text>
  <text x="735" y="414" class="band-desc">跨多次登录持续存在，回答“用户拥有哪些登录入口与长期认证材料”</text>

  <rect x="790" y="455" width="570" height="165" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.7"/>
  <text x="1075" y="484" text-anchor="middle" class="stereotype">« ENTITY »</text>
  <text x="1075" y="521" text-anchor="middle" class="model">LoginIdentity</text>
  <line x1="825" y1="539" x2="1325" y2="539" class="divider"/>
  <text x="1075" y="565" text-anchor="middle" class="field-strong">ID · UserID</text>
  <text x="1075" y="590" text-anchor="middle" class="field">Provider · Realm · Identifier</text>
  <text x="1075" y="614" text-anchor="middle" class="field">GlobalIdentifier · Status · VerifiedAt</text>

  <rect x="1700" y="455" width="570" height="165" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.4"/>
  <text x="1985" y="484" text-anchor="middle" class="stereotype">« ENTITY »</text>
  <text x="1985" y="521" text-anchor="middle" class="model">Credential</text>
  <line x1="1735" y1="539" x2="2235" y2="539" class="divider"/>
  <text x="1985" y="565" text-anchor="middle" class="field-strong">ID · LoginIdentityID · Type</text>
  <text x="1985" y="590" text-anchor="middle" class="field">Material · Algo</text>
  <text x="1985" y="614" text-anchor="middle" class="field">Status · FailedAttempts · LockedUntil</text>

  <path d="M1362 537 H1698" class="association"/>
  <text x="1530" y="518" text-anchor="middle" class="relation">持有长期认证材料</text>
  <text x="1380" y="561" class="small">1</text>
  <text x="1640" y="561" class="small">0..*</text>

  <path d="M475 438 H645 Q685 438 685 520 H788" class="reference"/>
  <rect x="500" y="396" width="292" height="34" rx="8" fill="#ffffff"/>
  <text x="646" y="420" text-anchor="middle" class="relation-blue">通过 UserID 引用身份锚点</text>

  <!-- 2. Authentication attempt -->
  <rect x="630" y="675" width="2440" height="470" rx="22" fill="#edf7f0" stroke="#74af84" stroke-width="2"/>
  <circle cx="690" cy="728" r="24" fill="#3f8f5a"/>
  <text x="690" y="736" text-anchor="middle" class="band-index">2</text>
  <text x="735" y="732" class="band-title">单次认证语义</text>
  <text x="735" y="764" class="band-desc">一次认证尝试中的证明、验证与判定；服务展示核心操作，接口展示类型判别</text>

  <rect x="670" y="825" width="405" height="205" rx="18" fill="#ffffff" stroke="#659d74" stroke-width="2.2"/>
  <text x="872" y="855" text-anchor="middle" class="stereotype">« SHORT-LIVED ENTITY »</text>
  <text x="872" y="893" text-anchor="middle" class="model">Challenge</text>
  <line x1="700" y1="912" x2="1045" y2="912" class="divider"/>
  <text x="872" y="939" text-anchor="middle" class="field-strong">ID · Type · Scene</text>
  <text x="872" y="965" text-anchor="middle" class="field">Target · SecretHash</text>
  <text x="872" y="991" text-anchor="middle" class="field">Attempts · ExpiresAt · ConsumedAt</text>
  <text x="872" y="1016" text-anchor="middle" class="small">一次性挑战，可过期且只可消费一次</text>

  <rect x="1120" y="825" width="430" height="205" rx="18" fill="#eaf3ff" stroke="#4267b2" stroke-width="2.4"/>
  <text x="1335" y="855" text-anchor="middle" class="stereotype">« PROOF INTERFACE »</text>
  <text x="1335" y="893" text-anchor="middle" class="model">AuthCredential</text>
  <line x1="1150" y1="912" x2="1520" y2="912" class="divider"/>
  <text x="1335" y="942" text-anchor="middle" class="operation">CredentialKind()</text>
  <text x="1335" y="974" text-anchor="middle" class="field">Password · OTP · ExternalIdentity</text>
  <text x="1335" y="1003" text-anchor="middle" class="small">本次请求提交的认证证明抽象</text>

  <rect x="1595" y="825" width="380" height="205" rx="18" fill="#e4f6e9" stroke="#348957" stroke-width="2.8"/>
  <text x="1785" y="855" text-anchor="middle" class="stereotype">« DOMAIN SERVICE »</text>
  <text x="1785" y="893" text-anchor="middle" class="model">Authenticator</text>
  <line x1="1625" y1="912" x2="1945" y2="912" class="divider"/>
  <text x="1785" y="945" text-anchor="middle" class="operation">Authenticate(proof)</text>
  <text x="1785" y="975" text-anchor="middle" class="field">按 CredentialKind 选择策略</text>
  <text x="1785" y="1003" text-anchor="middle" class="small">输出 AuthDecision</text>

  <rect x="2020" y="825" width="400" height="205" rx="18" fill="#eaf3ff" stroke="#4267b2" stroke-width="2.4"/>
  <text x="2220" y="855" text-anchor="middle" class="stereotype">« RESULT VALUE »</text>
  <text x="2220" y="893" text-anchor="middle" class="model">AuthDecision</text>
  <line x1="2050" y1="912" x2="2390" y2="912" class="divider"/>
  <text x="2220" y="939" text-anchor="middle" class="field-strong">OK · Code</text>
  <text x="2220" y="965" text-anchor="middle" class="field">LoginIdentityID · CredentialID</text>
  <text x="2220" y="991" text-anchor="middle" class="field">ShouldRotate</text>
  <text x="2220" y="1016" text-anchor="middle" class="small">成功时携带 Principal</text>

  <rect x="2465" y="805" width="500" height="235" rx="18" fill="#dcecff" stroke="#4267b2" stroke-width="2.8"/>
  <text x="2715" y="835" text-anchor="middle" class="stereotype">« RUNTIME VALUE »</text>
  <text x="2715" y="874" text-anchor="middle" class="model">Principal</text>
  <line x1="2495" y1="893" x2="2935" y2="893" class="divider"/>
  <text x="2715" y="920" text-anchor="middle" class="field-strong">UserID · LoginIdentityID</text>
  <text x="2715" y="946" text-anchor="middle" class="field">TenantID · SessionID</text>
  <text x="2715" y="972" text-anchor="middle" class="field">AuthMethod · Realm · AMR</text>
  <text x="2715" y="998" text-anchor="middle" class="field">Claims</text>
  <text x="2715" y="1024" text-anchor="middle" class="small">认证成功后的请求级主体</text>

  <path d="M1077 928 H1118" class="solid"/>
  <text x="1098" y="912" text-anchor="middle" class="relation">支撑</text>
  <path d="M1552 928 H1593" class="solid"/>
  <text x="1573" y="912" text-anchor="middle" class="relation">提交</text>
  <path d="M1977 928 H2018" class="solid"/>
  <text x="1998" y="912" text-anchor="middle" class="relation">作出</text>
  <path d="M2422 928 H2463" class="solid"/>
  <text x="2443" y="912" text-anchor="middle" class="relation">成功</text>

  <path d="M1075 622 V690 Q1075 715 1105 715 H1725 Q1785 715 1785 823" class="solid"/>
  <rect x="1285" y="692" width="300" height="32" rx="8" fill="#edf7f0"/>
  <text x="1435" y="715" text-anchor="middle" class="relation">提供登录身份事实</text>
  <path d="M1985 622 V755 Q1985 780 1955 780 H1825 Q1785 780 1785 823" class="solid"/>
  <rect x="1970" y="704" width="330" height="32" rx="8" fill="#edf7f0"/>
  <text x="2135" y="727" text-anchor="middle" class="relation">按认证方式提供长期验证材料</text>

  <!-- 3. Online state and issued artifacts -->
  <rect x="630" y="1170" width="2440" height="350" rx="22" fill="#f4f0fb" stroke="#9a82c6" stroke-width="2"/>
  <circle cx="690" cy="1223" r="24" fill="#7653b5"/>
  <text x="690" y="1231" text-anchor="middle" class="band-index">3</text>
  <text x="735" y="1227" class="band-title">在线认证状态与签发产物</text>
  <text x="735" y="1259" class="band-desc">认证结果被转化为可撤销的会话状态，并签发带有身份、会话和有效期语义的令牌</text>

  <rect x="675" y="1300" width="455" height="185" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.5"/>
  <text x="902" y="1329" text-anchor="middle" class="stereotype">« ENTITY »</text>
  <text x="902" y="1366" text-anchor="middle" class="model">Session</text>
  <line x1="705" y1="1383" x2="1100" y2="1383" class="divider"/>
  <text x="902" y="1408" text-anchor="middle" class="field-strong">SessionID</text>
  <text x="902" y="1432" text-anchor="middle" class="field">UserID · LoginIdentityID · TenantID</text>
  <text x="902" y="1456" text-anchor="middle" class="field">AuthMethod · Realm · AMR</text>
  <text x="902" y="1480" text-anchor="middle" class="field">Status · ExpiresAt · RevokedAt</text>

  <rect x="1175" y="1300" width="360" height="185" rx="18" fill="#eee8fa" stroke="#7653b5" stroke-width="2.7"/>
  <text x="1355" y="1329" text-anchor="middle" class="stereotype">« APPLICATION SERVICE »</text>
  <text x="1355" y="1366" text-anchor="middle" class="model">TokenIssuer</text>
  <line x1="1205" y1="1383" x2="1505" y2="1383" class="divider"/>
  <text x="1355" y="1415" text-anchor="middle" class="operation">Issue(principal, session)</text>
  <text x="1355" y="1446" text-anchor="middle" class="field">组织 Access / Refresh 签发</text>
  <text x="1355" y="1475" text-anchor="middle" class="small">输出 TokenPair</text>

  <rect x="1580" y="1300" width="430" height="185" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.3"/>
  <text x="1795" y="1329" text-anchor="middle" class="stereotype">« ISSUED ARTIFACT »</text>
  <text x="1795" y="1366" text-anchor="middle" class="model">AccessToken</text>
  <line x1="1610" y1="1383" x2="1980" y2="1383" class="divider"/>
  <text x="1795" y="1408" text-anchor="middle" class="field-strong">ID · Subject · SessionID</text>
  <text x="1795" y="1432" text-anchor="middle" class="field">TenantID · Audience · AMR</text>
  <text x="1795" y="1456" text-anchor="middle" class="field">IssuedAt · ExpiresAt</text>
  <text x="1795" y="1480" text-anchor="middle" class="small">认证结果快照 · JWT</text>

  <rect x="2055" y="1300" width="430" height="185" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.3"/>
  <text x="2270" y="1329" text-anchor="middle" class="stereotype">« ISSUED ARTIFACT »</text>
  <text x="2270" y="1366" text-anchor="middle" class="model">RefreshToken</text>
  <line x1="2085" y1="1383" x2="2455" y2="1383" class="divider"/>
  <text x="2270" y="1408" text-anchor="middle" class="field-strong">ID · SessionID · UserID</text>
  <text x="2270" y="1432" text-anchor="middle" class="field">TenantID · AMR</text>
  <text x="2270" y="1456" text-anchor="middle" class="field">IssuedAt · ExpiresAt</text>
  <text x="2270" y="1480" text-anchor="middle" class="small">与 Session 生命周期绑定</text>

  <rect x="2530" y="1300" width="430" height="185" rx="18" fill="#eee8fa" stroke="#7653b5" stroke-width="2.5"/>
  <text x="2745" y="1329" text-anchor="middle" class="stereotype">« SUPPORTING KEY MODEL »</text>
  <text x="2745" y="1366" text-anchor="middle" class="model">Key / JWKS</text>
  <line x1="2560" y1="1383" x2="2930" y2="1383" class="divider"/>
  <text x="2745" y="1408" text-anchor="middle" class="field-strong">Kid · Alg · Status</text>
  <text x="2745" y="1432" text-anchor="middle" class="field">NotBefore · NotAfter</text>
  <text x="2745" y="1456" text-anchor="middle" class="field">Active · Grace · Retired</text>
  <text x="2745" y="1480" text-anchor="middle" class="small">签名、验证、轮换与公开发布</text>

  <path d="M2715 1042 V1110 H902 V1298" class="artifact-link"/>
  <rect x="1650" y="1087" width="245" height="32" rx="8" fill="#ffffff"/>
  <text x="1772" y="1110" text-anchor="middle" class="relation">建立认证会话</text>
  <path d="M2715 1042 V1135 H1355 V1298" class="artifact-link"/>
  <rect x="2080" y="1112" width="245" height="32" rx="8" fill="#ffffff"/>
  <text x="2202" y="1135" text-anchor="middle" class="relation">提供认证结果</text>

  <path d="M1132 1392 H1173" class="artifact-link"/>
  <path d="M1537 1392 H1578" class="artifact-link"/>
  <text x="1557" y="1375" text-anchor="middle" class="relation">签发</text>
  <path d="M1355 1487 V1503 H2270 V1487" class="artifact-link"/>
  <rect x="1685" y="1484" width="260" height="28" rx="7" fill="#f4f0fb"/>
  <text x="1815" y="1505" text-anchor="middle" class="relation">签发并绑定 Session</text>
  <path d="M2745 1298 V1278 H1795 V1298" class="artifact-link"/>
  <rect x="2180" y="1264" width="210" height="28" rx="7" fill="#f4f0fb"/>
  <text x="2285" y="1285" text-anchor="middle" class="relation">签名 / 验证</text>

  <!-- Conclusion -->
  <rect x="90" y="1615" width="3020" height="125" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1600" y="1662" text-anchor="middle" class="callout">关键字段解释业务语义，而不是还原存储结构</text>
  <text x="1600" y="1703" text-anchor="middle" class="note">ID 说明身份锚点，Type / Provider 说明行为选择，Status / ExpiresAt 说明生命周期，OK / Code / AMR 说明认证结果。</text>

  <line x1="2040" y1="1770" x2="2110" y2="1770" class="association"/>
  <text x="2125" y="1777" class="small">上下文内领域关系</text>
  <line x1="2380" y1="1770" x2="2450" y2="1770" class="reference"/>
  <text x="2465" y="1777" class="small">跨限界上下文稳定 ID 引用</text>
  <line x1="2790" y1="1770" x2="2860" y2="1770" class="artifact-link"/>
  <text x="2875" y="1777" class="small">状态形成或产物签发</text>
</svg>
