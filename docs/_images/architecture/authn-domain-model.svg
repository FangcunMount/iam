<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc">
  <title id="title">AuthN 领域模型：从长期认证事实到在线认证状态</title>
  <desc id="desc">按生命周期分区展示 AuthN 领域模型。Identity User 位于 AuthN 边界之外；LoginIdentity 与 Credential 表达长期认证事实；Challenge、AuthCredential、Authenticator、AuthDecision 与 Principal 表达单次认证语义；Session、TokenIssuer、AccessToken、RefreshToken 与 KeySet 表达在线认证状态和签发产物。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4267b2"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7653b5"/>
    </marker>

    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 54px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #64748b; }
      .context-title { font-size: 36px; font-weight: 700; }
      .context-sub { font-size: 20px; fill: #475569; }
      .band-index { font-size: 22px; font-weight: 700; fill: #475569; }
      .band-title { font-size: 29px; font-weight: 700; }
      .band-desc { font-size: 18px; fill: #64748b; }
      .stereotype { font-size: 16px; font-weight: 700; letter-spacing: 0.8px; fill: #64748b; }
      .model { font-size: 25px; font-weight: 700; }
      .field { font-size: 17px; fill: #475569; }
      .small { font-size: 15px; fill: #64748b; }
      .relation { font-size: 17px; font-weight: 600; fill: #475569; }
      .relation-blue { font-size: 17px; font-weight: 600; fill: #4267b2; }
      .note-title { font-size: 24px; font-weight: 700; }
      .note { font-size: 19px; fill: #475569; }
      .callout { font-size: 26px; font-weight: 700; }
      .solid { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .association { fill: none; stroke: #64748b; stroke-width: 3; }
      .reference { fill: none; stroke: #4267b2; stroke-width: 3; stroke-dasharray: 12 9; marker-end: url(#arrowBlue); }
      .artifact-link { fill: none; stroke: #7653b5; stroke-width: 3; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="3200" height="1800" fill="#ffffff"/>

  <text x="110" y="86" class="title">AuthN 领域模型：从长期认证事实到在线认证状态</text>
  <text x="110" y="132" class="subtitle">按领域概念的生命周期分区；连线表达业务语义，不表示数据库外键，也不表示请求调用时序。</text>

  <!-- Identity bounded context: external anchor -->
  <rect x="90" y="205" width="430" height="390" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="305" y="255" text-anchor="middle" class="context-title" style="font-size:30px">Identity</text>
  <text x="305" y="286" text-anchor="middle" class="context-sub">外部限界上下文</text>

  <rect x="135" y="335" width="340" height="165" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="305" y="372" text-anchor="middle" class="stereotype">« EXTERNAL AGGREGATE »</text>
  <text x="305" y="413" text-anchor="middle" class="model">User</text>
  <text x="305" y="447" text-anchor="middle" class="field">系统用户身份锚点</text>
  <text x="305" y="477" text-anchor="middle" class="small">ID · Status</text>

  <!-- AuthN bounded context -->
  <rect x="590" y="185" width="2520" height="1380" rx="28" fill="#f8fafc" stroke="#3f8f5a" stroke-width="3" filter="url(#shadow)"/>
  <rect x="590" y="185" width="2520" height="112" rx="28" fill="#dff3e5"/>
  <path d="M590 270 H3110" stroke="#3f8f5a" stroke-width="2"/>
  <text x="1850" y="232" text-anchor="middle" class="context-title">AuthN｜认证限界上下文</text>
  <text x="1850" y="264" text-anchor="middle" class="context-sub">拥有登录身份、认证语义、认证会话与令牌签发能力；不拥有 User 生命周期</text>

  <!-- Band 1: long-lived authentication facts -->
  <rect x="630" y="325" width="2440" height="300" rx="22" fill="#fff9e8" stroke="#e1b84f" stroke-width="2"/>
  <circle cx="690" cy="378" r="24" fill="#d29b23"/>
  <text x="690" y="386" text-anchor="middle" class="band-index" fill="#ffffff">1</text>
  <text x="735" y="382" class="band-title">长期认证事实</text>
  <text x="735" y="414" class="band-desc">跨多次登录持续存在，回答“用户拥有哪些登录入口与长期认证材料”</text>

  <rect x="805" y="455" width="505" height="130" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.7"/>
  <text x="1058" y="487" text-anchor="middle" class="stereotype">« ENTITY »</text>
  <text x="1058" y="526" text-anchor="middle" class="model">LoginIdentity</text>
  <text x="1058" y="558" text-anchor="middle" class="field">UserID · Provider · Realm · Identifier · Status</text>

  <rect x="1660" y="455" width="505" height="130" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.3"/>
  <text x="1912" y="487" text-anchor="middle" class="stereotype">« ENTITY »</text>
  <text x="1912" y="526" text-anchor="middle" class="model">Credential</text>
  <text x="1912" y="558" text-anchor="middle" class="field">Type · Status · FailedAttempts · LockedUntil</text>

  <path d="M1312 520 H1658" class="association"/>
  <text x="1485" y="500" text-anchor="middle" class="relation">持有长期认证材料</text>
  <text x="1330" y="547" class="small">1</text>
  <text x="1602" y="547" class="small">0..*</text>

  <path d="M475 418 H645 Q685 418 685 480 H803" class="reference"/>
  <rect x="510" y="379" width="270" height="32" rx="8" fill="#ffffff"/>
  <text x="645" y="402" text-anchor="middle" class="relation-blue">通过 UserID 引用身份锚点</text>

  <!-- Band 2: one authentication attempt -->
  <rect x="630" y="655" width="2440" height="445" rx="22" fill="#edf7f0" stroke="#74af84" stroke-width="2"/>
  <circle cx="690" cy="708" r="24" fill="#3f8f5a"/>
  <text x="690" y="716" text-anchor="middle" class="band-index" fill="#ffffff">2</text>
  <text x="735" y="712" class="band-title">单次认证语义</text>
  <text x="735" y="744" class="band-desc">表达一次认证尝试中的证明、验证与判定；这里的关系不是调用时序</text>

  <rect x="680" y="820" width="395" height="145" rx="18" fill="#ffffff" stroke="#659d74" stroke-width="2.2"/>
  <text x="878" y="853" text-anchor="middle" class="stereotype">« SHORT-LIVED ENTITY »</text>
  <text x="878" y="892" text-anchor="middle" class="model">Challenge</text>
  <text x="878" y="924" text-anchor="middle" class="field">Scene · Target · Attempts</text>
  <text x="878" y="951" text-anchor="middle" class="small">ExpiresAt · ConsumedAt</text>

  <rect x="1135" y="820" width="430" height="145" rx="18" fill="#eaf3ff" stroke="#4267b2" stroke-width="2.4"/>
  <text x="1350" y="853" text-anchor="middle" class="stereotype">« PROOF ABSTRACTION »</text>
  <text x="1350" y="892" text-anchor="middle" class="model">AuthCredential</text>
  <text x="1350" y="924" text-anchor="middle" class="field">Password · OTP · ExternalIdentity</text>
  <text x="1350" y="951" text-anchor="middle" class="small">本次请求提交的认证证明</text>

  <rect x="1630" y="820" width="365" height="145" rx="18" fill="#e4f6e9" stroke="#348957" stroke-width="2.8"/>
  <text x="1812" y="853" text-anchor="middle" class="stereotype">« DOMAIN SERVICE »</text>
  <text x="1812" y="892" text-anchor="middle" class="model">Authenticator</text>
  <text x="1812" y="924" text-anchor="middle" class="field">验证认证证明</text>
  <text x="1812" y="951" text-anchor="middle" class="small">选择并执行认证策略</text>

  <rect x="2060" y="820" width="370" height="145" rx="18" fill="#eaf3ff" stroke="#4267b2" stroke-width="2.4"/>
  <text x="2245" y="853" text-anchor="middle" class="stereotype">« RESULT VALUE »</text>
  <text x="2245" y="892" text-anchor="middle" class="model">AuthDecision</text>
  <text x="2245" y="924" text-anchor="middle" class="field">OK · Code · CredentialID</text>
  <text x="2245" y="951" text-anchor="middle" class="small">认证成功或失败的领域判定</text>

  <rect x="2495" y="805" width="470" height="175" rx="18" fill="#dcecff" stroke="#4267b2" stroke-width="2.8"/>
  <text x="2730" y="839" text-anchor="middle" class="stereotype">« RUNTIME VALUE »</text>
  <text x="2730" y="880" text-anchor="middle" class="model">Principal</text>
  <text x="2730" y="914" text-anchor="middle" class="field">UserID · LoginIdentityID · TenantID</text>
  <text x="2730" y="943" text-anchor="middle" class="field">AuthMethod · AMR · Claims</text>
  <text x="2730" y="969" text-anchor="middle" class="small">认证成功后形成的请求级主体</text>

  <path d="M1077 892 H1133" class="solid"/>
  <text x="1105" y="877" text-anchor="middle" class="relation">支撑</text>

  <path d="M1567 892 H1628" class="solid"/>
  <text x="1598" y="877" text-anchor="middle" class="relation">提交给</text>

  <path d="M1997 892 H2058" class="solid"/>
  <text x="2028" y="877" text-anchor="middle" class="relation">作出</text>

  <path d="M2432 892 H2493" class="solid"/>
  <text x="2463" y="877" text-anchor="middle" class="relation">成功时形成</text>

  <path d="M1058 587 V675 Q1058 700 1090 700 H1730 Q1812 700 1812 818" class="solid"/>
  <rect x="1280" y="677" width="310" height="31" rx="8" fill="#edf7f0"/>
  <text x="1435" y="699" text-anchor="middle" class="relation">提供登录身份事实</text>

  <path d="M1912 587 V735 Q1912 760 1885 760 H1840 Q1812 760 1812 818" class="solid"/>
  <rect x="1905" y="685" width="320" height="31" rx="8" fill="#edf7f0"/>
  <text x="2065" y="707" text-anchor="middle" class="relation">按认证方式提供长期验证材料</text>

  <!-- Band 3: online authentication state -->
  <rect x="630" y="1130" width="2440" height="390" rx="22" fill="#f4f0fb" stroke="#9a82c6" stroke-width="2"/>
  <circle cx="690" cy="1183" r="24" fill="#7653b5"/>
  <text x="690" y="1191" text-anchor="middle" class="band-index" fill="#ffffff">3</text>
  <text x="735" y="1187" class="band-title">在线认证状态与签发产物</text>
  <text x="735" y="1219" class="band-desc">认证结果被转化为可撤销、可过期的在线状态，并形成供请求携带的令牌</text>

  <rect x="770" y="1300" width="425" height="145" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.5"/>
  <text x="982" y="1333" text-anchor="middle" class="stereotype">« ENTITY »</text>
  <text x="982" y="1372" text-anchor="middle" class="model">Session</text>
  <text x="982" y="1404" text-anchor="middle" class="field">Status · ExpiresAt · RevokedAt</text>
  <text x="982" y="1431" text-anchor="middle" class="small">可撤销的在线认证状态</text>

  <rect x="1405" y="1300" width="390" height="145" rx="18" fill="#eee8fa" stroke="#7653b5" stroke-width="2.8"/>
  <text x="1600" y="1333" text-anchor="middle" class="stereotype">« APPLICATION SERVICE »</text>
  <text x="1600" y="1372" text-anchor="middle" class="model">TokenIssuer</text>
  <text x="1600" y="1404" text-anchor="middle" class="field">组织令牌签发</text>
  <text x="1600" y="1431" text-anchor="middle" class="small">连接领域结果与签发产物</text>

  <rect x="2000" y="1250" width="425" height="125" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.3"/>
  <text x="2212" y="1282" text-anchor="middle" class="stereotype">« ISSUED ARTIFACT »</text>
  <text x="2212" y="1321" text-anchor="middle" class="model">AccessToken</text>
  <text x="2212" y="1350" text-anchor="middle" class="small">认证结果快照 · JWT</text>

  <rect x="2000" y="1400" width="425" height="100" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.3"/>
  <text x="2212" y="1431" text-anchor="middle" class="stereotype">« ISSUED ARTIFACT »</text>
  <text x="2212" y="1470" text-anchor="middle" class="model">RefreshToken</text>

  <rect x="2580" y="1300" width="390" height="145" rx="18" fill="#eee8fa" stroke="#7653b5" stroke-width="2.6"/>
  <text x="2775" y="1333" text-anchor="middle" class="stereotype">« KEY MODEL »</text>
  <text x="2775" y="1372" text-anchor="middle" class="model">KeySet / JWKS</text>
  <text x="2775" y="1404" text-anchor="middle" class="field">签名 · 验证 · 轮换</text>
  <text x="2775" y="1431" text-anchor="middle" class="small">AccessToken 的密钥模型</text>

  <path d="M2730 982 V1070 H982 V1298" class="artifact-link"/>
  <rect x="1730" y="1048" width="250" height="31" rx="8" fill="#ffffff"/>
  <text x="1855" y="1070" text-anchor="middle" class="relation">建立认证会话</text>

  <path d="M2730 982 V1095 H1600 V1298" class="artifact-link"/>
  <rect x="2085" y="1080" width="255" height="31" rx="8" fill="#ffffff"/>
  <text x="2212" y="1102" text-anchor="middle" class="relation">提供认证结果</text>

  <path d="M1197 1372 H1403" class="artifact-link"/>
  <text x="1300" y="1356" text-anchor="middle" class="relation">提供会话状态</text>

  <path d="M1797 1350 H1905 Q1930 1350 1930 1312 H1998" class="artifact-link"/>
  <text x="1880" y="1329" text-anchor="middle" class="relation">签发</text>

  <path d="M1797 1394 H1930 Q1960 1394 1960 1450 H1998" class="artifact-link"/>
  <text x="1880" y="1422" text-anchor="middle" class="relation">签发并绑定 Session</text>

  <path d="M2578 1355 H2505 Q2470 1355 2470 1312 H2427" class="artifact-link"/>
  <text x="2510" y="1333" text-anchor="middle" class="relation">签名 / 验证</text>

  <!-- Bottom conclusion and legend -->
  <rect x="90" y="1615" width="3020" height="125" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1600" y="1662" text-anchor="middle" class="callout">长期事实 ≠ 单次认证证明 ≠ 认证结果 ≠ 在线认证状态 ≠ 令牌产物</text>
  <text x="1600" y="1703" text-anchor="middle" class="note">LoginIdentity 持有长期登录入口；Authenticator 作出 AuthDecision；Principal 表达认证结果；Session 管理在线状态；Token 是签发产物。</text>

  <line x1="2050" y1="1770" x2="2120" y2="1770" class="association"/>
  <text x="2135" y="1777" class="small">上下文内领域关系</text>
  <line x1="2390" y1="1770" x2="2460" y2="1770" class="reference"/>
  <text x="2475" y="1777" class="small">跨限界上下文稳定 ID 引用</text>
  <line x1="2800" y1="1770" x2="2870" y2="1770" class="artifact-link"/>
  <text x="2885" y="1777" class="small">状态形成或产物签发</text>
</svg>
