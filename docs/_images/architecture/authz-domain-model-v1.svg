<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc">
  <title id="title">AuthZ 领域模型：从授权事实到授权判定</title>
  <desc id="desc">按长期授权事实、策略变更语义和单次授权判定三部分展示 AuthZ 领域模型。Subject user 通过稳定 UserID 对齐 Identity User，AuthZ 不依赖 AuthN Principal。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4267b2"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7653b5"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 54px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #64748b; }
      .context-title { font-size: 36px; font-weight: 700; }
      .context-sub { font-size: 20px; fill: #475569; }
      .band-index { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .band-title { font-size: 29px; font-weight: 700; }
      .band-desc { font-size: 18px; fill: #64748b; }
      .stereotype { font-size: 14px; font-weight: 700; letter-spacing: 0.7px; fill: #64748b; }
      .model { font-size: 24px; font-weight: 700; }
      .field { font-size: 15px; fill: #475569; }
      .field-strong { font-size: 15px; font-weight: 600; fill: #334155; }
      .operation { font-size: 16px; font-weight: 600; fill: #6941a5; }
      .small { font-size: 14px; fill: #64748b; }
      .relation { font-size: 15px; font-weight: 600; fill: #475569; }
      .relation-blue { font-size: 16px; font-weight: 600; fill: #4267b2; }
      .callout { font-size: 25px; font-weight: 700; }
      .note { font-size: 18px; fill: #475569; }
      .solid { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .association { fill: none; stroke: #64748b; stroke-width: 3; }
      .reference { fill: none; stroke: #4267b2; stroke-width: 3; stroke-dasharray: 12 9; marker-end: url(#arrowBlue); }
      .policy-link { fill: none; stroke: #7653b5; stroke-width: 3; marker-end: url(#arrowPurple); }
      .divider { stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="3200" height="1800" fill="#ffffff"/>
  <text x="110" y="86" class="title">AuthZ 领域模型：从授权事实到授权判定</text>
  <text x="110" y="132" class="subtitle">授权事实回答“谁拥有什么能力”，授权请求回答“这次能否执行”；Subject 是授权引用，不是 AuthN Principal。</text>

  <!-- Identity external context -->
  <rect x="90" y="205" width="430" height="410" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="305" y="255" text-anchor="middle" class="context-title" style="font-size:30px">Identity</text>
  <text x="305" y="286" text-anchor="middle" class="context-sub">外部限界上下文</text>
  <rect x="135" y="350" width="340" height="175" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="305" y="382" text-anchor="middle" class="stereotype">« EXTERNAL AGGREGATE »</text>
  <text x="305" y="423" text-anchor="middle" class="model">User</text>
  <line x1="165" y1="444" x2="445" y2="444" class="divider"/>
  <text x="305" y="478" text-anchor="middle" class="field-strong">ID · Status</text>
  <text x="305" y="506" text-anchor="middle" class="small">稳定用户身份锚点</text>

  <!-- AuthZ context -->
  <rect x="590" y="185" width="2520" height="1385" rx="28" fill="#faf8fd" stroke="#7653b5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="590" y="185" width="2520" height="112" rx="28" fill="#e8def8"/>
  <path d="M590 270 H3110" stroke="#7653b5" stroke-width="2"/>
  <text x="1850" y="232" text-anchor="middle" class="context-title">AuthZ｜授权限界上下文</text>
  <text x="1850" y="264" text-anchor="middle" class="context-sub">拥有角色、授权事实、资源目录和授权判定；Type=user 的 Subject.ID 使用 Identity.UserID</text>

  <!-- 1. Authorization facts -->
  <rect x="630" y="325" width="2440" height="480" rx="22" fill="#f4f0fb" stroke="#9a82c6" stroke-width="2"/>
  <circle cx="690" cy="378" r="24" fill="#7653b5"/>
  <text x="690" y="386" text-anchor="middle" class="band-index">1</text>
  <text x="735" y="382" class="band-title">长期授权事实</text>
  <text x="735" y="414" class="band-desc">围绕 Subject、Role、Resource 建立“主体拥有角色、角色拥有权限”的稳定授权关系</text>

  <rect x="665" y="495" width="340" height="205" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.4"/>
  <text x="835" y="525" text-anchor="middle" class="stereotype">« VALUE OBJECT »</text>
  <text x="835" y="563" text-anchor="middle" class="model">Subject.Ref</text>
  <line x1="695" y1="582" x2="975" y2="582" class="divider"/>
  <text x="835" y="610" text-anchor="middle" class="field-strong">Type · ID</text>
  <text x="835" y="638" text-anchor="middle" class="field">user · group · service</text>
  <text x="835" y="670" text-anchor="middle" class="small">被授权的业务主体引用</text>

  <rect x="1055" y="475" width="430" height="245" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.6"/>
  <text x="1270" y="505" text-anchor="middle" class="stereotype">« AGGREGATE ROOT »</text>
  <text x="1270" y="543" text-anchor="middle" class="model">RoleBinding</text>
  <line x1="1085" y1="562" x2="1455" y2="562" class="divider"/>
  <text x="1270" y="590" text-anchor="middle" class="field-strong">ID · SubjectType · SubjectID</text>
  <text x="1270" y="617" text-anchor="middle" class="field">RoleID · TenantID</text>
  <text x="1270" y="644" text-anchor="middle" class="field">GrantedBy</text>
  <text x="1270" y="680" text-anchor="middle" class="small">主体在租户内持有某个角色</text>

  <rect x="1535" y="495" width="360" height="205" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.5"/>
  <text x="1715" y="525" text-anchor="middle" class="stereotype">« AGGREGATE ROOT »</text>
  <text x="1715" y="563" text-anchor="middle" class="model">Role</text>
  <line x1="1565" y1="582" x2="1865" y2="582" class="divider"/>
  <text x="1715" y="610" text-anchor="middle" class="field-strong">ID · Name · TenantID</text>
  <text x="1715" y="638" text-anchor="middle" class="field">DisplayName · Description</text>
  <text x="1715" y="670" text-anchor="middle" class="small">租户内稳定的角色定义</text>

  <rect x="1945" y="475" width="465" height="245" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.5"/>
  <text x="2177" y="505" text-anchor="middle" class="stereotype">« AUTHORIZATION FACT »</text>
  <text x="2177" y="543" text-anchor="middle" class="model">Permission</text>
  <line x1="1975" y1="562" x2="2380" y2="562" class="divider"/>
  <text x="2177" y="590" text-anchor="middle" class="field-strong">RoleName · TenantID</text>
  <text x="2177" y="617" text-anchor="middle" class="field">ResourceKey · Action</text>
  <text x="2177" y="644" text-anchor="middle" class="field">Scope.Kind · Scope.Value</text>
  <text x="2177" y="680" text-anchor="middle" class="small">角色可对资源模式执行某项动作</text>

  <rect x="2460" y="455" width="520" height="285" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.6"/>
  <text x="2720" y="485" text-anchor="middle" class="stereotype">« AGGREGATE ROOT »</text>
  <text x="2720" y="523" text-anchor="middle" class="model">Resource</text>
  <line x1="2490" y1="542" x2="2950" y2="542" class="divider"/>
  <text x="2720" y="570" text-anchor="middle" class="field-strong">ID · Key</text>
  <text x="2720" y="597" text-anchor="middle" class="field">AppName · Domain · Type</text>
  <text x="2720" y="624" text-anchor="middle" class="field">Actions[] · ScopeKinds[]</text>
  <text x="2720" y="655" text-anchor="middle" class="small">Key: app:domain:type:name-or-pattern</text>
  <text x="2720" y="683" text-anchor="middle" class="small">约束可授权动作与对象范围类型</text>

  <path d="M1007 598 H1053" class="association"/>
  <text x="1030" y="580" text-anchor="middle" class="relation">1 : 0..*</text>
  <path d="M1487 598 H1533" class="association"/>
  <text x="1510" y="580" text-anchor="middle" class="relation">0..* : 1</text>
  <path d="M1897 598 H1943" class="association"/>
  <text x="1920" y="580" text-anchor="middle" class="relation">1 : 0..*</text>
  <path d="M2412 598 H2458" class="association"/>
  <text x="2435" y="580" text-anchor="middle" class="relation">匹配 Key</text>

  <path d="M475 438 H610 Q650 438 650 560 H663" class="reference"/>
  <rect x="490" y="396" width="350" height="34" rx="8" fill="#ffffff"/>
  <text x="665" y="420" text-anchor="middle" class="relation-blue">Type=user 时，Subject.ID = User.ID</text>

  <!-- 2. Policy changes -->
  <rect x="630" y="830" width="2440" height="330" rx="22" fill="#fff9e8" stroke="#e1b84f" stroke-width="2"/>
  <circle cx="690" cy="883" r="24" fill="#d29b23"/>
  <text x="690" y="891" text-anchor="middle" class="band-index">2</text>
  <text x="735" y="887" class="band-title">策略变更语义</text>
  <text x="735" y="919" class="band-desc">领域服务校验并生成授权事实变更；应用事务提交事实、递增版本并发布版本事件</text>

  <rect x="710" y="965" width="560" height="165" rx="18" fill="#fffdf5" stroke="#d29b23" stroke-width="2.6"/>
  <text x="990" y="995" text-anchor="middle" class="stereotype">« DOMAIN SERVICE »</text>
  <text x="990" y="1033" text-anchor="middle" class="model">AuthorizationPolicy</text>
  <line x1="740" y1="1052" x2="1240" y2="1052" class="divider"/>
  <text x="990" y="1080" text-anchor="middle" class="operation">BindRole / UnbindRole</text>
  <text x="990" y="1107" text-anchor="middle" class="operation">GrantPermission / RevokePermission</text>

  <rect x="1340" y="965" width="500" height="165" rx="18" fill="#fffdf5" stroke="#d29b23" stroke-width="2.4"/>
  <text x="1590" y="995" text-anchor="middle" class="stereotype">« DOMAIN RESULT »</text>
  <text x="1590" y="1033" text-anchor="middle" class="model">PolicyChange</text>
  <line x1="1370" y1="1052" x2="1810" y2="1052" class="divider"/>
  <text x="1590" y="1080" text-anchor="middle" class="field-strong">Kind · TenantID · Actor · Reason</text>
  <text x="1590" y="1107" text-anchor="middle" class="field">Permission | RoleBinding</text>

  <rect x="1910" y="965" width="430" height="165" rx="18" fill="#fffdf5" stroke="#d29b23" stroke-width="2.4"/>
  <text x="2125" y="995" text-anchor="middle" class="stereotype">« VERSION ENTITY »</text>
  <text x="2125" y="1033" text-anchor="middle" class="model">PolicyVersion</text>
  <line x1="1940" y1="1052" x2="2310" y2="1052" class="divider"/>
  <text x="2125" y="1080" text-anchor="middle" class="field-strong">TenantID · Version</text>
  <text x="2125" y="1107" text-anchor="middle" class="field">ChangedBy · Reason</text>

  <rect x="2410" y="965" width="510" height="165" rx="18" fill="#fffdf5" stroke="#d29b23" stroke-width="2.4"/>
  <text x="2665" y="995" text-anchor="middle" class="stereotype">« DOMAIN EVENT »</text>
  <text x="2665" y="1033" text-anchor="middle" class="model">VersionChangedEvent</text>
  <line x1="2440" y1="1052" x2="2890" y2="1052" class="divider"/>
  <text x="2665" y="1080" text-anchor="middle" class="field-strong">TenantID · Version</text>
  <text x="2665" y="1107" text-anchor="middle" class="small">通知多实例刷新授权策略</text>

  <path d="M1272 1048 H1338" class="policy-link"/>
  <text x="1305" y="1031" text-anchor="middle" class="relation">生成</text>
  <path d="M1842 1048 H1908" class="policy-link"/>
  <text x="1875" y="1031" text-anchor="middle" class="relation">提交后递增</text>
  <path d="M2342 1048 H2408" class="policy-link"/>
  <text x="2375" y="1031" text-anchor="middle" class="relation">发布</text>

  <!-- 3. Decision -->
  <rect x="630" y="1185" width="2440" height="335" rx="22" fill="#edf7f0" stroke="#74af84" stroke-width="2"/>
  <circle cx="690" cy="1238" r="24" fill="#3f8f5a"/>
  <text x="690" y="1246" text-anchor="middle" class="band-index">3</text>
  <text x="735" y="1242" class="band-title">单次授权判定</text>
  <text x="735" y="1274" class="band-desc">把 Subject、Tenant、Resource、Action 和对象范围组合成授权问题，由决策引擎匹配授权事实</text>

  <rect x="730" y="1320" width="650" height="170" rx="18" fill="#ffffff" stroke="#348957" stroke-width="2.4"/>
  <text x="1055" y="1350" text-anchor="middle" class="stereotype">« REQUEST VALUE »</text>
  <text x="1055" y="1388" text-anchor="middle" class="model">AuthorizationRequest</text>
  <line x1="760" y1="1407" x2="1350" y2="1407" class="divider"/>
  <text x="1055" y="1435" text-anchor="middle" class="field-strong">Subject · TenantID · ResourceKey</text>
  <text x="1055" y="1463" text-anchor="middle" class="field">Action · ObjectScope</text>

  <rect x="1500" y="1320" width="470" height="170" rx="18" fill="#e4f6e9" stroke="#348957" stroke-width="2.8"/>
  <text x="1735" y="1350" text-anchor="middle" class="stereotype">« DECISION PORT »</text>
  <text x="1735" y="1388" text-anchor="middle" class="model">DecisionEngine</text>
  <line x1="1530" y1="1407" x2="1940" y2="1407" class="divider"/>
  <text x="1735" y="1440" text-anchor="middle" class="operation">Check(request)</text>
  <text x="1735" y="1468" text-anchor="middle" class="small">匹配 RoleBinding 与 Permission</text>

  <rect x="2090" y="1300" width="770" height="210" rx="18" fill="#ffffff" stroke="#348957" stroke-width="2.6"/>
  <text x="2475" y="1330" text-anchor="middle" class="stereotype">« RESULT VALUE »</text>
  <text x="2475" y="1368" text-anchor="middle" class="model">Decision</text>
  <line x1="2120" y1="1387" x2="2830" y2="1387" class="divider"/>
  <text x="2475" y="1415" text-anchor="middle" class="field-strong">Allowed · Reason · DenyCode</text>
  <text x="2475" y="1443" text-anchor="middle" class="field">MatchedRole · MatchedPermission</text>
  <text x="2475" y="1471" text-anchor="middle" class="field">PolicyVersion · EvaluatedAt</text>
  <text x="2475" y="1497" text-anchor="middle" class="small">显式返回 Allow / Deny 与命中事实</text>

  <path d="M1382 1405 H1498" class="solid"/>
  <text x="1440" y="1387" text-anchor="middle" class="relation">提交</text>
  <path d="M1972 1405 H2088" class="solid"/>
  <text x="2030" y="1387" text-anchor="middle" class="relation">判定</text>

  <path d="M1270 722 V780 H1735 V1318" class="policy-link"/>
  <rect x="1390" y="758" width="310" height="30" rx="8" fill="#ffffff"/>
  <text x="1545" y="780" text-anchor="middle" class="relation">加载角色绑定事实</text>
  <path d="M2177 722 V800 H1800 Q1735 800 1735 1318" class="policy-link"/>
  <rect x="1910" y="778" width="300" height="30" rx="8" fill="#ffffff"/>
  <text x="2060" y="800" text-anchor="middle" class="relation">加载权限事实</text>

  <!-- Bottom conclusion -->
  <rect x="90" y="1615" width="3020" height="125" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1600" y="1662" text-anchor="middle" class="callout">Identity.User 是稳定身份锚点；AuthZ.Subject 是授权引用；AuthN.Principal 不进入 AuthZ 领域模型</text>
  <text x="1600" y="1703" text-anchor="middle" class="note">接入层从可信 user_id 构造 Subject(user, user_id)，再提交 Resource、Action、Tenant 与 ObjectScope 进行授权判定。</text>

  <line x1="2050" y1="1770" x2="2120" y2="1770" class="association"/>
  <text x="2135" y="1777" class="small">上下文内授权关系</text>
  <line x1="2400" y1="1770" x2="2470" y2="1770" class="reference"/>
  <text x="2485" y="1777" class="small">跨限界上下文稳定 ID 引用</text>
  <line x1="2820" y1="1770" x2="2890" y2="1770" class="policy-link"/>
  <text x="2905" y="1777" class="small">策略变更或事实加载</text>
</svg>
