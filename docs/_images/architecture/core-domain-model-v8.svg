<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1600" viewBox="0 0 2600 1600" role="img" aria-labelledby="title desc">
  <title id="title">IAM Identity、AuthN、AuthZ 三核心模块领域模型 V8</title>
  <desc id="desc">展示 Identity 拥有 User、Profile、ProfileLink；AuthN 拥有 LoginIdentity、Credential、Challenge、Principal、Session 和令牌生命周期；AuthZ 拥有 Subject、Role、Assignment、RoleInheritance、PermissionGrant、Resource、ConstraintSet 和 Decision。模块只通过稳定 UserID 与窄能力协作。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#172033" flood-opacity="0.10"/></filter>
    <style>
      .bg{fill:#f8fafc}.title{font:700 46px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.subtitle{font:400 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b}.contextTitle{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.contextSub{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}.section{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.model{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.field{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}.note{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b}.label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.card{fill:#fff;stroke-width:2.3;rx:16}.divider{stroke:#dbe3ef;stroke-width:2}.edge{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#2563eb;stroke-width:3;stroke-dasharray:12 10;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="2600" height="1600"/>
  <text x="85" y="75" class="title">IAM 三核心模块领域模型 V8｜事实所有权与窄能力协作</text>
  <text x="85" y="114" class="subtitle">Identity 定义稳定身份；AuthN 证明当前是谁；AuthZ 基于当前策略判断这个主体能做什么。</text>

  <rect x="55" y="160" width="940" height="1160" rx="28" fill="#edf8f0" stroke="#36905d" stroke-width="3" filter="url(#shadow)"/>
  <rect x="55" y="160" width="940" height="105" rx="28" fill="#d9f1df"/>
  <text x="525" y="207" text-anchor="middle" class="contextTitle">AuthN｜认证上下文</text>
  <text x="525" y="239" text-anchor="middle" class="contextSub">拥有登录身份、认证证明、认证结果、会话与令牌状态</text>

  <text x="92" y="312" class="section">01｜长期认证事实</text>
  <rect x="92" y="340" width="410" height="190" class="card" stroke="#36905d"/>
  <text x="297" y="382" text-anchor="middle" class="model">LoginIdentity</text>
  <line x1="122" y1="400" x2="472" y2="400" class="divider"/>
  <text x="297" y="430" text-anchor="middle" class="field">ID · UserID · ProviderKey</text>
  <text x="297" y="458" text-anchor="middle" class="field">Provider · Realm · Identifier</text>
  <text x="297" y="486" text-anchor="middle" class="field">GlobalIdentifier · Status</text>
  <text x="297" y="514" text-anchor="middle" class="note">登录入口；不拥有 User 生命周期</text>

  <rect x="552" y="340" width="405" height="190" class="card" stroke="#36905d"/>
  <text x="754" y="382" text-anchor="middle" class="model">Credential</text>
  <line x1="582" y1="400" x2="927" y2="400" class="divider"/>
  <text x="754" y="430" text-anchor="middle" class="field">LoginIdentityID · Type</text>
  <text x="754" y="458" text-anchor="middle" class="field">Material · Algo · Status</text>
  <text x="754" y="486" text-anchor="middle" class="field">FailedAttempts · LockedUntil</text>
  <text x="754" y="514" text-anchor="middle" class="note">长期认证材料</text>
  <path d="M552 435 L502 435" class="edge"/>

  <text x="92" y="582" class="section">02｜单次认证语义</text>
  <rect x="92" y="610" width="250" height="180" class="card" stroke="#36905d"/>
  <text x="217" y="650" text-anchor="middle" class="model">Challenge</text>
  <line x1="117" y1="668" x2="317" y2="668" class="divider"/>
  <text x="217" y="700" text-anchor="middle" class="field">Type · Scene</text>
  <text x="217" y="728" text-anchor="middle" class="field">ExpiresAt · ConsumedAt</text>
  <text x="217" y="765" text-anchor="middle" class="note">短期、一次性</text>

  <rect x="380" y="610" width="250" height="180" class="card" stroke="#36905d"/>
  <text x="505" y="650" text-anchor="middle" class="model">AuthCredential</text>
  <line x1="405" y1="668" x2="605" y2="668" class="divider"/>
  <text x="505" y="700" text-anchor="middle" class="field">CredentialKind()</text>
  <text x="505" y="728" text-anchor="middle" class="field">password / otp / oauth</text>
  <text x="505" y="765" text-anchor="middle" class="note">本次请求的 proof value</text>

  <rect x="668" y="610" width="289" height="180" class="card" stroke="#36905d"/>
  <text x="812" y="650" text-anchor="middle" class="model">Authenticator</text>
  <line x1="693" y1="668" x2="932" y2="668" class="divider"/>
  <text x="812" y="700" text-anchor="middle" class="field">strategyFor(kind)</text>
  <text x="812" y="728" text-anchor="middle" class="field">Authenticate(proof)</text>
  <text x="812" y="765" text-anchor="middle" class="note">选择 AuthStrategy</text>
  <path d="M342 700 L380 700" class="edge"/>
  <path d="M630 700 L668 700" class="edge"/>

  <rect x="195" y="830" width="325" height="180" class="card" stroke="#36905d"/>
  <text x="357" y="870" text-anchor="middle" class="model">AuthDecision</text>
  <line x1="225" y1="888" x2="490" y2="888" class="divider"/>
  <text x="357" y="920" text-anchor="middle" class="field">OK · Code · ShouldRotate</text>
  <text x="357" y="948" text-anchor="middle" class="field">Principal (0..1)</text>
  <text x="357" y="984" text-anchor="middle" class="note">认证领域判定</text>

  <rect x="570" y="830" width="387" height="180" class="card" stroke="#36905d"/>
  <text x="763" y="870" text-anchor="middle" class="model">Principal</text>
  <line x1="600" y1="888" x2="927" y2="888" class="divider"/>
  <text x="763" y="920" text-anchor="middle" class="field">UserID · LoginIdentityID · TenantID</text>
  <text x="763" y="948" text-anchor="middle" class="field">SessionID · AuthMethod · AMR</text>
  <text x="763" y="984" text-anchor="middle" class="note">请求级认证结果，不是 User</text>
  <path d="M812 790 C812 815 460 815 460 830" class="edge"/>
  <path d="M520 920 L570 920" class="edge"/>

  <text x="92" y="1060" class="section">03｜在线认证状态</text>
  <rect x="92" y="1090" width="270" height="170" class="card" stroke="#36905d"/>
  <text x="227" y="1132" text-anchor="middle" class="model">AdmissionPolicy</text>
  <line x1="117" y1="1150" x2="337" y2="1150" class="divider"/>
  <text x="227" y="1182" text-anchor="middle" class="field">User + LoginIdentity 状态</text>
  <text x="227" y="1210" text-anchor="middle" class="note">决定是否允许建会话</text>
  <text x="227" y="1238" text-anchor="middle" class="note">不做资源授权</text>

  <rect x="397" y="1090" width="270" height="170" class="card" stroke="#36905d"/>
  <text x="532" y="1132" text-anchor="middle" class="model">Session + LifetimePolicy</text>
  <line x1="422" y1="1150" x2="642" y2="1150" class="divider"/>
  <text x="532" y="1182" text-anchor="middle" class="field">Status · ExpiresAt</text>
  <text x="532" y="1210" text-anchor="middle" class="field">RevokedAt · AMR · TTL boundary</text>
  <text x="532" y="1238" text-anchor="middle" class="note">Redis 在线事实</text>

  <rect x="702" y="1090" width="255" height="170" class="card" stroke="#36905d"/>
  <text x="829" y="1132" text-anchor="middle" class="model">Token Results</text>
  <line x1="727" y1="1150" x2="932" y2="1150" class="divider"/>
  <text x="829" y="1182" text-anchor="middle" class="field">Access + Refresh</text>
  <text x="829" y="1210" text-anchor="middle" class="note">应用结果；绑定 Session</text>
  <text x="829" y="1238" text-anchor="middle" class="note">Codec / JWKS 在边界层</text>
  <path d="M362 1175 L397 1175" class="edge"/>
  <path d="M667 1175 L702 1175" class="edge"/>

  <rect x="1040" y="160" width="520" height="1160" rx="28" fill="#fff8df" stroke="#d59a16" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1040" y="160" width="520" height="105" rx="28" fill="#ffedb1"/>
  <text x="1300" y="207" text-anchor="middle" class="contextTitle">Identity｜身份上下文</text>
  <text x="1300" y="239" text-anchor="middle" class="contextSub">拥有稳定 User、自然人 Profile 与身份关系</text>

  <rect x="1090" y="350" width="420" height="230" class="card" stroke="#d59a16"/>
  <text x="1300" y="395" text-anchor="middle" class="model">User</text>
  <line x1="1120" y1="415" x2="1480" y2="415" class="divider"/>
  <text x="1300" y="450" text-anchor="middle" class="field">ID · Name · Nickname</text>
  <text x="1300" y="480" text-anchor="middle" class="field">Phone · Email · Status</text>
  <text x="1300" y="520" text-anchor="middle" class="note">IAM 内部稳定身份锚点</text>
  <text x="1300" y="550" text-anchor="middle" class="note">不等于 Principal 或 Subject</text>

  <rect x="1090" y="680" width="420" height="210" class="card" stroke="#d59a16"/>
  <text x="1300" y="725" text-anchor="middle" class="model">ProfileLink</text>
  <line x1="1120" y1="745" x2="1480" y2="745" class="divider"/>
  <text x="1300" y="780" text-anchor="middle" class="field">User · Profile · Type · Rel</text>
  <text x="1300" y="810" text-anchor="middle" class="field">EstablishedAt · RevokedAt</text>
  <text x="1300" y="850" text-anchor="middle" class="note">身份关系，不是授权关系</text>

  <rect x="1090" y="990" width="420" height="210" class="card" stroke="#d59a16"/>
  <text x="1300" y="1035" text-anchor="middle" class="model">Profile</text>
  <line x1="1120" y1="1055" x2="1480" y2="1055" class="divider"/>
  <text x="1300" y="1090" text-anchor="middle" class="field">ID · Name · IDCard</text>
  <text x="1300" y="1120" text-anchor="middle" class="field">Gender · Birthday</text>
  <text x="1300" y="1160" text-anchor="middle" class="note">自然人档案</text>
  <path d="M1300 580 L1300 680" class="edge"/>
  <path d="M1300 890 L1300 990" class="edge"/>

  <rect x="1605" y="160" width="940" height="1160" rx="28" fill="#f3effd" stroke="#7652c8" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1605" y="160" width="940" height="105" rx="28" fill="#e6dcfa"/>
  <text x="2075" y="207" text-anchor="middle" class="contextTitle">AuthZ｜授权上下文</text>
  <text x="2075" y="239" text-anchor="middle" class="contextSub">拥有角色关系、资源能力、策略投影与授权判定</text>

  <text x="1642" y="312" class="section">01｜主体与角色关系</text>
  <rect x="1642" y="340" width="260" height="175" class="card" stroke="#7652c8"/>
  <text x="1772" y="382" text-anchor="middle" class="model">Subject.Ref</text>
  <line x1="1667" y1="400" x2="1877" y2="400" class="divider"/>
  <text x="1772" y="432" text-anchor="middle" class="field">Type · ID</text>
  <text x="1772" y="460" text-anchor="middle" class="field">user / group / service</text>
  <text x="1772" y="492" text-anchor="middle" class="note">授权引用</text>

  <rect x="1930" y="340" width="275" height="175" class="card" stroke="#7652c8"/>
  <text x="2067" y="382" text-anchor="middle" class="model">Assignment</text>
  <line x1="1955" y1="400" x2="2180" y2="400" class="divider"/>
  <text x="2067" y="432" text-anchor="middle" class="field">Subject → Direct Role</text>
  <text x="2067" y="460" text-anchor="middle" class="field">Tenant · GrantedBy</text>
  <text x="2067" y="492" text-anchor="middle" class="note">code: rolebinding.Binding</text>

  <rect x="2233" y="340" width="275" height="175" class="card" stroke="#7652c8"/>
  <text x="2370" y="382" text-anchor="middle" class="model">Role</text>
  <line x1="2258" y1="400" x2="2483" y2="400" class="divider"/>
  <text x="2370" y="432" text-anchor="middle" class="field">Tenant · Name</text>
  <text x="2370" y="460" text-anchor="middle" class="note">能力聚合容器</text>
  <text x="2370" y="492" text-anchor="middle" class="note">角色名不直接 allow</text>
  <path d="M1902 427 L1930 427" class="edge"/>
  <path d="M2205 427 L2233 427" class="edge"/>

  <rect x="1930" y="565" width="578" height="150" class="card" stroke="#7652c8"/>
  <text x="2219" y="607" text-anchor="middle" class="model">RoleInheritance</text>
  <line x1="1960" y1="625" x2="2478" y2="625" class="divider"/>
  <text x="2219" y="657" text-anchor="middle" class="field">Child Role → Parent Role · 同 Tenant · DAG</text>
  <text x="2219" y="688" text-anchor="middle" class="note">只派生 effective roles，不复制 Grant</text>
  <path d="M2370 515 L2370 565" class="edge"/>

  <text x="1642" y="770" class="section">02｜资源能力与条件</text>
  <rect x="1642" y="800" width="270" height="220" class="card" stroke="#7652c8"/>
  <text x="1777" y="842" text-anchor="middle" class="model">Resource</text>
  <line x1="1667" y1="860" x2="1887" y2="860" class="divider"/>
  <text x="1777" y="892" text-anchor="middle" class="field">四段 Key · Actions[]</text>
  <text x="1777" y="920" text-anchor="middle" class="field">AttributeSchema[]</text>
  <text x="1777" y="956" text-anchor="middle" class="note">能力合同</text>
  <text x="1777" y="984" text-anchor="middle" class="note">不是业务对象实例</text>

  <rect x="1942" y="800" width="335" height="220" class="card" stroke="#7652c8"/>
  <text x="2109" y="842" text-anchor="middle" class="model">PermissionGrant</text>
  <line x1="1967" y1="860" x2="2252" y2="860" class="divider"/>
  <text x="2109" y="892" text-anchor="middle" class="field">Role · ResourcePattern</text>
  <text x="2109" y="920" text-anchor="middle" class="field">ActionPattern · GrantKey</text>
  <text x="2109" y="956" text-anchor="middle" class="note">唯一 allow 规则</text>
  <text x="2109" y="984" text-anchor="middle" class="note">可无条件或带条件</text>

  <rect x="2307" y="800" width="201" height="220" class="card" stroke="#7652c8"/>
  <text x="2407" y="842" text-anchor="middle" class="model">ConstraintSet</text>
  <line x1="2332" y1="860" x2="2483" y2="860" class="divider"/>
  <text x="2407" y="892" text-anchor="middle" class="field">all_of · eq</text>
  <text x="2407" y="920" text-anchor="middle" class="field">object.*</text>
  <text x="2407" y="956" text-anchor="middle" class="note">typed values</text>
  <text x="2407" y="984" text-anchor="middle" class="note">最多 8 条</text>
  <path d="M1942 910 L1912 910" class="edge"/>
  <path d="M2277 910 L2307 910" class="edge"/>

  <text x="1642" y="1070" class="section">03｜单次判定</text>
  <rect x="1642" y="1100" width="866" height="160" class="card" stroke="#7652c8"/>
  <text x="2075" y="1142" text-anchor="middle" class="model">Request → Immutable Snapshot → Decision</text>
  <line x1="1672" y1="1160" x2="2478" y2="1160" class="divider"/>
  <text x="2075" y="1192" text-anchor="middle" class="field">Subject · Tenant · Resource · Action · ObjectContext</text>
  <text x="2075" y="1220" text-anchor="middle" class="field">Allowed · Reason · MatchedGrantID · MatchedRole · PolicyVersion</text>
  <text x="2075" y="1248" text-anchor="middle" class="note">Casbin RoleManager 只算角色闭包；Grant 与 Constraint 由原生运行时判定</text>

  <path d="M995 465 C1030 465 1030 465 1090 465" class="dash"/>
  <text x="1040" y="445" text-anchor="middle" class="label">UserStatusReader</text>
  <path d="M1560 465 C1600 465 1600 427 1642 427" class="dash"/>
  <text x="1600" y="405" text-anchor="middle" class="label">UserResolver / UserID</text>
  <rect x="55" y="1360" width="2490" height="170" rx="24" fill="#eef2f7" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1300" y="1410" text-anchor="middle" class="section">User ≠ Principal ≠ Subject</text>
  <text x="1300" y="1448" text-anchor="middle" class="contextSub">User 是 Identity 的稳定身份；Principal 是 AuthN 的认证结果；Subject 是 AuthZ 的授权引用。</text>
  <text x="1300" y="1482" text-anchor="middle" class="contextSub">认证成功不等于允许建立在线会话；在线 Token 有效也不等于对目标资源获得授权。</text>
  <text x="1300" y="1516" text-anchor="middle" class="note">跨上下文只传稳定 ID、可信请求上下文和窄能力；不传递聚合实例，也不复制对方的事实。</text>
</svg>
