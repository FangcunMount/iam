<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1780" viewBox="0 0 3000 1780" role="img" aria-labelledby="title desc">
  <title id="title">IAM 核心领域模型：Identity、AuthN 与 AuthZ</title>
  <desc id="desc">以三个限界上下文展示 Identity、AuthN 和 AuthZ 各自拥有的领域模型。AuthN 的 LoginIdentity 与 Principal 通过 UserID 引用 Identity User；AuthZ 的 User Subject 通过 UserID 引用 Identity User。AuthN 与 AuthZ 不直接共享领域模型。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f855a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4267b2"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 52px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #64748b; }
      .context-title { font-size: 34px; font-weight: 700; }
      .context-sub { font-size: 20px; fill: #475569; }
      .type { font-size: 17px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .model { font-size: 24px; font-weight: 700; }
      .field { font-size: 17px; fill: #475569; }
      .relation { font-size: 17px; font-weight: 600; fill: #475569; }
      .note { font-size: 18px; fill: #475569; }
      .callout { font-size: 22px; font-weight: 700; }
      .small { font-size: 16px; fill: #64748b; }
      .solid { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .solid-bi { fill: none; stroke: #334155; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ref { fill: none; stroke: #4267b2; stroke-width: 3; stroke-dasharray: 11 9; marker-end: url(#arrowBlue); }
      .association { fill: none; stroke: #64748b; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="3000" height="1780" fill="#ffffff"/>
  <text x="120" y="88" class="title">IAM 核心领域模型：Identity、AuthN 与 AuthZ</text>
  <text x="120" y="135" class="subtitle">先看每个模块“拥有哪类事实”，再看它们如何通过稳定 UserID 对齐；这是一张领域模型图，不表示请求调用顺序。</text>

  <!-- AuthN bounded context -->
  <rect x="100" y="205" width="870" height="1260" rx="26" fill="#f0f8f2" stroke="#4a9b61" stroke-width="3" filter="url(#shadow)"/>
  <rect x="100" y="205" width="870" height="116" rx="26" fill="#dff3e5"/>
  <path d="M100 292 H970" stroke="#4a9b61" stroke-width="2"/>
  <text x="535" y="252" text-anchor="middle" class="context-title">AuthN｜认证上下文</text>
  <text x="535" y="284" text-anchor="middle" class="context-sub">拥有账号、凭证与认证会话事实</text>

  <text x="155" y="365" class="type">账号聚合</text>
  <rect x="150" y="390" width="360" height="132" rx="16" fill="#ffffff" stroke="#4a9b61" stroke-width="2.4"/>
  <text x="330" y="432" text-anchor="middle" class="model">LoginIdentity</text>
  <text x="330" y="466" text-anchor="middle" class="field">UserID · Provider · Realm</text>
  <text x="330" y="494" text-anchor="middle" class="field">Identifier · Status</text>

  <rect x="575" y="390" width="330" height="132" rx="16" fill="#ffffff" stroke="#7bb98d" stroke-width="2"/>
  <text x="740" y="432" text-anchor="middle" class="model">Credential</text>
  <text x="740" y="466" text-anchor="middle" class="field">LoginIdentityID · Type</text>
  <text x="740" y="494" text-anchor="middle" class="field">Material · Status · Lockout</text>
  <path d="M575 456 H512" class="solid"/>
  <text x="544" y="442" text-anchor="middle" class="relation">属于</text>

  <text x="155" y="590" class="type">认证过程与结果</text>
  <rect x="150" y="615" width="300" height="122" rx="16" fill="#ffffff" stroke="#7bb98d" stroke-width="2"/>
  <text x="300" y="657" text-anchor="middle" class="model">Challenge</text>
  <text x="300" y="691" text-anchor="middle" class="field">一次性挑战 / 短期证明</text>
  <text x="300" y="718" text-anchor="middle" class="small">不等于长期 Credential</text>

  <rect x="520" y="615" width="385" height="158" rx="16" fill="#ffffff" stroke="#2f855a" stroke-width="2.8"/>
  <text x="712" y="657" text-anchor="middle" class="model">Principal</text>
  <text x="712" y="691" text-anchor="middle" class="field">UserID · LoginIdentityID</text>
  <text x="712" y="719" text-anchor="middle" class="field">TenantID · SessionID · AMR</text>
  <text x="712" y="747" text-anchor="middle" class="small">认证成功后的请求级主体表达</text>
  <path d="M450 676 H518" class="solid"/>
  <text x="484" y="660" text-anchor="middle" class="relation">参与认证</text>
  <path d="M330 524 V562 H712 V613" class="solid"/>
  <text x="520" y="554" text-anchor="middle" class="relation">认证并定位 User</text>

  <text x="155" y="842" class="type">会话与令牌</text>
  <rect x="150" y="870" width="355" height="145" rx="16" fill="#ffffff" stroke="#4a9b61" stroke-width="2.4"/>
  <text x="328" y="913" text-anchor="middle" class="model">Session</text>
  <text x="328" y="947" text-anchor="middle" class="field">UserID · LoginIdentityID</text>
  <text x="328" y="975" text-anchor="middle" class="field">TenantID · AMR · ExpiresAt</text>

  <rect x="575" y="870" width="330" height="145" rx="16" fill="#ffffff" stroke="#7bb98d" stroke-width="2"/>
  <text x="740" y="913" text-anchor="middle" class="model">Token / JWKS</text>
  <text x="740" y="947" text-anchor="middle" class="field">AccessToken · RefreshToken</text>
  <text x="740" y="975" text-anchor="middle" class="field">KeySet · Sign · Verify</text>
  <path d="M712 775 V816 H328 V868" class="solid"/>
  <text x="500" y="809" text-anchor="middle" class="relation">建立 Session</text>
  <path d="M507 942 H573" class="solid"/>
  <text x="540" y="926" text-anchor="middle" class="relation">签发</text>

  <rect x="150" y="1090" width="755" height="285" rx="18" fill="#e7f5eb" stroke="#9acbab" stroke-width="1.8"/>
  <text x="185" y="1133" class="model">AuthN 的边界</text>
  <text x="185" y="1180" class="note">• LoginIdentity 是登录入口，Credential 是证明材料。</text>
  <text x="185" y="1222" class="note">• Principal 是认证结果；Session / Token 承载认证状态。</text>
  <text x="185" y="1264" class="note">• AuthN 通过 UserID 定位用户，但不拥有 User 生命周期。</text>
  <text x="185" y="1306" class="note">• AuthN 不定义 Role、Permission、Resource 或授权决策。</text>

  <!-- Identity bounded context -->
  <rect x="1065" y="205" width="870" height="1260" rx="26" fill="#fff9e8" stroke="#d29b23" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1065" y="205" width="870" height="116" rx="26" fill="#ffefbd"/>
  <path d="M1065 292 H1935" stroke="#d29b23" stroke-width="2"/>
  <text x="1500" y="252" text-anchor="middle" class="context-title">Identity｜身份上下文</text>
  <text x="1500" y="284" text-anchor="middle" class="context-sub">拥有稳定用户身份与自然人档案事实</text>

  <text x="1120" y="365" class="type">稳定身份锚点</text>
  <rect x="1120" y="390" width="760" height="168" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.8"/>
  <text x="1500" y="437" text-anchor="middle" class="model">User</text>
  <text x="1500" y="474" text-anchor="middle" class="field">ID · Username · DisplayName · Status</text>
  <text x="1500" y="506" text-anchor="middle" class="field">系统使用者身份，也是认证与授权共同引用的稳定锚点</text>
  <text x="1500" y="536" text-anchor="middle" class="small">User 不是某次认证结果，也不是某个授权 Subject 对象</text>

  <text x="1120" y="650" class="type">自然人档案与身份关系</text>
  <rect x="1120" y="680" width="315" height="165" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.3"/>
  <text x="1278" y="727" text-anchor="middle" class="model">User</text>
  <text x="1278" y="764" text-anchor="middle" class="field">系统使用者</text>
  <text x="1278" y="795" text-anchor="middle" class="field">可操作业务系统</text>

  <rect x="1465" y="680" width="305" height="165" rx="18" fill="#fff5d6" stroke="#d29b23" stroke-width="2.5"/>
  <text x="1618" y="727" text-anchor="middle" class="model">ProfileLink</text>
  <text x="1618" y="764" text-anchor="middle" class="field">UserID · ProfileID</text>
  <text x="1618" y="795" text-anchor="middle" class="field">Relation · Status</text>

  <rect x="1120" y="915" width="760" height="175" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.3"/>
  <text x="1500" y="963" text-anchor="middle" class="model">Profile</text>
  <text x="1500" y="1000" text-anchor="middle" class="field">ID · Name · Gender · Birthday · Certificate</text>
  <text x="1500" y="1032" text-anchor="middle" class="field">自然人档案；由 Patient、Student、Testee 等业务对象引用</text>
  <text x="1500" y="1064" text-anchor="middle" class="small">ProfileLink 只表达 User 与 Profile 的身份关系，不表达业务关系或权限继承</text>

  <path d="M1437 762 H1463" class="solid"/>
  <text x="1450" y="744" text-anchor="middle" class="relation">建立</text>
  <path d="M1618 847 V913" class="solid"/>
  <text x="1685" y="887" class="relation">指向</text>

  <rect x="1120" y="1160" width="760" height="215" rx="18" fill="#fff3c8" stroke="#e0b553" stroke-width="1.8"/>
  <text x="1155" y="1204" class="model">Identity 的边界</text>
  <text x="1155" y="1250" class="note">• User 是跨模块共享的稳定业务标识，而非共享实体实例。</text>
  <text x="1155" y="1292" class="note">• Profile 是自然人档案；ProfileLink 记录二者的身份关系。</text>
  <text x="1155" y="1334" class="note">• Identity 不校验凭证，也不拥有角色与权限策略。</text>

  <!-- AuthZ bounded context -->
  <rect x="2030" y="205" width="870" height="1260" rx="26" fill="#f4f0fb" stroke="#7653b5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="2030" y="205" width="870" height="116" rx="26" fill="#e8def8"/>
  <path d="M2030 292 H2900" stroke="#7653b5" stroke-width="2"/>
  <text x="2465" y="252" text-anchor="middle" class="context-title">AuthZ｜授权上下文</text>
  <text x="2465" y="284" text-anchor="middle" class="context-sub">拥有授权事实、匹配语义与决策结果</text>

  <text x="2085" y="365" class="type">授权主体与角色绑定</text>
  <rect x="2085" y="390" width="330" height="145" rx="16" fill="#ffffff" stroke="#7653b5" stroke-width="2.4"/>
  <text x="2250" y="431" text-anchor="middle" class="model">Subject</text>
  <text x="2250" y="467" text-anchor="middle" class="field">Type: user / group / service</text>
  <text x="2250" y="496" text-anchor="middle" class="field">ID · TenantID</text>

  <rect x="2490" y="390" width="350" height="145" rx="16" fill="#ffffff" stroke="#9a82c6" stroke-width="2"/>
  <text x="2665" y="431" text-anchor="middle" class="model">RoleBinding</text>
  <text x="2665" y="467" text-anchor="middle" class="field">SubjectRef · RoleID</text>
  <text x="2665" y="496" text-anchor="middle" class="field">TenantID · GrantedBy</text>
  <path d="M2417 462 H2488" class="solid"/>
  <text x="2452" y="446" text-anchor="middle" class="relation">绑定</text>

  <text x="2085" y="610" class="type">角色、权限与受保护能力</text>
  <rect x="2085" y="635" width="280" height="122" rx="16" fill="#ffffff" stroke="#9a82c6" stroke-width="2"/>
  <text x="2225" y="680" text-anchor="middle" class="model">Role</text>
  <text x="2225" y="715" text-anchor="middle" class="field">Name · TenantID</text>
  <rect x="2415" y="635" width="425" height="158" rx="16" fill="#ffffff" stroke="#7653b5" stroke-width="2.4"/>
  <text x="2628" y="678" text-anchor="middle" class="model">Permission</text>
  <text x="2628" y="713" text-anchor="middle" class="field">RoleID · ResourceKey · Action</text>
  <text x="2628" y="742" text-anchor="middle" class="field">Scope · TenantID</text>
  <text x="2628" y="770" text-anchor="middle" class="small">Role 对资源能力的授权事实</text>
  <path d="M2665 537 V580 H2225 V633" class="solid"/>
  <text x="2445" y="574" text-anchor="middle" class="relation">获得 Role</text>
  <path d="M2367 696 H2413" class="solid"/>
  <text x="2390" y="678" text-anchor="middle" class="relation">拥有</text>

  <rect x="2085" y="845" width="755" height="126" rx="16" fill="#ffffff" stroke="#9a82c6" stroke-width="2"/>
  <text x="2463" y="888" text-anchor="middle" class="model">Resource · Action · ObjectScope</text>
  <text x="2463" y="924" text-anchor="middle" class="field">资源是什么 · 执行什么动作 · 访问哪个对象范围</text>
  <text x="2463" y="952" text-anchor="middle" class="small">与 Subject、Tenant 一起构成授权判断输入</text>
  <path d="M2628 795 V843" class="solid"/>

  <text x="2085" y="1040" class="type">授权判断</text>
  <rect x="2085" y="1065" width="440" height="150" rx="16" fill="#ffffff" stroke="#7653b5" stroke-width="2.4"/>
  <text x="2305" y="1107" text-anchor="middle" class="model">Authorization Request</text>
  <text x="2305" y="1142" text-anchor="middle" class="field">Subject × Tenant × Resource</text>
  <text x="2305" y="1172" text-anchor="middle" class="field">Action × ObjectScope</text>
  <rect x="2585" y="1065" width="255" height="150" rx="16" fill="#eee6fb" stroke="#7653b5" stroke-width="2.5"/>
  <text x="2712" y="1112" text-anchor="middle" class="model">Decision</text>
  <text x="2712" y="1150" text-anchor="middle" class="field">Allow / Deny</text>
  <text x="2712" y="1180" text-anchor="middle" class="field">Reason · PolicyVersion</text>
  <path d="M2527 1140 H2583" class="solid"/>
  <text x="2555" y="1124" text-anchor="middle" class="relation">判定</text>
  <path d="M2250 537 V1015 H2305 V1063" class="association"/>
  <path d="M2463 973 V1015 H2305 V1063" class="association"/>

  <rect x="2085" y="1270" width="755" height="105" rx="18" fill="#eae2f7" stroke="#b9a7d9" stroke-width="1.8"/>
  <text x="2120" y="1311" class="model">AuthZ 的边界</text>
  <text x="2120" y="1347" class="note">Subject 是授权引用；AuthZ 不拥有 User，也不校验登录凭证。</text>

  <!-- Cross-context stable ID references -->
  <path d="M510 415 V350 H1015 Q1045 350 1045 430 H1118" class="ref"/>
  <path d="M905 694 H1015 Q1045 694 1045 520 H1118" class="ref"/>
  <path d="M2083 462 H1990 Q1960 462 1960 472 H1882" class="ref"/>

  <!-- Bottom conclusion -->
  <rect x="100" y="1515" width="2800" height="170" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1500" y="1565" text-anchor="middle" class="callout">User ≠ Principal ≠ Subject</text>
  <text x="1500" y="1610" text-anchor="middle" class="note">User 是 Identity 拥有的稳定业务身份；Principal 是 AuthN 产生的认证结果；Subject 是 AuthZ 使用的授权引用。</text>
  <text x="1500" y="1650" text-anchor="middle" class="note">AuthN 与 AuthZ 不共享领域对象，也无需建立直接模型依赖；二者分别通过 UserID 与 Identity 的稳定身份语义对齐。</text>

  <!-- Legend -->
  <line x1="2190" y1="1727" x2="2260" y2="1727" class="association"/>
  <text x="2275" y="1734" class="small">模块内领域关系</text>
  <line x1="2495" y1="1727" x2="2565" y2="1727" class="ref"/>
  <text x="2580" y="1734" class="small">跨上下文稳定 ID 引用</text>
</svg>
