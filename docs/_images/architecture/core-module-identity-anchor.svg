<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1700" viewBox="0 0 3000 1700" role="img" aria-labelledby="title desc">
  <title id="title">IAM 三个核心模块的身份锚点与请求协作</title>
  <desc id="desc">上半部分展示 Identity、AuthN、AuthZ 各自拥有的领域事实以及共同引用 Identity User 的关系；下半部分展示访问令牌经 AuthN 校验后形成可信请求数据，再映射为 AuthZ Subject 并完成授权决策。AuthN 和 AuthZ 不存在领域模型直连。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f855a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7653b5"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 50px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #64748b; }
      .section { font-size: 28px; font-weight: 700; }
      .section-sub { font-size: 19px; fill: #64748b; }
      .module-title { font-size: 33px; font-weight: 700; }
      .module-question { font-size: 21px; font-weight: 600; }
      .object { font-size: 20px; }
      .object-strong { font-size: 23px; font-weight: 700; }
      .label { font-size: 18px; fill: #475569; }
      .small { font-size: 16px; fill: #64748b; }
      .flow-title { font-size: 22px; font-weight: 700; }
      .flow-sub { font-size: 17px; fill: #475569; }
      .callout { font-size: 20px; font-weight: 600; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .solid { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .semantic { stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 9; fill: none; marker-end: url(#arrow); }
      .guide { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 7 8; fill: none; }
    </style>
  </defs>

  <rect width="3000" height="1700" fill="#ffffff"/>
  <text x="110" y="82" class="title">IAM 三个核心模块的身份锚点与请求协作</text>
  <text x="110" y="126" class="subtitle">三个模块拥有不同领域事实，通过稳定 UserID 语义对齐；请求链路可以前后衔接，领域模型不直接耦合。</text>

  <!-- section 1 -->
  <rect x="90" y="175" width="2820" height="710" rx="26" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="120" y="200" width="520" height="64" rx="14" fill="#eef2f7"/>
  <text x="145" y="242" class="section">01｜领域事实如何落位</text>
  <text x="670" y="241" class="section-sub">Identity 是稳定身份事实的归属；AuthN 与 AuthZ 分别保留自己的运行时表达。</text>

  <!-- AuthN module -->
  <rect x="150" y="305" width="720" height="455" rx="24" fill="#edf9f0" stroke="#4a9b61" stroke-width="3" filter="url(#shadow)"/>
  <rect x="150" y="305" width="720" height="92" rx="24" fill="#dff3e5"/>
  <path d="M150 373 H870" stroke="#4a9b61" stroke-width="2"/>
  <text x="510" y="350" text-anchor="middle" class="module-title">AuthN</text>
  <text x="510" y="382" text-anchor="middle" class="module-question">如何证明当前请求者的身份？</text>

  <text x="205" y="438" class="label">拥有认证事实</text>
  <rect x="200" y="465" width="280" height="62" rx="12" fill="#ffffff" stroke="#8fc69e" stroke-width="1.8"/>
  <text x="340" y="504" text-anchor="middle" class="object">LoginIdentity / Credential</text>
  <rect x="500" y="465" width="320" height="62" rx="12" fill="#ffffff" stroke="#8fc69e" stroke-width="1.8"/>
  <text x="660" y="504" text-anchor="middle" class="object">Challenge / Session / Token</text>

  <rect x="200" y="555" width="620" height="118" rx="16" fill="#ffffff" stroke="#4a9b61" stroke-width="2.2"/>
  <text x="510" y="584" text-anchor="middle" class="object-strong">Principal</text>
  <text x="510" y="614" text-anchor="middle" class="object mono">UserID · LoginIdentityID · TenantID</text>
  <text x="510" y="640" text-anchor="middle" class="object mono">SessionID · AuthMethod · AMR</text>
  <text x="510" y="664" text-anchor="middle" class="small">认证成功后的请求级主体表达，不是 User 实体，也不是 AuthZ Subject</text>

  <rect x="200" y="700" width="620" height="38" rx="10" fill="#f7fffa" stroke="#b8ddc2"/>
  <text x="510" y="725" text-anchor="middle" class="small">不拥有 User 生命周期，不定义角色、权限和资源</text>

  <!-- Identity module -->
  <rect x="1020" y="305" width="960" height="455" rx="24" fill="#fff8df" stroke="#d29b23" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1020" y="305" width="960" height="92" rx="24" fill="#ffefb9"/>
  <path d="M1020 373 H1980" stroke="#d29b23" stroke-width="2"/>
  <text x="1500" y="350" text-anchor="middle" class="module-title">Identity</text>
  <text x="1500" y="382" text-anchor="middle" class="module-question">用户是谁，自然人档案是什么？</text>

  <text x="1075" y="438" class="label">拥有身份事实</text>
  <rect x="1070" y="465" width="860" height="132" rx="18" fill="#ffffff" stroke="#d29b23" stroke-width="2.4"/>
  <text x="1500" y="510" text-anchor="middle" class="object-strong">User</text>
  <text x="1500" y="548" text-anchor="middle" class="object">IAM 内部稳定身份锚点</text>
  <text x="1500" y="576" text-anchor="middle" class="small mono">UserID 被 LoginIdentity、Principal、Session 与 AuthZ Subject 引用</text>

  <rect x="1070" y="625" width="400" height="72" rx="14" fill="#fffdf5" stroke="#e2bd63" stroke-width="1.8"/>
  <text x="1270" y="655" text-anchor="middle" class="object-strong">Profile</text>
  <text x="1270" y="682" text-anchor="middle" class="small">自然人档案</text>
  <rect x="1530" y="625" width="400" height="72" rx="14" fill="#fffdf5" stroke="#e2bd63" stroke-width="1.8"/>
  <text x="1730" y="655" text-anchor="middle" class="object-strong">ProfileLink</text>
  <text x="1730" y="682" text-anchor="middle" class="small">User 与 Profile 的身份关系事实</text>

  <rect x="1070" y="716" width="860" height="38" rx="10" fill="#fffcf2" stroke="#ead28c"/>
  <text x="1500" y="741" text-anchor="middle" class="small">不校验密码与 Token，不拥有 Session，也不执行资源授权</text>

  <!-- AuthZ module -->
  <rect x="2130" y="305" width="720" height="455" rx="24" fill="#f4efff" stroke="#8264bd" stroke-width="3" filter="url(#shadow)"/>
  <rect x="2130" y="305" width="720" height="92" rx="24" fill="#e9dfff"/>
  <path d="M2130 373 H2850" stroke="#8264bd" stroke-width="2"/>
  <text x="2490" y="350" text-anchor="middle" class="module-title">AuthZ</text>
  <text x="2490" y="382" text-anchor="middle" class="module-question">当前用户能访问什么资源？</text>

  <text x="2185" y="438" class="label">拥有授权事实</text>
  <rect x="2180" y="465" width="620" height="92" rx="16" fill="#ffffff" stroke="#a892d1" stroke-width="2.2"/>
  <text x="2490" y="501" text-anchor="middle" class="object-strong">Subject</text>
  <text x="2490" y="535" text-anchor="middle" class="object mono">{ Type: user, ID: UserID }</text>

  <rect x="2180" y="582" width="290" height="62" rx="12" fill="#ffffff" stroke="#bbaaDB"/>
  <text x="2325" y="621" text-anchor="middle" class="object">Role / RoleBinding</text>
  <rect x="2490" y="582" width="310" height="62" rx="12" fill="#ffffff" stroke="#bbaaDB"/>
  <text x="2645" y="621" text-anchor="middle" class="object">Permission / Resource</text>
  <rect x="2180" y="663" width="620" height="56" rx="12" fill="#ffffff" stroke="#8264bd" stroke-width="2"/>
  <text x="2490" y="698" text-anchor="middle" class="object-strong">Decision：Allow / Deny</text>
  <text x="2490" y="744" text-anchor="middle" class="small">不校验凭据与 Token，不拥有 Principal 或 User 生命周期</text>

  <!-- semantic references to User -->
  <path d="M870 535 H950 Q985 535 985 510 V510 Q985 495 1020 495" class="semantic"/>
  <rect x="865" y="420" width="310" height="55" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1020" y="444" text-anchor="middle" class="label">读取 / 校验 User 身份事实</text>
  <text x="1020" y="466" text-anchor="middle" class="small">共享 User Repository 适配器</text>

  <path d="M2130 535 H2050 Q2015 535 2015 510 V510 Q2015 495 1980 495" class="semantic"/>
  <rect x="1825" y="420" width="350" height="55" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="2000" y="444" text-anchor="middle" class="label">以 UserID 为授权主体锚点</text>
  <text x="2000" y="466" text-anchor="middle" class="small">建立 RoleBinding 时校验 User 存在</text>

  <!-- no direct dependency statement -->
  <path d="M760 805 H2240" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 8"/>
  <path d="M760 787 V823 M2240 787 V823" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="1100" y="775" width="800" height="58" rx="29" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1500" y="812" text-anchor="middle" class="callout">不存在 AuthN → AuthZ 的领域模型直连；两者通过 Identity User 的稳定标识语义对齐</text>

  <!-- section 2 -->
  <rect x="90" y="920" width="2820" height="630" rx="26" fill="#fbfcfe" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="120" y="945" width="700" height="64" rx="14" fill="#eef2f7"/>
  <text x="145" y="987" class="section">02｜一次受保护资源请求如何衔接</text>
  <text x="850" y="986" class="section-sub">下面是能力调用顺序，不是模块所有权转移。</text>

  <!-- request flow -->
  <rect x="135" y="1085" width="285" height="142" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="278" y="1132" text-anchor="middle" class="flow-title">业务请求</text>
  <text x="278" y="1170" text-anchor="middle" class="flow-sub mono">Authorization: Bearer ...</text>
  <text x="278" y="1200" text-anchor="middle" class="small">目标 Resource / Action / Scope</text>

  <line x1="420" y1="1156" x2="520" y2="1156" class="solid"/>

  <rect x="525" y="1060" width="390" height="192" rx="22" fill="#edf9f0" stroke="#4a9b61" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="720" y="1103" text-anchor="middle" class="flow-title">AuthN Capability</text>
  <text x="720" y="1137" text-anchor="middle" class="object-strong mono">TokenService.VerifyToken</text>
  <text x="720" y="1174" text-anchor="middle" class="flow-sub">验证签名、时效、会话与主体状态</text>
  <rect x="590" y="1196" width="260" height="35" rx="10" fill="#ffffff" stroke="#8fc69e"/>
  <text x="720" y="1220" text-anchor="middle" class="small">输出可信身份声明</text>

  <line x1="915" y1="1156" x2="1015" y2="1156" class="solid"/>

  <rect x="1020" y="1060" width="470" height="192" rx="22" fill="#f5f7fa" stroke="#8795a8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1255" y="1103" text-anchor="middle" class="flow-title">可信请求数据</text>
  <text x="1255" y="1142" text-anchor="middle" class="object mono">user_id · tenant_id · session_id</text>
  <text x="1255" y="1178" text-anchor="middle" class="flow-sub">由 Transport / Application 在本次请求中传递</text>
  <rect x="1110" y="1198" width="290" height="35" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1255" y="1222" text-anchor="middle" class="small">请求级数据，不是新的业务模块</text>

  <line x1="1490" y1="1156" x2="1590" y2="1156" class="solid"/>

  <rect x="1595" y="1060" width="420" height="192" rx="22" fill="#fff8df" stroke="#d29b23" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1805" y="1103" text-anchor="middle" class="flow-title">稳定身份映射</text>
  <text x="1805" y="1142" text-anchor="middle" class="object-strong mono">subject.NewUserRef(user_id)</text>
  <text x="1805" y="1178" text-anchor="middle" class="flow-sub">只复用 Identity UserID</text>
  <text x="1805" y="1213" text-anchor="middle" class="small">不复制 Principal，不把认证细节带入授权模型</text>

  <line x1="2015" y1="1156" x2="2115" y2="1156" class="solid"/>

  <rect x="2120" y="1060" width="390" height="192" rx="22" fill="#f4efff" stroke="#8264bd" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="2315" y="1103" text-anchor="middle" class="flow-title">AuthZ Capability</text>
  <text x="2315" y="1137" text-anchor="middle" class="object-strong mono">AuthorizationChecker.Check</text>
  <text x="2315" y="1174" text-anchor="middle" class="flow-sub mono">Subject + Resource + Action + Scope</text>
  <rect x="2185" y="1196" width="260" height="35" rx="10" fill="#ffffff" stroke="#a892d1"/>
  <text x="2315" y="1220" text-anchor="middle" class="small">独立执行授权策略</text>

  <line x1="2510" y1="1156" x2="2610" y2="1156" class="solid"/>

  <rect x="2615" y="1085" width="250" height="142" rx="60" fill="#ffffff" stroke="#8264bd" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="2740" y="1135" text-anchor="middle" class="flow-title">Decision</text>
  <text x="2740" y="1175" text-anchor="middle" class="object-strong">Allow / Deny</text>
  <text x="2740" y="1204" text-anchor="middle" class="small">返回业务系统继续处理</text>

  <!-- User semantic guide from identity to request -->
  <path d="M1500 760 V890 Q1500 905 1515 905 H1805 V1045" class="guide"/>
  <rect x="1340" y="854" width="505" height="48" rx="12" fill="#ffffff" stroke="#d29b23" stroke-width="1.6"/>
  <text x="1592" y="885" text-anchor="middle" class="label">Identity User 提供稳定 ID 语义，不传递认证或授权内部对象</text>

  <!-- narrative summary -->
  <rect x="260" y="1320" width="2480" height="142" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1500" y="1365" text-anchor="middle" class="callout">认证链的终点是可信 Principal；授权链的起点是稳定 Subject。</text>
  <text x="1500" y="1403" text-anchor="middle" class="object">二者只通过 <tspan class="mono">UserID</tspan> 和请求上下文完成映射，因此同一个 User 的多种 LoginIdentity 可以共享业务授权。</text>
  <text x="1500" y="1437" text-anchor="middle" class="small">AuthN 失败返回 Unauthenticated；AuthZ 拒绝返回 PermissionDenied；两类失败可以独立表达和观测。</text>

  <!-- legend -->
  <line x1="150" y1="1615" x2="250" y2="1615" class="solid"/>
  <text x="275" y="1622" class="label">一次请求中的能力调用顺序</text>
  <line x1="735" y1="1615" x2="835" y2="1615" class="semantic"/>
  <text x="860" y="1622" class="label">对 Identity User 事实的语义引用，不等于模块 API 直连</text>
  <rect x="1715" y="1578" width="1135" height="78" rx="16" fill="#fffdf5" stroke="#d29b23" stroke-width="1.8"/>
  <text x="2282" y="1610" text-anchor="middle" class="callout">一句话：Identity 定义“谁”，AuthN 证明“当前是谁”，AuthZ 判断“这个 User 能做什么”。</text>
  <text x="2282" y="1638" text-anchor="middle" class="small">在请求链路上前后衔接，在领域模型上各自独立。</text>
</svg>
