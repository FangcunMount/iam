<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1600" viewBox="0 0 2600 1600" role="img" aria-labelledby="title desc">
  <title id="title">IAM 当前分层与运行时架构</title>
  <desc id="desc">展示 IAM 外部调用方、process 生命周期、container 组合根、REST 和 gRPC 传输层、application、domain、infrastructure 及 MySQL Redis NSQ Provider。AuthZ 使用原生不可变快照，Casbin 仅作为 RoleManager。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity="0.09"/></filter>
    <style>
      .bg{fill:#f8fafc}.title{font:700 46px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.subtitle{font:400 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b}.bandTitle{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.bandSub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b}.boxTitle{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.field{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}.note{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b}.edgeLabel{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.band{stroke-width:2.5;rx:24}.card{fill:#fff;stroke-width:2;rx:14}.edge{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.wire{stroke:#2563eb;stroke-width:3;stroke-dasharray:12 10;fill:none;marker-end:url(#blueArrow)}.divider{stroke:#dbe3ef;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="2600" height="1600"/>
  <text x="75" y="72" class="title">IAM 当前系统架构｜生命周期、组合根与 Ports &amp; Adapters</text>
  <text x="75" y="110" class="subtitle">运行请求沿 transport → application → domain；container 在启动期把 infra 适配器装配到 Domain/Application 端口。</text>

  <rect x="70" y="150" width="2460" height="145" class="band" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="105" y="195" class="bandTitle">接入方｜IAM 外部</text>
  <rect x="440" y="180" width="440" height="80" class="card" stroke="#94a3b8"/>
  <text x="660" y="218" text-anchor="middle" class="boxTitle">Web / App / Admin Console</text>
  <text x="660" y="244" text-anchor="middle" class="note">Bearer user token</text>
  <rect x="1010" y="180" width="440" height="80" class="card" stroke="#94a3b8"/>
  <text x="1230" y="218" text-anchor="middle" class="boxTitle">业务后端服务</text>
  <text x="1230" y="244" text-anchor="middle" class="note">Service token + gRPC</text>
  <rect x="1580" y="180" width="440" height="80" class="card" stroke="#94a3b8"/>
  <text x="1800" y="218" text-anchor="middle" class="boxTitle">Go SDK｜pkg/sdk</text>
  <text x="1800" y="244" text-anchor="middle" class="note">认证、验签与 AuthZ client</text>

  <rect x="70" y="330" width="505" height="1000" class="band" fill="#fff8df" stroke="#d59a16" filter="url(#shadow)"/>
  <text x="105" y="378" class="bandTitle">运行时编排</text>
  <text x="105" y="407" class="bandSub">process 决定顺序；container 持有对象图</text>
  <rect x="110" y="450" width="425" height="220" class="card" stroke="#d59a16"/>
  <text x="322" y="492" text-anchor="middle" class="boxTitle">process</text>
  <line x1="145" y1="510" x2="500" y2="510" class="divider"/>
  <text x="322" y="544" text-anchor="middle" class="field">RuntimeProfile / degraded policy</text>
  <text x="322" y="574" text-anchor="middle" class="field">prepareResources / Transports</text>
  <text x="322" y="604" text-anchor="middle" class="field">RunGroup / readiness / draining</text>
  <text x="322" y="638" text-anchor="middle" class="note">拥有启动与关闭生命周期</text>

  <rect x="110" y="720" width="425" height="250" class="card" stroke="#d59a16"/>
  <text x="322" y="762" text-anchor="middle" class="boxTitle">container｜Composition Root</text>
  <line x1="145" y1="780" x2="500" y2="780" class="divider"/>
  <text x="322" y="814" text-anchor="middle" class="field">moduleGraph / typed capabilities</text>
  <text x="322" y="844" text-anchor="middle" class="field">BuildRESTDeps / BuildGRPCDeps</text>
  <text x="322" y="874" text-anchor="middle" class="field">BuildRuntimeDeps</text>
  <text x="322" y="910" text-anchor="middle" class="note">选择实现并注入端口；不处理请求</text>
  <text x="322" y="940" text-anchor="middle" class="note">持有同一模块对象图直到 Shutdown</text>

  <rect x="110" y="1020" width="425" height="250" class="card" stroke="#d59a16"/>
  <text x="322" y="1062" text-anchor="middle" class="boxTitle">进程级后台任务</text>
  <line x1="145" y1="1080" x2="500" y2="1080" class="divider"/>
  <text x="322" y="1114" text-anchor="middle" class="field">JWKS Key Rotation</text>
  <text x="322" y="1144" text-anchor="middle" class="field">Transactional Outbox Relay</text>
  <text x="322" y="1174" text-anchor="middle" class="field">AuthZ Policy Sync</text>
  <text x="322" y="1204" text-anchor="middle" class="field">Suggest Full/Delta cron（模块内）</text>
  <text x="322" y="1238" text-anchor="middle" class="note">对应 Stop Hook 由 lifecycle 收敛</text>
  <path d="M322 670 L322 720" class="edge"/>

  <rect x="620" y="330" width="1910" height="215" class="band" fill="#eef3ff" stroke="#4d6cc5"/>
  <text x="655" y="376" class="bandTitle">协议适配层｜transport</text>
  <text x="655" y="405" class="bandSub">认证上下文、DTO/Proto 映射、中间件、错误映射；只使用 container 暴露的窄依赖</text>
  <rect x="720" y="438" width="760" height="78" class="card" stroke="#4d6cc5"/>
  <text x="1100" y="471" text-anchor="middle" class="boxTitle">REST</text>
  <text x="1100" y="498" text-anchor="middle" class="field">AuthN / Identity / IDP / Suggest + AuthZ v3 管理面</text>
  <rect x="1615" y="438" width="760" height="78" class="card" stroke="#4d6cc5"/>
  <text x="1995" y="471" text-anchor="middle" class="boxTitle">gRPC</text>
  <text x="1995" y="498" text-anchor="middle" class="field">AuthN / Identity / IDP + AuthZ v3 Check / Snapshot / Assignment</text>

  <rect x="620" y="585" width="1910" height="220" class="band" fill="#eef8f1" stroke="#36905d"/>
  <text x="655" y="630" class="bandTitle">应用层｜application</text>
  <text x="655" y="659" class="bandSub">用例编排、事务边界、命令/查询、跨模块端口；不依赖具体 GORM、Redis 或 Casbin 类型</text>
  <rect x="700" y="700" width="320" height="72" class="card" stroke="#36905d"/><text x="860" y="744" text-anchor="middle" class="boxTitle">Identity Use Cases</text>
  <rect x="1060" y="700" width="320" height="72" class="card" stroke="#36905d"/><text x="1220" y="744" text-anchor="middle" class="boxTitle">AuthN Use Cases</text>
  <rect x="1420" y="700" width="320" height="72" class="card" stroke="#36905d"/><text x="1580" y="744" text-anchor="middle" class="boxTitle">AuthZ Use Cases</text>
  <rect x="1780" y="700" width="320" height="72" class="card" stroke="#36905d"/><text x="1940" y="744" text-anchor="middle" class="boxTitle">IDP Use Cases</text>
  <rect x="2140" y="700" width="320" height="72" class="card" stroke="#36905d"/><text x="2300" y="744" text-anchor="middle" class="boxTitle">Suggest Use Cases</text>

  <rect x="620" y="845" width="1910" height="220" class="band" fill="#fff8df" stroke="#d59a16"/>
  <text x="655" y="890" class="bandTitle">领域层｜domain</text>
  <text x="655" y="919" class="bandSub">实体、值对象、领域策略、不变量与端口；不依赖 transport / infra</text>
  <rect x="700" y="960" width="320" height="72" class="card" stroke="#d59a16"/><text x="860" y="990" text-anchor="middle" class="boxTitle">Identity</text><text x="860" y="1016" text-anchor="middle" class="field">User / Profile / ProfileLink</text>
  <rect x="1060" y="960" width="320" height="72" class="card" stroke="#d59a16"/><text x="1220" y="990" text-anchor="middle" class="boxTitle">AuthN</text><text x="1220" y="1016" text-anchor="middle" class="field">LoginIdentity / Session / Admission</text>
  <rect x="1420" y="960" width="320" height="72" class="card" stroke="#d59a16"/><text x="1580" y="990" text-anchor="middle" class="boxTitle">AuthZ</text><text x="1580" y="1016" text-anchor="middle" class="field">Assignment / Grant / Constraint</text>
  <rect x="1780" y="960" width="320" height="72" class="card" stroke="#d59a16"/><text x="1940" y="990" text-anchor="middle" class="boxTitle">IDP</text><text x="1940" y="1016" text-anchor="middle" class="field">WechatApp / ExternalIdentity</text>
  <rect x="2140" y="960" width="320" height="72" class="card" stroke="#d59a16"/><text x="2300" y="990" text-anchor="middle" class="boxTitle">Suggest</text><text x="2300" y="1016" text-anchor="middle" class="field">SearchTerm / AccessScope</text>

  <rect x="620" y="1105" width="1910" height="225" class="band" fill="#f3effd" stroke="#7652c8"/>
  <text x="655" y="1150" class="bandTitle">基础设施适配层｜infra</text>
  <text x="655" y="1179" class="bandSub">实现 Domain/Application driven ports；隔离数据库、缓存、消息、Provider 与运行时投影</text>
  <rect x="690" y="1220" width="270" height="78" class="card" stroke="#7652c8"/><text x="825" y="1252" text-anchor="middle" class="boxTitle">MySQL Repo / UoW</text><text x="825" y="1278" text-anchor="middle" class="field">权威事实 + Outbox</text>
  <rect x="990" y="1220" width="270" height="78" class="card" stroke="#7652c8"/><text x="1125" y="1252" text-anchor="middle" class="boxTitle">Redis Adapters</text><text x="1125" y="1278" text-anchor="middle" class="field">Session / Token / Cache</text>
  <rect x="1290" y="1220" width="360" height="78" class="card" stroke="#7652c8"/><text x="1470" y="1252" text-anchor="middle" class="boxTitle">AuthZ Native Snapshot</text><text x="1470" y="1278" text-anchor="middle" class="field">Casbin 仅 RoleManager</text>
  <rect x="1680" y="1220" width="270" height="78" class="card" stroke="#7652c8"/><text x="1815" y="1252" text-anchor="middle" class="boxTitle">JWT / JWKS</text><text x="1815" y="1278" text-anchor="middle" class="field">Codec / KeySet</text>
  <rect x="1980" y="1220" width="270" height="78" class="card" stroke="#7652c8"/><text x="2115" y="1252" text-anchor="middle" class="boxTitle">IDP Adapters</text><text x="2115" y="1278" text-anchor="middle" class="field">WeChat / WeCom</text>
  <rect x="2280" y="1220" width="200" height="78" class="card" stroke="#7652c8"/><text x="2380" y="1252" text-anchor="middle" class="boxTitle">Suggest</text><text x="2380" y="1278" text-anchor="middle" class="field">Trie / Hash</text>

  <path d="M1230 295 L1230 330" class="edge"/>
  <path d="M1100 545 L1100 585" class="edge"/>
  <path d="M1995 545 L1995 585" class="edge"/>
  <path d="M1580 805 L1580 845" class="edge"/>
  <path d="M575 830 L620 830" class="wire"/>
  <path d="M575 950 L620 950" class="wire"/>
  <path d="M575 1215 L620 1215" class="wire"/>
  <path d="M1470 1220 L1470 1085 L1580 1085 L1580 1065" class="wire"/>
  <text x="1360" y="1092" class="edgeLabel">implements runtime port</text>

  <rect x="70" y="1370" width="2460" height="130" class="band" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="105" y="1415" class="bandTitle">外部基础设施</text>
  <text x="565" y="1418" class="boxTitle">MySQL</text>
  <text x="900" y="1418" class="boxTitle">Redis</text>
  <text x="1230" y="1418" class="boxTitle">NSQ</text>
  <text x="1560" y="1418" class="boxTitle">WeChat / WeCom</text>
  <text x="2010" y="1418" class="boxTitle">HTTP / gRPC clients</text>
  <text x="1300" y="1472" text-anchor="middle" class="edgeLabel">依赖约束：transport → application → domain；infra → ports；domain 不依赖 infra；process/container 只负责生命周期与装配。</text>
</svg>
