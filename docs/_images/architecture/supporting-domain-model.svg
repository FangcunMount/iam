<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1780" viewBox="0 0 3000 1780" role="img" aria-labelledby="title desc">
  <title id="title">IAM 辅助领域模型：IDP 与 Suggest 如何支撑核心模块</title>
  <desc id="desc">左侧展示 IDP 拥有第三方应用配置、凭证、应用令牌和请求级 ExternalIdentity，并只向 AuthN 输出标准外部身份。右侧展示 Suggest 从 Identity 读取 Profile 事实、结合 AuthN 可信请求上下文和 AuthZ 可见范围，构建可重建的 Profile 搜索读模型。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4267b2"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 52px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #64748b; }
      .context-title { font-size: 34px; font-weight: 700; }
      .context-sub { font-size: 20px; fill: #475569; }
      .section { font-size: 19px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .model { font-size: 24px; font-weight: 700; }
      .field { font-size: 17px; fill: #475569; }
      .relation { font-size: 17px; font-weight: 600; fill: #475569; }
      .note { font-size: 18px; fill: #475569; }
      .callout { font-size: 22px; font-weight: 700; }
      .small { font-size: 16px; fill: #64748b; }
      .solid { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .input { fill: none; stroke: #4267b2; stroke-width: 3; stroke-dasharray: 11 9; marker-end: url(#arrowBlue); }
      .association { fill: none; stroke: #64748b; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="3000" height="1780" fill="#ffffff"/>
  <text x="120" y="88" class="title">IAM 辅助领域模型：IDP 与 Suggest 如何支撑核心模块</text>
  <text x="120" y="135" class="subtitle">辅助模块拥有自己的模型与边界，但不接管核心身份语义：IDP 标准化外部身份，Suggest 派生可重建的查询模型。</text>

  <!-- Core module anchors -->
  <rect x="110" y="190" width="2780" height="160" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="155" y="235" class="section">辅助模块边界之外：核心模块提供事实输入，或消费标准输出</text>
  <rect x="700" y="258" width="450" height="70" rx="14" fill="#e8f5eb" stroke="#4a9b61" stroke-width="2"/>
  <text x="925" y="301" text-anchor="middle" class="model">AuthN｜LoginIdentity</text>
  <rect x="1580" y="258" width="360" height="70" rx="14" fill="#fff7dc" stroke="#d29b23" stroke-width="2"/>
  <text x="1760" y="301" text-anchor="middle" class="model">Identity｜Profile Facts</text>
  <rect x="2010" y="258" width="350" height="70" rx="14" fill="#e8f5eb" stroke="#4a9b61" stroke-width="2"/>
  <text x="2185" y="301" text-anchor="middle" class="model">AuthN｜Trusted Context</text>
  <rect x="2430" y="258" width="360" height="70" rx="14" fill="#eee7fa" stroke="#7653b5" stroke-width="2"/>
  <text x="2610" y="301" text-anchor="middle" class="model">AuthZ｜Visibility Scope</text>

  <!-- IDP context -->
  <rect x="100" y="420" width="1330" height="1120" rx="28" fill="#f4f6fb" stroke="#5870b5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="100" y="420" width="1330" height="116" rx="28" fill="#e5eaf8"/>
  <path d="M100 507 H1430" stroke="#5870b5" stroke-width="2"/>
  <text x="765" y="467" text-anchor="middle" class="context-title">IDP｜外部身份提供方上下文</text>
  <text x="765" y="499" text-anchor="middle" class="context-sub">屏蔽 Provider 差异，产出 AuthN 可消费的通用 ExternalIdentity</text>

  <rect x="155" y="575" width="310" height="120" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="310" y="618" text-anchor="middle" class="model">External Provider</text>
  <text x="310" y="654" text-anchor="middle" class="field">Wechat / WeCom / OAuth</text>
  <text x="310" y="682" text-anchor="middle" class="small">IAM 外部</text>

  <text x="540" y="575" class="section">应用配置聚合</text>
  <rect x="535" y="600" width="370" height="150" rx="18" fill="#ffffff" stroke="#5870b5" stroke-width="2.6"/>
  <text x="720" y="645" text-anchor="middle" class="model">WechatApp</text>
  <text x="720" y="681" text-anchor="middle" class="field">AppID · Name · Type · Status</text>
  <text x="720" y="712" text-anchor="middle" class="field">Provider 应用配置聚合根</text>

  <rect x="980" y="575" width="380" height="120" rx="18" fill="#ffffff" stroke="#8da0cf" stroke-width="2"/>
  <text x="1170" y="618" text-anchor="middle" class="model">Credentials</text>
  <text x="1170" y="654" text-anchor="middle" class="field">Auth / Message / API Secret</text>
  <text x="1170" y="682" text-anchor="middle" class="small">敏感配置，由 IDP 持有</text>
  <path d="M907 668 H978" class="solid"/>
  <text x="942" y="650" text-anchor="middle" class="relation">持有</text>

  <rect x="980" y="735" width="380" height="120" rx="18" fill="#ffffff" stroke="#8da0cf" stroke-width="2"/>
  <text x="1170" y="778" text-anchor="middle" class="model">AppToken</text>
  <text x="1170" y="814" text-anchor="middle" class="field">AccessToken · ExpireAt</text>
  <text x="1170" y="842" text-anchor="middle" class="small">Provider 应用级令牌</text>
  <path d="M905 705 H940 V795 H978" class="solid"/>
  <text x="946" y="775" text-anchor="middle" class="relation">管理</text>

  <text x="155" y="930" class="section">边界能力与标准输出</text>
  <rect x="155" y="955" width="480" height="185" rx="18" fill="#ffffff" stroke="#5870b5" stroke-width="2.6"/>
  <text x="395" y="1000" text-anchor="middle" class="model">ExternalIdentity Resolver</text>
  <text x="395" y="1038" text-anchor="middle" class="field">校验 Provider 配置</text>
  <text x="395" y="1068" text-anchor="middle" class="field">交换一次性 proof / code</text>
  <text x="395" y="1098" text-anchor="middle" class="field">归一化 Provider 身份声明</text>

  <rect x="770" y="955" width="590" height="215" rx="18" fill="#edf1fb" stroke="#5870b5" stroke-width="2.8"/>
  <text x="1065" y="1000" text-anchor="middle" class="model">ExternalIdentity</text>
  <text x="1065" y="1038" text-anchor="middle" class="field">Provider · Realm · Subject</text>
  <text x="1065" y="1068" text-anchor="middle" class="field">Identifiers · GlobalIdentifier · VerifiedAt</text>
  <text x="1065" y="1100" text-anchor="middle" class="field">请求级外部身份事实</text>
  <text x="1065" y="1133" text-anchor="middle" class="small">不包含 IAM User、LoginIdentity 或可复用凭证</text>

  <path d="M465 635 H495 V1018 H153" class="solid"/>
  <text x="485" y="824" transform="rotate(-90 485 824)" text-anchor="middle" class="relation">交换授权码 / 校验外部证明</text>
  <path d="M720 752 V900 H395 V953" class="solid"/>
  <text x="555" y="888" text-anchor="middle" class="relation">提供应用配置与凭证</text>
  <path d="M637 1048 H768" class="solid"/>
  <text x="702" y="1030" text-anchor="middle" class="relation">产出</text>

  <rect x="155" y="1240" width="1205" height="215" rx="18" fill="#e7ecf8" stroke="#a6b3d6" stroke-width="1.8"/>
  <text x="195" y="1288" class="model">IDP 的支撑边界</text>
  <text x="195" y="1335" class="note">• IDP 拥有 Provider 应用、密钥与 AppToken，吸收第三方协议差异。</text>
  <text x="195" y="1377" class="note">• 对 AuthN 只暴露 ExternalIdentity Resolver，输出请求级 ExternalIdentity。</text>
  <text x="195" y="1419" class="note">• IDP 不创建 User、LoginIdentity 或 Session，也不决定本地账号如何绑定。</text>

  <!-- Suggest context -->
  <rect x="1570" y="420" width="1330" height="1120" rx="28" fill="#f5f2fb" stroke="#7653b5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1570" y="420" width="1330" height="116" rx="28" fill="#ebe3f8"/>
  <path d="M1570 507 H2900" stroke="#7653b5" stroke-width="2"/>
  <text x="2235" y="467" text-anchor="middle" class="context-title">Suggest｜Profile 联想搜索上下文</text>
  <text x="2235" y="499" text-anchor="middle" class="context-sub">把身份事实派生为高效读模型，并在查询时应用可见范围</text>

  <text x="1625" y="575" class="section">可重建的派生读模型</text>
  <rect x="1625" y="600" width="350" height="150" rx="18" fill="#ffffff" stroke="#9a82c6" stroke-width="2"/>
  <text x="1800" y="645" text-anchor="middle" class="model">Profile Facts</text>
  <text x="1800" y="681" text-anchor="middle" class="field">Profile · User · ProfileLink</text>
  <text x="1800" y="712" text-anchor="middle" class="small">Identity 是事实源</text>

  <rect x="2050" y="600" width="390" height="150" rx="18" fill="#ffffff" stroke="#9a82c6" stroke-width="2"/>
  <text x="2245" y="645" text-anchor="middle" class="model">SuggestibleProfile</text>
  <text x="2245" y="681" text-anchor="middle" class="field">ProfileID · DisplayName · Mobiles</text>
  <text x="2245" y="712" text-anchor="middle" class="field">OrgID · OwnerOperatorIDs · Weight</text>

  <rect x="2515" y="600" width="330" height="150" rx="18" fill="#ffffff" stroke="#7653b5" stroke-width="2.6"/>
  <text x="2680" y="645" text-anchor="middle" class="model">SuggestionIndex</text>
  <text x="2680" y="681" text-anchor="middle" class="field">Prefix index · Hash lookup</text>
  <text x="2680" y="712" text-anchor="middle" class="small">内存实现，可全量重建</text>
  <path d="M1977 675 H2048" class="solid"/>
  <text x="2012" y="657" text-anchor="middle" class="relation">Full / Delta 派生</text>
  <path d="M2442 675 H2513" class="solid"/>
  <text x="2477" y="657" text-anchor="middle" class="relation">构建</text>

  <text x="1625" y="845" class="section">查询范围与输出</text>
  <rect x="1625" y="870" width="410" height="178" rx="18" fill="#ffffff" stroke="#9a82c6" stroke-width="2"/>
  <text x="1830" y="915" text-anchor="middle" class="model">visibility.Scope</text>
  <text x="1830" y="951" text-anchor="middle" class="field">AllProfile · OrgIDs</text>
  <text x="1830" y="981" text-anchor="middle" class="field">OperatorID · ProfileIDs</text>
  <text x="1830" y="1011" text-anchor="middle" class="field">AllowMobileSearch</text>

  <rect x="2110" y="870" width="350" height="178" rx="18" fill="#ffffff" stroke="#9a82c6" stroke-width="2"/>
  <text x="2285" y="915" text-anchor="middle" class="model">Suggest Query</text>
  <text x="2285" y="951" text-anchor="middle" class="field">Keyword · Limit</text>
  <text x="2285" y="981" text-anchor="middle" class="field">Index + AccessScope</text>
  <text x="2285" y="1011" text-anchor="middle" class="small">先检索，再过滤可见范围</text>

  <rect x="2535" y="870" width="310" height="178" rx="18" fill="#eee7fa" stroke="#7653b5" stroke-width="2.6"/>
  <text x="2690" y="915" text-anchor="middle" class="model">SuggestProfile</text>
  <text x="2690" y="951" text-anchor="middle" class="field">ProfileID · DisplayName</text>
  <text x="2690" y="981" text-anchor="middle" class="field">Masked Mobile</text>
  <text x="2690" y="1011" text-anchor="middle" class="small">范围过滤后的查询结果</text>
  <path d="M2037 959 H2108" class="solid"/>
  <path d="M2462 959 H2533" class="solid"/>
  <path d="M2680 752 V820 H2285 V868" class="solid"/>

  <rect x="1625" y="1130" width="1220" height="325" rx="18" fill="#ece5f8" stroke="#b9a7d9" stroke-width="1.8"/>
  <text x="1665" y="1178" class="model">Suggest 的支撑边界</text>
  <text x="1665" y="1226" class="note">• Identity 的 MySQL 事实是唯一事实源；Suggest 只拥有派生的搜索读模型。</text>
  <text x="1665" y="1268" class="note">• SuggestibleProfile 与索引可 Full / Delta 刷新，可短暂滞后，也可全部重建。</text>
  <text x="1665" y="1310" class="note">• visibility.Scope 来自可信请求上下文与 AuthZ 授权事实，不复制权限事实。</text>
  <text x="1665" y="1352" class="note">• Suggest 不拥有 Profile 生命周期，也不定义 Role、Permission 或授权决策。</text>
  <text x="1665" y="1394" class="note">• 查询结果经过范围过滤与敏感字段脱敏，再返回管理端或业务系统。</text>

  <!-- Cross-boundary inputs and outputs -->
  <path d="M1065 953 V900 H925 V330" class="input"/>
  <rect x="950" y="852" width="410" height="56" rx="12" fill="#eef4ff" stroke="#9bb3df"/>
  <text x="1155" y="888" text-anchor="middle" class="relation">映射或绑定本地 LoginIdentity</text>

  <path d="M1760 330 V598" class="input"/>
  <rect x="1585" y="353" width="350" height="56" rx="12" fill="#eef4ff" stroke="#9bb3df"/>
  <text x="1760" y="389" text-anchor="middle" class="relation">Full / Delta 读取身份事实</text>

  <path d="M2185 330 V370 H1780 V518" class="input"/>
  <rect x="1580" y="520" width="400" height="56" rx="12" fill="#eef4ff" stroke="#9bb3df"/>
  <text x="1780" y="556" text-anchor="middle" class="relation">可信 Principal / Tenant / Org</text>
  <path d="M1780 578 H1590 V800 H1760 V868" class="input"/>

  <path d="M2610 330 V518" class="input"/>
  <rect x="2410" y="520" width="400" height="56" rx="12" fill="#eef4ff" stroke="#9bb3df"/>
  <text x="2610" y="556" text-anchor="middle" class="relation">角色与搜索可见范围</text>
  <path d="M2610 578 H2870 V820 H1900 V868" class="input"/>

  <!-- Bottom conclusion -->
  <rect x="100" y="1595" width="2800" height="115" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1500" y="1642" text-anchor="middle" class="callout">辅助模块支撑核心流程，但不接管核心事实</text>
  <text x="1500" y="1682" text-anchor="middle" class="note">IDP 的边界输出是 ExternalIdentity；Suggest 的边界输出是受范围约束的派生查询结果。二者都可以独立替换或重建。</text>

  <line x1="2190" y1="1742" x2="2260" y2="1742" class="association"/>
  <text x="2275" y="1749" class="small">模块内领域关系</text>
  <line x1="2495" y1="1742" x2="2565" y2="1742" class="input"/>
  <text x="2580" y="1749" class="small">跨边界事实输入 / 标准输出</text>
</svg>
