      tags:
      - 认证
  /authn/login-identities/phone/challenge:
    post:
      consumes:
      - application/json
      parameters:
      - description: 手机号
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkPhoneChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已发送
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.MessageResponse'
      security:
      - BearerAuth: []
      summary: 发送手机号绑定验证码
      tags:
      - 认证
  /authn/login-identities/wechat-miniprogram:
    post:
      consumes:
      - application/json
      parameters:
      - description: 微信小程序 code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkWechatMiniProgramRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 绑定结果
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LinkLoginIdentityResponse'
      security:
      - BearerAuth: []
      summary: 绑定微信小程序登录身份
      tags:
      - 认证
  /authn/login-identities/wechat-open:
    post:
      consumes:
      - application/json
      parameters:
      - description: 微信回调 code 与 state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkWechatOpenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 绑定结果
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LinkLoginIdentityResponse'
      security:
      - BearerAuth: []
      summary: 完成微信开放平台扫码绑定
      tags:
      - 认证
  /authn/login-identities/wechat-open/authorize:
    post:
      consumes:
      - application/json
      parameters:
      - description: 可选 nonce
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LinkWechatOpenAuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 授权地址与 state
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.WechatOpenAuthorizeResponse'
      security:
      - BearerAuth: []
      summary: 发起微信开放平台扫码绑定授权
