host: iam.fangcunmount.cn
info:
  contact:
    email: support@fangcunmount.cn
    name: API Support
    url: https://github.com/FangcunMount/iam/v2
  description: IAM 系统 REST API 文档，包含认证(Authentication)、授权(Authorization)、身份管理(Identity)和身份提供商(IDP)模块
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://iam.fangcunmount.cn/terms
  title: IAM API Documentation
  version: 1.0.0
paths:
  /.well-known/jwks.json:
    get:
      description: 获取 JSON Web Key Set，用于验证 JWT 签名
      produces:
      - application/json
      responses:
        "200":
          description: JWKS JSON
          headers:
            Cache-Control:
              description: 缓存控制
              type: string
            ETag:
              description: 实体标签
              type: string
            Last-Modified:
              description: 最后修改时间
              type: string
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      summary: 获取 JWKS
      tags:
      - Authentication-JWKS
  /authn/admin/jwks/keys:
    get:
      description: 分页列出所有密钥
      parameters:
      - description: 状态过滤 (active, grace, retired)
        in: query
        name: status
        type: string
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      - default: 0
        description: 偏移量
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 密钥列表
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.KeyListResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 列出密钥
      tags:
      - Authentication-JWKS
    post:
      consumes:
      - application/json
      description: 创建新的签名密钥
      parameters:
      - description: 创建密钥请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.KeyResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 创建密钥
      tags:
      - Authentication-JWKS
  /authn/admin/jwks/keys/{kid}:
    get:
      description: 根据 kid 获取密钥详细信息
      parameters:
      - description: 密钥 ID
        in: path
        name: kid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 密钥详情
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.KeyResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "404":
          description: 密钥不存在
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 获取密钥详情
      tags:
      - Authentication-JWKS
  /authn/admin/jwks/keys/{kid}/force-retire:
    post:
      description: 强制将任何状态的密钥转为 Retired（用于紧急情况）
      parameters:
      - description: 密钥 ID
        in: path
        name: kid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 强制退役成功
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "404":
          description: 密钥不存在
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 强制退役密钥
      tags:
      - Authentication-JWKS
  /authn/admin/jwks/keys/{kid}/grace:
    post:
      description: 将密钥状态从 Active 转为 Grace
      parameters:
      - description: 密钥 ID
        in: path
        name: kid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 进入宽限期成功
        "400":
          description: 参数错误或状态不允许
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "404":
          description: 密钥不存在
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 进入宽限期
      tags:
      - Authentication-JWKS
  /authn/admin/jwks/keys/{kid}/retire:
    post:
      description: 将密钥状态从 Grace 转为 Retired
      parameters:
      - description: 密钥 ID
        in: path
        name: kid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 退役成功
        "400":
          description: 参数错误或状态不允许
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "404":
          description: 密钥不存在
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 退役密钥
      tags:
      - Authentication-JWKS
  /authn/admin/jwks/keys/cleanup:
    post:
      description: 删除已过期的 Retired 密钥
      produces:
      - application/json
      responses:
        "200":
          description: 清理结果
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.CleanupResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 清理过期密钥
      tags:
      - Authentication-JWKS
  /authn/admin/jwks/keys/publishable:
    get:
      description: 获取当前会被发布到 JWKS 的密钥列表（用于预览或调试）
      produces:
      - application/json
      responses:
        "200":
          description: 可发布的密钥列表
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.PublishableKeysResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_pkg_core.ErrResponse'
      security:
      - BearerAuth: []
      summary: 获取可发布的密钥
      tags:
      - Authentication-JWKS
  /authn/challenges/phone-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: 手机号
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.SendLoginPhoneOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已受理
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.MessageResponse'
      summary: 发送登录短信验证码
      tags:
      - 认证
  /authn/login:
    post:
      consumes:
      - application/json
      description: 使用 auth_method 明确选择认证方式，method_payload 按认证方式解析。v2 只开放 password、phone_otp、wechat、wecom。
      parameters:
      - description: 显式登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_request.LoginV2Request'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，返回访问令牌和刷新令牌
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.TokenPair'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 认证失败
          schema:
            additionalProperties: true
            type: object
      summary: 显式登录
      tags:
      - Authentication-Auth
  /authn/login-identities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 当前用户已绑定的登录身份
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.LoginIdentityListResponse'
      security:
      - BearerAuth: []
      summary: 列出当前用户登录身份
      tags:
      - 认证
  /authn/login-identities/{id}:
    delete:
      parameters:
      - description: 登录身份 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 已解绑
          schema:
            $ref: '#/definitions/github_com_FangcunMount_iam_v2_internal_apiserver_transport_rest_authn_response.MessageResponse'
      security:
      - BearerAuth: []
      summary: 解绑登录身份
      tags:
      - 认证
  /authn/login-identities/phone:
    post:
      consumes:
      - application/json
      parameters:
      - description: 手机号与验证码
        in: body
        name: request
